<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">DevMate development flow</title>
  <desc id="desc">ChatGPT connects through MCP 2026 to the DevMate Gateway, which coordinates VS Code, Obsidian, CLI workspaces, durable jobs, and remote Runners.</desc>
  <rect width="1200" height="420" rx="24" fill="#0d1117"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="60" y="62" fill="#f0f6fc" font-size="28" font-weight="700">DevMate: local-first development access for ChatGPT</text>
    <text x="60" y="92" fill="#8b949e" font-size="16">Project context, execution, durable work, and remote Runners stay under your control.</text>

    <g>
      <rect x="60" y="145" width="220" height="120" rx="18" fill="#161b22" stroke="#30363d" stroke-width="2"/>
      <text x="170" y="190" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="700">ChatGPT</text>
      <text x="170" y="220" text-anchor="middle" fill="#8b949e" font-size="15">MCP client</text>
      <text x="170" y="244" text-anchor="middle" fill="#8b949e" font-size="15">project-aware conversation</text>
    </g>

    <g>
      <line x1="280" y1="205" x2="410" y2="205" stroke="#58a6ff" stroke-width="4"/>
      <polygon points="410,205 394,196 394,214" fill="#58a6ff"/>
      <text x="345" y="184" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="600">HTTPS /mcp</text>
      <text x="345" y="230" text-anchor="middle" fill="#8b949e" font-size="13">MCP 2026 · stateless</text>
    </g>

    <g>
      <rect x="410" y="125" width="340" height="160" rx="20" fill="#161b22" stroke="#58a6ff" stroke-width="2.5"/>
      <text x="580" y="170" text-anchor="middle" fill="#f0f6fc" font-size="24" font-weight="700">DevMate Gateway</text>
      <text x="580" y="201" text-anchor="middle" fill="#c9d1d9" font-size="15">workspace + tool policy</text>
      <text x="580" y="226" text-anchor="middle" fill="#c9d1d9" font-size="15">files · commands · Git · previews</text>
      <text x="580" y="251" text-anchor="middle" fill="#c9d1d9" font-size="15">leases · approvals · audit · durable jobs</text>
    </g>

    <g>
      <line x1="750" y1="175" x2="860" y2="175" stroke="#3fb950" stroke-width="4"/>
      <polygon points="860,175 844,166 844,184" fill="#3fb950"/>
      <rect x="860" y="120" width="280" height="110" rx="18" fill="#161b22" stroke="#30363d" stroke-width="2"/>
      <text x="1000" y="158" text-anchor="middle" fill="#f0f6fc" font-size="20" font-weight="700">Local project surfaces</text>
      <text x="1000" y="187" text-anchor="middle" fill="#c9d1d9" font-size="15">VS Code · Obsidian · CLI</text>
      <text x="1000" y="211" text-anchor="middle" fill="#8b949e" font-size="14">current project + desktop context</text>
    </g>

    <g>
      <line x1="750" y1="250" x2="860" y2="300" stroke="#d2a8ff" stroke-width="4"/>
      <polygon points="860,300 843,300 850,285" fill="#d2a8ff"/>
      <rect x="860" y="270" width="280" height="100" rx="18" fill="#161b22" stroke="#30363d" stroke-width="2"/>
      <text x="1000" y="308" text-anchor="middle" fill="#f0f6fc" font-size="20" font-weight="700">Remote Runners</text>
      <text x="1000" y="337" text-anchor="middle" fill="#c9d1d9" font-size="15">scoped platform execution</text>
      <text x="1000" y="359" text-anchor="middle" fill="#8b949e" font-size="14">/runner/v1 · durable jobs</text>
    </g>

    <g>
      <rect x="60" y="320" width="690" height="52" rx="14" fill="#161b22" stroke="#30363d"/>
      <text x="85" y="352" fill="#8b949e" font-size="14">Core boundaries:</text>
      <text x="190" y="352" fill="#c9d1d9" font-size="14">project isolation · local-first state · crash-safe persistence · ownership-aware lifecycle</text>
    </g>
  </g>
</svg>
