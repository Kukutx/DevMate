name: Bug report
description: Report a reproducible problem in DevMate
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include credentials, private endpoints, tokens, or sensitive filesystem paths.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence of steps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DevMate version
      placeholder: e.g. 3.8.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, VS Code/Obsidian version, and relevant runtime details.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Include only redacted logs or diagnostics. Never paste secrets.
