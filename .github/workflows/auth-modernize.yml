name: OAuth identity refactor

on:
  push:
    branches:
      - fix/final-deep-hardening

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/final-deep-hardening
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: node scripts/auth-modernize.mjs
      - name: Commit identity refactor
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gateway/team-access.mjs gateway/team-management-tools.mjs scripts/standalone-runtime.mjs shared/config-store.cjs shared/instance-config.cjs
          git commit -m "refactor: unify member identity behind OAuth"
          git push origin HEAD:fix/final-deep-hardening
