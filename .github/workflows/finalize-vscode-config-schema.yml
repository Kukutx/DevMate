name: Finalize VS Code Config Schema

on:
  push:
    branches:
      - refactor/runtime-concurrency-hardening
    paths:
      - scripts/finalize-vscode-config-schema.mjs
      - .github/workflows/finalize-vscode-config-schema.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/runtime-concurrency-hardening
          fetch-depth: 0

      - name: Apply asserted migration
        run: node scripts/finalize-vscode-config-schema.mjs

      - name: Remove all temporary migration files
        run: |
          rm -f scripts/finalize-vscode-config-schema.mjs
          rm -f scripts/apply-spawn-layer-lifecycle.mjs
          rm -f .github/workflows/finalize-vscode-config-schema.yml

      - name: Commit final schema cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Kukutx@users.noreply.github.com"
          git add -A extension.js scripts .github/workflows
          git commit -m "Finalize VS Code shared config schema"
          git push origin HEAD:refactor/runtime-concurrency-hardening
