name: Prepare DevMate 3.3.0

on:
  push:
    branches:
      - refactor/shared-tunnel-runtime
    paths:
      - .github/workflows/prepare-release-3-3.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest branch
        uses: actions/checkout@v4
        with:
          ref: refactor/shared-tunnel-runtime
          fetch-depth: 0
      - name: Install
        run: npm ci
      - name: Update release metadata
        run: |
          node scripts/prepare-release-3-3.cjs
          npm run version:sync
      - name: Validate release metadata and tests
        run: |
          npm run check
          npm run test:unit
      - name: Commit synchronized 3.3.0 release
        shell: bash
        run: |
          git rm scripts/prepare-release-3-3.cjs .github/workflows/prepare-release-3-3.yml
          git add CHANGELOG.md package.json package-lock.json extension.js gateway/server.mjs host/runtime/constants.js scripts/devmate-command.mjs tests/smoke-gateway.mjs tests/smoke-local-capabilities.mjs obsidian-plugin/manifest.json obsidian-plugin/package.json obsidian-plugin/versions.json
          git config user.name kukutx
          git config user.email 61358650+Kukutx@users.noreply.github.com
          git commit -m "Prepare DevMate 3.3.0"
          git push origin HEAD:refactor/shared-tunnel-runtime
