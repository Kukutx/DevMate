name: MCP v2 codemod

on:
  push:
    branches:
      - fix/final-deep-hardening

permissions:
  contents: write

jobs:
  codemod:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/final-deep-hardening

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Run official MCP v2 codemod
        run: npx --yes @modelcontextprotocol/codemod@latest v1-to-v2 .

      - name: Commit codemod result
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (-not (git diff --cached --quiet)) {
            git commit -m "refactor: apply official MCP v2 codemod"
            git push origin HEAD:fix/final-deep-hardening
          }
