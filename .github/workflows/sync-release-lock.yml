name: Sync release lockfile

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: sync-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sync-release:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Generate release metadata and lockfile
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q '^## 3\.5\.0$' CHANGELOG.md; then
            python - <<'PY'
          from pathlib import Path
          file = Path('CHANGELOG.md')
          text = file.read_text(encoding='utf-8')
          header = '''# Changelog

          ## 3.5.0

          - Fixed Gateway startup failures caused by accumulated audit and backup state, and added idle runtime high-water maintenance so state remains bounded after startup.
          - Added durable startup-stage and degraded health diagnostics shared by VS Code and Obsidian, including cross-restart recovery and generation fencing.
          - Moved the embedded Runner behind ordered MCP capability initialization so queued Jobs cannot execute before reviewed targets are registered.
          - Prefer standalone Node.js over editor Electron runtimes, tightly bound runtime probes, and added real VS Code Extension Host startup coverage.
          - Strengthened large-state, packaged VSIX, Obsidian, Docker, Godot, Node Current, and security regression coverage while updating the stable development toolchain.

          '''
          if not text.startswith('# Changelog\n'):
              raise SystemExit('Unexpected CHANGELOG.md header')
          file.write_text(header + text[len('# Changelog\n\n'):], encoding='utf-8')
          PY
          fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm run version:sync

      - name: Commit generated release state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Release state already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json CHANGELOG.md obsidian-plugin/manifest.json obsidian-plugin/package.json obsidian-plugin/versions.json
          git commit -m 'Synchronize DevMate 3.5.0 release state'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:${GITHUB_HEAD_REF}"
