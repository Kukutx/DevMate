name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-development-dependencies:
    name: Patch and verify development dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@v4
        with:
          ref: maintenance/2.9.2-final-deep-dig
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply non-breaking npm audit fixes
        run: |
          npm audit fix --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci

      - name: Require clean runtime and development audits
        run: |
          npm audit --omit=dev --audit-level=moderate
          npm audit --audit-level=moderate

      - name: Validate the patched development tree
        run: |
          npm run check
          npm run test:unit
          npm run smoke:gateway
          npm run package:vsix

      - name: Restore normal CI and commit audited lockfile
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout origin/master -- .github/workflows/ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json .github/workflows/ci.yml gateway/server.bundle.mjs
          git commit -m 'Patch audited development dependency tree'
          git push origin HEAD:maintenance/2.9.2-final-deep-dig
