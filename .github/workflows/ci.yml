name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  generate-final-source:
    name: Generate and commit final maintenance source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@v4
        with:
          ref: maintenance/2.9.2-final-deep-dig
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate final source files
        run: node scripts/generate-final-files.mjs

      - name: Refresh lockfile and validate generated tree
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci
          npm run check
          npm run test:unit
          npm run smoke:gateway

      - name: Replace temporary generation files with the normal CI tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout origin/master -- .github/workflows/ci.yml
          git rm -f --ignore-unmatch \
            .github/workflows/release-metadata-sync.yml \
            scripts/apply-final-hardening.mjs \
            scripts/generate-final-files.mjs

      - name: Commit generated maintenance source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Apply DevMate 2.9.2 verified maintenance source"
          git push origin HEAD:maintenance/2.9.2-final-deep-dig
