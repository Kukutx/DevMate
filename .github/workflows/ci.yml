name: DevMate 4 CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devmate4-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Runtime / ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, node: 24 }
          - { os: ubuntu-latest, node: 24 }
          - { os: ubuntu-latest, node: 26 }
          - { os: macos-latest, node: 24 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install ripgrep where the image lacks it
        shell: bash
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            # Package feeds have outages, and Chocolatey reports success when its feed timed out:
            # what counts is that rg is there afterwards. One failed request must not fail a release.
            for attempt in 1 2 3 4; do
              case "$RUNNER_OS" in
                Linux) sudo apt-get update && sudo apt-get install --yes --no-install-recommends ripgrep || true ;;
                macOS) brew install ripgrep || true ;;
                Windows) choco install ripgrep --no-progress --yes || true ;;
              esac
              if command -v rg >/dev/null 2>&1; then break; fi
              echo "ripgrep is not installed yet (attempt $attempt of 4)"
              sleep 30
            done
          fi
          rg --version | head -n 1
      - name: Lint for mistakes
        run: npm run lint
      - name: Validate source and package contracts
        run: npm run check
      - name: Retained runtime and domain tests
        run: npm run test:unit
      # The extension in a real editor: two VS Code instances and a third window start together and must share one runtime.
      - name: Cache the editor of the real-host test
        if: ${{ runner.os == 'Windows' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .vscode-test
          key: vscode-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json') }}
      - name: Real VS Code extension host
        if: ${{ runner.os == 'Windows' }}
        run: npm run test:vscode-host
      # One build: smoke-tested as packaged, then packaged for both hosts from that same build.
      - name: Build, smoke-test and package one candidate
        run: npm run candidate
      - name: Upload validated candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: devmate4-${{ matrix.os }}-node${{ matrix.node }}
          if-no-files-found: error
          path: |
            dist/release/*
            dist/release-notes.md
            dist/**/build-manifest.json
  godot-real:
    name: Linux and Real Godot 4.7.1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: 4.7.1
      GODOT_STATUS: stable

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb

      - name: Cache Godot editor
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .godot-ci
          key: godot-${{ runner.os }}-${{ runner.arch }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}

      - name: Download and verify official Godot editor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .godot-ci
          archive="Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          executable="Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          if [ ! -x ".godot-ci/${executable}" ]; then
            api="https://api.github.com/repos/godotengine/godot-builds/releases/tags/${GODOT_VERSION}-${GODOT_STATUS}"
            curl --fail --silent --show-error --location "$api" --output .godot-ci/release.json
            archive_url=$(jq -r --arg name "$archive" '.assets[] | select(.name == $name) | .browser_download_url' .godot-ci/release.json)
            sums_url=$(jq -r '.assets[] | select(.name == "SHA512-SUMS.txt") | .browser_download_url' .godot-ci/release.json)
            test -n "$archive_url" && test "$archive_url" != "null"
            test -n "$sums_url" && test "$sums_url" != "null"
            curl --fail --silent --show-error --location "$archive_url" --output ".godot-ci/${archive}"
            curl --fail --silent --show-error --location "$sums_url" --output .godot-ci/SHA512-SUMS.txt
            (
              cd .godot-ci
              checksum_line=$(awk -v file="$archive" '$NF == file { print; exit }' SHA512-SUMS.txt)
              test -n "$checksum_line"
              printf '%s\n' "$checksum_line" | sha512sum --check --strict -
              unzip -q -o "$archive"
              chmod +x "$executable"
            )
          fi
          echo "GODOT_REAL_BIN=$PWD/.godot-ci/${executable}" >> "$GITHUB_ENV"

      - name: Show Godot version
        run: "$GODOT_REAL_BIN --version"

      - name: Run real Godot validation, native QA, and performance sampling
        run: node --test tests/godot-real-runtime.test.mjs

      - name: Run real Godot deterministic movie capture
        run: xvfb-run --auto-servernum node --test tests/godot-real-capture.test.mjs

  validation-gate:
    name: Validation Gate
    if: ${{ always() }}
    needs: [verify, godot-real]
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation job
        shell: pwsh
        env:
          RUNTIME_RESULT: ${{ needs.verify.result }}
          GODOT_RESULT: ${{ needs.godot-real.result }}
        run: |
          if ($env:RUNTIME_RESULT -ne 'success' -or $env:GODOT_RESULT -ne 'success') {
            throw 'A required DevMate 4 validation job did not succeed.'
          }
