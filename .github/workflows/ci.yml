name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit development dependencies
        shell: pwsh
        run: |
          npm audit --audit-level=moderate
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::Development dependency audit reported advisories. Runtime dependencies already passed the blocking audit."
            exit 0
          }

      - name: Check syntax
        run: npm run check

      - name: Unit tests
        run: npm run test:unit

      - name: Production gateway policy tests
        run: node --test tests/request-guard-stream.test.mjs tests/team-approval-integration.test.mjs tests/http-observability.test.mjs

      - name: Smoke test gateway
        run: npm run smoke:gateway

      - name: Package VSIX
        run: npm run package:vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: devmate-vsix
          path: "*.vsix"
