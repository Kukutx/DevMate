name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: write

jobs:
  sync-final:
    name: One-time final branch synchronization
    if: github.event_name == 'pull_request' && github.head_ref == 'maintenance/2.9.2-final-deep-dig'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/2.9.2-final-deep-dig
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply hardening and release metadata
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-final-hardening.mjs
          python - <<'PY'
          from pathlib import Path
          p = Path('CHANGELOG.md')
          text = p.read_text(encoding='utf-8')
          if '\n## 2.9.2\n' not in text:
              header = '''# Changelog

## 2.9.2

- Added a read-only release-version contract so CI fails instead of silently rewriting package, lockfile, extension, Gateway, CLI, smoke-test, and changelog versions.
- Added shared cross-process configuration locking, 16 MiB config bounds, 128 MiB durable-state bounds, and validated replacement recovery before cleanup or quarantine.
- Made external Job selection and Runner Claim fencing one durable-document transaction, eliminating the crash window between Job ownership and proof issuance.
- Bounded in-memory metric cardinality, normalized per-Job Runner routes, and exposed dropped-series counters.
- Bounded local and published preview servers/sessions, restricted static proxies to GET/HEAD, added upstream timeouts, and made malformed cookie/path encoding non-fatal.
- Added deterministic preview shutdown, connection limits, and per-workspace/global capacity controls without changing public tool inputs.
- Added regression coverage for version drift, config locks and size limits, atomic external claims, metric series pressure, preview capacity, malformed cookies, and resource cleanup.

## 2.9.1

- Added configuration conflict detection, retryable mutations, atomic replacement recovery, recursive audit redaction, fixed-window rate-map bounds, external Runner claim fencing, and Job-store capacity limits.
- Added Windows and Linux full repository/test/Gateway verification while preserving existing public MCP and Godot workflows.

'''
              assert text.startswith('# Changelog\n')
              p.write_text(header + text[len('# Changelog\n\n'):], encoding='utf-8')
          PY
          node scripts/sync-version.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Apply DevMate 2.9.2 final maintenance hardening [skip ci]"
            git push origin HEAD:maintenance/2.9.2-final-deep-dig
          fi

  verify:
    needs: sync-final
    if: always() && (needs.sync-final.result == 'success' || needs.sync-final.result == 'skipped')
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit development dependencies
        shell: pwsh
        run: |
          npm audit --audit-level=moderate
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::Development dependency audit reported advisories. Runtime dependencies already passed the blocking audit."
            exit 0
          }

      - name: Repository contracts
        run: npm run check

      - name: Discovered unit and policy tests
        run: npm run test:unit

      - name: Smoke test gateway
        run: npm run smoke:gateway

      - name: Package VSIX
        run: npm run package:vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: devmate-vsix
          path: "*.vsix"

  godot-real:
    needs: sync-final
    if: always() && (needs.sync-final.result == 'success' || needs.sync-final.result == 'skipped')
    name: Linux and Real Godot 4.7.1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: 4.7.1
      GODOT_STATUS: stable

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Linux repository contracts
        run: npm run check

      - name: Linux discovered unit and policy tests
        run: npm run test:unit

      - name: Linux gateway smoke test
        run: npm run smoke:gateway

      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb

      - name: Cache Godot editor
        uses: actions/cache@v4
        with:
          path: .godot-ci
          key: godot-${{ runner.os }}-${{ runner.arch }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}

      - name: Download and verify official Godot editor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .godot-ci
          archive="Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          executable="Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          if [ ! -x ".godot-ci/${executable}" ]; then
            api="https://api.github.com/repos/godotengine/godot-builds/releases/tags/${GODOT_VERSION}-${GODOT_STATUS}"
            curl --fail --silent --show-error --location "$api" --output .godot-ci/release.json
            archive_url=$(jq -r --arg name "$archive" '.assets[] | select(.name == $name) | .browser_download_url' .godot-ci/release.json)
            sums_url=$(jq -r '.assets[] | select(.name == "SHA512-SUMS.txt") | .browser_download_url' .godot-ci/release.json)
            test -n "$archive_url" && test "$archive_url" != "null"
            test -n "$sums_url" && test "$sums_url" != "null"
            curl --fail --silent --show-error --location "$archive_url" --output ".godot-ci/${archive}"
            curl --fail --silent --show-error --location "$sums_url" --output .godot-ci/SHA512-SUMS.txt
            (
              cd .godot-ci
              checksum_line=$(awk -v file="$archive" '$NF == file { print; exit }' SHA512-SUMS.txt)
              test -n "$checksum_line"
              printf '%s\n' "$checksum_line" | sha512sum --check --strict -
              unzip -q -o "$archive"
              chmod +x "$executable"
            )
          fi
          echo "GODOT_REAL_BIN=$PWD/.godot-ci/${executable}" >> "$GITHUB_ENV"

      - name: Show Godot version
        run: "$GODOT_REAL_BIN --version"

      - name: Run real Godot validation, native QA, and performance sampling
        run: node --test tests/godot-real-runtime.test.mjs

      - name: Run real Godot deterministic movie capture
        run: xvfb-run --auto-servernum node --test tests/godot-real-capture.test.mjs
