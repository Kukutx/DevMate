name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Windows, VS Code 1.133, Node 24 LTS
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit complete dependency tree
        run: npm audit --audit-level=moderate

      - name: Repository contracts
        run: npm run check

      - name: Discovered unit and policy tests
        run: npm run test:unit

      - name: Smoke test gateway
        run: npm run smoke:gateway

      - name: Package VSIX
        run: npm run package:vsix

      - name: Real VS Code Extension Host E2E
        run: npm run test:vscode-host

      - name: Smoke test packaged VSIX runtime
        run: node scripts/smoke-vsix-runtime.mjs

      - name: Smoke test packaged VSIX shared tunnel
        run: node scripts/smoke-vsix-shared-tunnel.mjs

      - name: Build Obsidian plugin
        run: npm run build:obsidian

      - name: Smoke test Obsidian runtime bundle
        run: node scripts/smoke-obsidian-runtime.mjs

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: devmate-vsix
          path: "*.vsix"

      - name: Upload Obsidian plugin artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: devmate-obsidian
          path: obsidian-plugin/dist/**

  node-current:
    name: Node 26 Current compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node Current
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit complete dependency tree
        run: npm audit --audit-level=moderate

      - name: Repository contracts
        run: npm run check

      - name: Discovered unit and policy tests
        run: npm run test:unit

      - name: Smoke test gateway
        run: npm run smoke:gateway

      - name: Package and smoke VSIX
        run: |
          npm run package:vsix
          node scripts/smoke-vsix-runtime.mjs

      - name: Build and smoke Obsidian runtime
        run: |
          npm run build:obsidian
          node scripts/smoke-obsidian-runtime.mjs

  godot-real:
    name: Linux and Real Godot 4.7.1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: 4.7.1
      GODOT_STATUS: stable

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Linux runtime dependency audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Linux complete dependency audit
        run: npm audit --audit-level=moderate

      - name: Linux repository contracts
        run: npm run check

      - name: Linux discovered unit and policy tests
        run: npm run test:unit

      - name: Linux gateway smoke test
        run: npm run smoke:gateway

      - name: Linux package VSIX
        run: npm run package:vsix

      - name: Linux packaged VSIX runtime smoke test
        run: node scripts/smoke-vsix-runtime.mjs

      - name: Linux packaged VSIX shared tunnel smoke test
        run: node scripts/smoke-vsix-shared-tunnel.mjs

      - name: Linux Obsidian plugin build
        run: npm run build:obsidian

      - name: Linux Obsidian runtime bundle smoke test
        run: node scripts/smoke-obsidian-runtime.mjs

      - name: Linux standalone Docker build and network smoke
        shell: bash
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/devmate-docker-state"
          workspace="$RUNNER_TEMP/devmate-docker-workspace"
          mkdir -p "$state" "$workspace"
          chmod 0777 "$state" "$workspace"
          docker build --file deploy/docker/Dockerfile --tag devmate-ci .
          docker run --rm \
            --volume "$state:/var/lib/devmate" \
            --volume "$workspace:/srv/devmate-workspaces" \
            devmate-ci init \
            --workspace /srv/devmate-workspaces \
            --config /var/lib/devmate/config.json \
            --provider external \
            --public-url https://standalone-ci.example.test >/dev/null
          docker run --detach \
            --name devmate-ci-runtime \
            --publish 127.0.0.1:18787:8787 \
            --volume "$state:/var/lib/devmate" \
            --volume "$workspace:/srv/devmate-workspaces" \
            devmate-ci serve --config /var/lib/devmate/config.json
          trap 'docker rm --force devmate-ci-runtime >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --header 'Host: standalone-ci.example.test' http://127.0.0.1:18787/health >/dev/null; then
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' devmate-ci-runtime 2>/dev/null || true)" != "true" ]; then
              docker logs devmate-ci-runtime || true
              exit 1
            fi
            sleep 1
          done
          docker logs devmate-ci-runtime || true
          exit 1

      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb

      - name: Cache Godot editor
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .godot-ci
          key: godot-${{ runner.os }}-${{ runner.arch }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}

      - name: Download and verify official Godot editor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .godot-ci
          archive="Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          executable="Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          if [ ! -x ".godot-ci/${executable}" ]; then
            api="https://api.github.com/repos/godotengine/godot-builds/releases/tags/${GODOT_VERSION}-${GODOT_STATUS}"
            curl --fail --silent --show-error --location "$api" --output .godot-ci/release.json
            archive_url=$(jq -r --arg name "$archive" '.assets[] | select(.name == $name) | .browser_download_url' .godot-ci/release.json)
            sums_url=$(jq -r '.assets[] | select(.name == "SHA512-SUMS.txt") | .browser_download_url' .godot-ci/release.json)
            test -n "$archive_url" && test "$archive_url" != "null"
            test -n "$sums_url" && test "$sums_url" != "null"
            curl --fail --silent --show-error --location "$archive_url" --output ".godot-ci/${archive}"
            curl --fail --silent --show-error --location "$sums_url" --output .godot-ci/SHA512-SUMS.txt
            (
              cd .godot-ci
              checksum_line=$(awk -v file="$archive" '$NF == file { print; exit }' SHA512-SUMS.txt)
              test -n "$checksum_line"
              printf '%s\n' "$checksum_line" | sha512sum --check --strict -
              unzip -q -o "$archive"
              chmod +x "$executable"
            )
          fi
          echo "GODOT_REAL_BIN=$PWD/.godot-ci/${executable}" >> "$GITHUB_ENV"

      - name: Show Godot version
        run: "$GODOT_REAL_BIN --version"

      - name: Run real Godot validation, native QA, and performance sampling
        run: node --test tests/godot-real-runtime.test.mjs

      - name: Run real Godot deterministic movie capture
        run: xvfb-run --auto-servernum node --test tests/godot-real-capture.test.mjs
