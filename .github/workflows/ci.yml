name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  upgrade-runtime-dependency:
    name: Upgrade and verify MCP runtime dependency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@v4
        with:
          ref: maintenance/2.9.2-final-deep-dig
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upgrade official MCP SDK and regenerate lockfile
        run: |
          npm pkg set 'dependencies.@modelcontextprotocol/sdk=^1.30.0'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci

      - name: Require a clean runtime audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Validate upgraded dependency tree
        run: |
          npm run check
          npm run test:unit
          npm run smoke:gateway

      - name: Restore normal CI and commit audited dependency tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout origin/master -- .github/workflows/ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json .github/workflows/ci.yml gateway/server.bundle.mjs
          git commit -m 'Upgrade MCP SDK to audited 1.30.0 runtime'
          git push origin HEAD:maintenance/2.9.2-final-deep-dig
