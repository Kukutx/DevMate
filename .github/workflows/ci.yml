name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh lockfile for dependency verification
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit refreshed lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: pwsh
        run: |
          git diff --quiet -- package-lock.json
          if ($LASTEXITCODE -eq 0) {
            Write-Host "package-lock.json is already current."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Update package lock for security overrides"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Install
        run: npm ci

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit development dependencies
        shell: pwsh
        run: |
          npm audit --audit-level=moderate
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::Development dependency audit reported advisories. Runtime dependencies already passed the blocking audit."
            exit 0
          }

      - name: Check syntax
        run: npm run check

      - name: Unit tests
        run: npm run test:unit

      - name: Smoke test gateway
        run: npm run smoke:gateway

      - name: Package VSIX
        run: npm run package:vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: devmate-vsix
          path: "*.vsix"
