name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  generate-final-source:
    name: Generate final maintenance source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate final source files
        run: node scripts/generate-final-files.mjs

      - name: Refresh lockfile and validate generated tree
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci
          npm run check
          npm run test:unit
          npm run smoke:gateway

      - name: Pack generated source files
        shell: bash
        run: |
          tar -czf devmate-generated-files.tar.gz \
            package-lock.json \
            CHANGELOG.md \
            extension.js \
            extension-config-io.js \
            gateway/server.mjs \
            gateway/local-shared.mjs \
            gateway/durable-state.mjs \
            gateway/runner-claim-fencing.mjs \
            gateway/runner-control-plane.mjs \
            scripts/devmate-command.mjs \
            tests/smoke-gateway.mjs \
            tests/smoke-local-capabilities.mjs

      - name: Upload generated source
        uses: actions/upload-artifact@v4
        with:
          name: devmate-generated-source
          path: devmate-generated-files.tar.gz
