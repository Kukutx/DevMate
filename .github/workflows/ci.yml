name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh lockfile for dependency verification
        run: npm install --package-lock-only --ignore-scripts

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json

      - name: Install
        run: npm ci

      - name: Capture runtime audit report
        shell: pwsh
        run: |
          npm audit --omit=dev --json | Out-File -FilePath npm-audit-runtime.json -Encoding utf8
          exit 0

      - name: Upload runtime audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-runtime
          path: npm-audit-runtime.json

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit development dependencies
        shell: pwsh
        run: |
          npm audit --audit-level=moderate
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::Development dependency audit reported advisories. Runtime dependencies already passed the blocking audit."
            exit 0
          }

      - name: Check syntax
        run: npm run check

      - name: Unit tests
        run: npm run test:unit

      - name: Smoke test gateway
        run: npm run smoke:gateway

      - name: Package VSIX
        run: npm run package:vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: devmate-vsix
          path: "*.vsix"
