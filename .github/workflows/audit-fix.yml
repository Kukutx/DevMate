name: One-time repository audit fixes

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[audit-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply audited fixes and regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(p):
              return Path(p).read_text()

          def write(p, text):
              Path(p).write_text(text)

          def replace(p, old, new, required=True):
              text = read(p)
              if old not in text:
                  if required:
                      raise SystemExit(f'missing expected pattern in {p}: {old!r}')
                  return 0
              count = text.count(old)
              write(p, text.replace(old, new))
              print(f'{p}: replaced {count} occurrence(s)')
              return count

          path_files = [
              'gateway/local-shared.mjs',
              'gateway/job-artifacts.mjs',
              'gateway/maintenance.mjs',
              'extension.js',
              'gateway/server.mjs',
              'gateway/plugins/godot-audit.mjs',
              'gateway/plugins/godot-graph.mjs',
              'gateway/work-session-rollback.mjs',
              'gateway/plugins/plugin-runtime.mjs',
              'gateway/plugins/preview-manager.mjs',
              'gateway/plugins/browser-runner.mjs',
          ]
          neg = re.compile(r"!([A-Za-z_$][A-Za-z0-9_$]*)\.startsWith\('\.\.'\)")
          pos = re.compile(r"([A-Za-z_$][A-Za-z0-9_$]*)\.startsWith\('\.\.'\)")
          for p in path_files:
              text = read(p)
              text, neg_count = neg.subn(lambda m: f"{m.group(1)} !== '..' && !{m.group(1)}.startsWith(`..${{path.sep}}`)", text)
              text, pos_count = pos.subn(lambda m: f"{m.group(1)} === '..' || {m.group(1)}.startsWith(`..${{path.sep}}`)", text)
              if not (neg_count or pos_count):
                  raise SystemExit(f'no unsafe containment expression found in {p}')
              write(p, text)
              print(f'{p}: containment fixes={neg_count + pos_count}')

          replace(
              'gateway/maintenance.mjs',
              "import path from 'node:path';\n",
              "import path from 'node:path';\nimport crypto from 'node:crypto';\n"
          )
          replace(
              'gateway/maintenance.mjs',
              "    const tmp = `${auditLog}.${process.pid}.tmp`;\n    await fsp.writeFile(tmp, next, 'utf8');\n    await fsp.rename(tmp, auditLog);",
              "    const tmp = `${auditLog}.${process.pid}.${crypto.randomBytes(6).toString('hex')}.tmp`;\n    try {\n      await fsp.writeFile(tmp, next, { encoding: 'utf8', mode: 0o600 });\n      try { await fsp.chmod(tmp, 0o600); } catch {}\n      await fsp.rename(tmp, auditLog);\n      try { await fsp.chmod(auditLog, 0o600); } catch {}\n    } finally {\n      try { await fsp.rm(tmp, { force: true }); } catch {}\n    }"
          )

          replace(
              'gateway/command-process.mjs',
              "  if (child.exitCode != null) return Promise.resolve({ code: child.exitCode, signal: child.signalCode || null });",
              "  if (child.exitCode != null || child.signalCode != null) return Promise.resolve({ code: child.exitCode ?? null, signal: child.signalCode || null });"
          )
          replace(
              'gateway/command-process.mjs',
              "  if (!child || child.exitCode != null) return { terminated: false, forced: false, exitConfirmed: true };",
              "  if (!child || child.exitCode != null || child.signalCode != null) return { terminated: false, forced: false, exitConfirmed: true };"
          )

          replace(
              'host/runtime/process-controller.js',
              "  return !!child && child.exitCode == null;",
              "  return !!child && child.exitCode == null && child.signalCode == null;"
          )
          replace(
              'host/runtime/process-controller.js',
              "  if (!child || child.exitCode != null) return Promise.resolve(true);",
              "  if (!child || child.exitCode != null || child.signalCode != null) return Promise.resolve(true);"
          )
          replace(
              'vscode-host/tunnel-controller.js',
              "  return !!child && child.exitCode == null;",
              "  return !!child && child.exitCode == null && child.signalCode == null;"
          )
          replace(
              'scripts/devmate-runner.mjs',
              "    if (child && child.exitCode !== null) throw new Error(`Local Gateway exited before becoming ready with code ${child.exitCode}`);",
              "    if (child && (child.exitCode !== null || child.signalCode !== null)) {\n      throw new Error(`Local Gateway exited before becoming ready with code ${child.exitCode ?? 'null'}${child.signalCode ? ` signal ${child.signalCode}` : ''}`);\n    }"
          )

          replace(
              'gateway/durable-state.mjs',
              "    Number(config?.production?.requestTimeoutMs) || 0,",
              "    Number(config?.requestPolicy?.requestTimeoutMs) || 0,"
          )
          replace(
              'tests/durable-state.test.mjs',
              "    durable.configuredGatewayInstanceLeaseMs({ production: { requestTimeoutMs: 60 * 60 * 1000 } }),",
              "    durable.configuredGatewayInstanceLeaseMs({ requestPolicy: { requestTimeoutMs: 60 * 60 * 1000 } }),"
          )

          replace(
              'gateway/server.mjs',
              "async function withLock(file, fn){ const key=path.resolve(file).toLowerCase();",
              "async function withLock(file, fn){ const key=pathKey(file);"
          )

          test_file = Path('tests/repository-audit-regressions.test.cjs')
          test_file.write_text(r'''\
'use strict';

const assert = require('node:assert/strict');
const fs = require('node:fs');
const fsp = require('node:fs/promises');
const os = require('node:os');
const path = require('node:path');
const test = require('node:test');
const { childActive, waitForChildExit } = require('../host/runtime/process-controller.js');
const { childActive: tunnelChildActive } = require('../vscode-host/tunnel-controller.js');

const root = path.resolve(__dirname, '..');
const containmentFiles = [
  'gateway/local-shared.mjs',
  'gateway/job-artifacts.mjs',
  'gateway/maintenance.mjs',
  'extension.js',
  'gateway/server.mjs',
  'gateway/plugins/godot-audit.mjs',
  'gateway/plugins/godot-graph.mjs',
  'gateway/work-session-rollback.mjs',
  'gateway/plugins/plugin-runtime.mjs',
  'gateway/plugins/preview-manager.mjs',
  'gateway/plugins/browser-runner.mjs'
];

function source(relative) {
  return fs.readFileSync(path.join(root, relative), 'utf8');
}

test('path containment rejects parent segments without rejecting names that merely begin with two dots', async () => {
  for (const relative of containmentFiles) {
    assert.doesNotMatch(source(relative), /[A-Za-z_$][A-Za-z0-9_$]*\.startsWith\('\.\.'\)/, relative);
  }
  const artifacts = await import('../gateway/job-artifacts.mjs');
  const base = path.join(os.tmpdir(), 'devmate-audit-path-root');
  assert.equal(artifacts.__test.isInside(base, path.join(base, '..cache')), true);
  assert.equal(artifacts.__test.isInside(base, path.resolve(base, '..')), false);
});

test('process lifecycle treats signal-terminated children as already exited', async () => {
  const child = {
    exitCode: null,
    signalCode: 'SIGTERM',
    once() { throw new Error('waitForChildExit must not attach after terminal signal state'); }
  };
  assert.equal(childActive(child), false);
  assert.equal(tunnelChildActive(child), false);
  assert.equal(await waitForChildExit(child, 10), true);
  assert.match(source('gateway/command-process.mjs'), /exitCode != null \|\| child\.signalCode != null/);
  assert.match(source('scripts/devmate-runner.mjs'), /exitCode !== null \|\| child\.signalCode !== null/);
});

test('gateway write locking preserves case-sensitive path identities off Windows', () => {
  const server = source('gateway/server.mjs');
  assert.match(server, /async function withLock\(file, fn\)\{ const key=pathKey\(file\);/);
  assert.doesNotMatch(server, /path\.resolve\(file\)\.toLowerCase\(\)/);
});

test('audit pruning keeps private permissions and supports overlapping prune calls', async () => {
  const { pruneAuditLog } = await import('../gateway/maintenance.mjs');
  const dir = await fsp.mkdtemp(path.join(os.tmpdir(), 'devmate-audit-prune-'));
  const audit = path.join(dir, 'audit.jsonl');
  try {
    const lines = [];
    for (let i = 0; i < 80; i += 1) {
      lines.push(JSON.stringify({ time: '2026-06-18T00:00:00.000Z', index: i, payload: 'x'.repeat(5000) }));
    }
    await fsp.writeFile(audit, `${lines.join('\n')}\n`, { encoding: 'utf8', mode: 0o600 });
    const options = { auditRetentionDays: 30, maxAuditBytes: 256 * 1024 };
    await Promise.all([
      pruneAuditLog(audit, options, Date.parse('2026-06-19T00:00:00.000Z')),
      pruneAuditLog(audit, options, Date.parse('2026-06-19T00:00:00.000Z'))
    ]);
    if (process.platform !== 'win32') {
      assert.equal((await fsp.stat(audit)).mode & 0o777, 0o600);
    }
    const leftovers = (await fsp.readdir(dir)).filter(name => name.endsWith('.tmp'));
    assert.deepEqual(leftovers, []);
  } finally {
    await fsp.rm(dir, { recursive: true, force: true });
  }
});

test('instance lock lease follows the current requestPolicy timeout field', () => {
  const durable = source('gateway/durable-state.mjs');
  assert.match(durable, /config\?\.requestPolicy\?\.requestTimeoutMs/);
  assert.doesNotMatch(durable, /config\?\.production\?\.requestTimeoutMs/);
});
''')

          # Make the one-time patch fail if any known unsafe containment check survived.
          for p in path_files:
              text = read(p)
              if re.search(r"[A-Za-z_$][A-Za-z0-9_$]*\.startsWith\('\.\.'\)", text):
                  raise SystemExit(f'unsafe containment prefix check still present in {p}')
          PY

          git diff --check
          git status --short

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name kukutx
          git config user.email 61358650+Kukutx@users.noreply.github.com
          git add gateway host vscode-host scripts extension.js tests
          if git diff --cached --quiet; then
            echo "No audit fixes required."
            exit 0
          fi
          git commit -m "Fix repository audit findings [audit-fix]"
          git push origin HEAD:master
