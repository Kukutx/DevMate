name: Finalize runtime hardening 3.3.9 once

on:
  push:
    branches: [runtime-hardening-339]
    paths: [.github/workflows/finalize-runtime-hardening-339-once.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Finalize diagnostics propagation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(rel, old, new):
              p = Path(rel)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one contract in {rel}, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          replace_once('extension.js',
              "    return {ok:false,error:message,code:e.code || 'DEVMATE_START_FAILED'};",
              """    return {
                ok:false,
                error:message,
                code:e.code || 'DEVMATE_START_FAILED',
                failureDetails:{
                  provider:e.provider ?? null,
                  providerOutput:e.providerOutput ?? null,
                  exitCode:e.exitCode ?? null,
                  signalCode:e.signalCode ?? null,
                  cleanupPending:e.cleanupPending === true,
                  cleanupReason:e.cleanupReason ?? null,
                  ngrokVersion:e.ngrokVersion ?? null,
                  health:e.health ?? null,
                  diagnostics:e.diagnostics ?? null
                }
              };""")

          replace_once('vscode-host/lifecycle.js',
              """      const error = new Error(commandResult.error || 'DevMate start command reported failure');
                error.code = commandResult.code || 'DEVMATE_VSCODE_START_COMMAND_FAILED';
                throw error;""",
              """      const error = new Error(commandResult.error || 'DevMate start command reported failure');
                error.code = commandResult.code || 'DEVMATE_VSCODE_START_COMMAND_FAILED';
                if (commandResult.failureDetails && typeof commandResult.failureDetails === 'object') {
                  Object.assign(error, commandResult.failureDetails);
                }
                throw error;""")

          replace_once('vscode-host/tunnel-controller.js',
              """    this.lastConflictRecovery = null;
              this.stopping = false;""",
              """    this.lastConflictRecovery = null;
              this.lastProviderFailure = null;
              this.stopping = false;""")

          replace_once('vscode-host/tunnel-controller.js',
              """    } catch (error) {
              let cleanup = { exited: true, forced: false };""",
              """    } catch (error) {
              this.lastProviderFailure = {
                at: nowIso(),
                code: error?.code || null,
                message: String(error?.message || error).slice(0, 2000),
                provider: launch.provider,
                providerOutput: error?.providerOutput ? String(error.providerOutput).slice(0, 4000) : null,
                exitCode: error?.exitCode ?? null,
                signalCode: error?.signalCode || null,
                cleanupPending: error?.cleanupPending === true,
                cleanupReason: error?.cleanupReason ? String(error.cleanupReason).slice(0, 1000) : null
              };
              let cleanup = { exited: true, forced: false };""")

          replace_once('vscode-host/tunnel-controller.js',
              """      lastNgrokProbe: this.lastNgrokProbe,
              lastConflictRecovery: this.lastConflictRecovery,""",
              """      lastNgrokProbe: this.lastNgrokProbe,
              lastConflictRecovery: this.lastConflictRecovery,
              lastProviderFailure: this.lastProviderFailure,""")

          replace_once('extension-entry-shared-tunnel.js',
              "    lifecycle = new VscodeHostLifecycle({\n      vscode,",
              "  lifecycle = new VscodeHostLifecycle({\n      vscode,")

          p = Path('tests/runtime-hardening-339.test.cjs')
          text = p.read_text()
          marker = "  assert.match(extension, /publicMcpPreflightMs/);"
          if marker not in text:
              raise SystemExit('test marker missing')
          p.write_text(text.replace(marker, marker + "\n  assert.match(extension, /failureDetails/);\n  assert.match(tunnel, /lastProviderFailure/);", 1))
          PY
          rm -f .github/workflows/finalize-runtime-hardening-339-once.yml
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - run: npm run smoke:gateway
      - name: Commit finalization
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete runtime failure diagnostics"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:runtime-hardening-339
