name: Remove Legacy Master

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete legacy master branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          default_branch=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')
          test "$default_branch" = "main"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/master"
          remaining=$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/" --jq '.[].ref')
          test "$remaining" = "refs/heads/main"
