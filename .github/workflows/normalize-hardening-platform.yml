name: One-time platform hardening anchor normalization

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  normalize:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Normalize platform source anchor and remove this workflow
        shell: pwsh
        run: |
          $path = 'extension-entry-platform.js'
          $text = Get-Content $path -Raw
          $old = "ngrokUseManagedAccount: strictBoolean(setting('ngrokUseManagedAccount', true), 'ngrokUseManagedAccount'),"
          $new = "ngrokUseManagedAccount: strictBoolean(setting('ngrokUseManagedAccount', true), 'devMate.ngrokUseManagedAccount'),"
          if (-not $text.Contains($old)) { throw 'platform ngrok anchor not found' }
          $updated = $text.Replace($old, $new)
          Set-Content -Path $path -Value $updated -NoNewline
          Remove-Item .github/workflows/normalize-hardening-platform.yml -Force

          git config user.name "kukutx"
          git config user.email "61358650+Kukutx@users.noreply.github.com"
          git add extension-entry-platform.js .github/workflows/normalize-hardening-platform.yml
          git commit -m "Normalize platform ngrok setting label"
          git push origin master
