name: Prepare DevMate 3.6.0

on:
  push:
    branches:
      - 'release/devmate-3.6.0'

permissions:
  contents: write

concurrency:
  group: prepare-devmate-3.6.0
  cancel-in-progress: false

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: release/devmate-3.6.0
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Apply DevMate 3.6 source update
        run: |
          node scripts/prepare-devmate-3.6.0.mjs
          npm run version:sync

      - name: Install dependencies
        run: npm ci

      - name: Run unit and policy tests
        run: npm run test:unit

      - name: Run Gateway smoke tests
        run: npm run smoke:gateway

      - name: Package VSIX smoke artifact
        run: npm run package:vsix

      - name: Commit prepared release source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json CHANGELOG.md gateway/server.mjs gateway/server-runtime.mjs \
            obsidian-plugin/manifest.json obsidian-plugin/package.json obsidian-plugin/versions.json \
            tests/gateway-large-state-startup.test.mjs tests/startup-maintenance-order.test.mjs
          git diff --cached --check
          git diff --cached --quiet && { echo 'No prepared changes found' >&2; exit 1; }
          git commit -m 'DevMate 3.6.0: decouple maintenance from startup'
          git push origin HEAD:release/devmate-3.6.0
