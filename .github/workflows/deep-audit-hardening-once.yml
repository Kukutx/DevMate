name: One-time deep audit hardening

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  harden:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Apply audited hardening
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replace(file, before, after) {
            let text = fs.readFileSync(file, 'utf8');
            if (!text.includes(before)) throw new Error(`${file}: expected text not found:\n${before.slice(0, 240)}`);
            text = text.replace(before, after);
            fs.writeFileSync(file, text, 'utf8');
          }

          function replaceAll(file, before, after, expected) {
            let text = fs.readFileSync(file, 'utf8');
            const count = text.split(before).length - 1;
            if (count !== expected) throw new Error(`${file}: expected ${expected} matches, found ${count}`);
            text = text.split(before).join(after);
            fs.writeFileSync(file, text, 'utf8');
          }

          replace(
            'config-file-lock.cjs',
            "function staleLock(lock, staleMs, now = Date.now()) {\n  const acquiredAt = Date.parse(lock?.acquiredAt || 0);\n  if (!Number.isFinite(acquiredAt) || now - acquiredAt >= staleMs) return true;\n  return !processAlive(lock?.pid);\n}",
            "function staleLock(lock, staleMs, now = Date.now()) {\n  void staleMs;\n  void now;\n  // A live owner is authoritative. This synchronous lock has no heartbeat that can safely justify age-based takeover.\n  return !processAlive(lock?.pid);\n}"
          );

          const principalHelper = [
            "function principalInactive(id, detail = 'is no longer active') {",
            "  const error = new Error(`Team member ${id || 'unknown'} ${detail}`);",
            "  error.code = 'principal_inactive';",
            "  return error;",
            "}",
            "",
            "export function currentTeamPrincipal(principal, config) {",
            "  if (principal?.source !== 'team-token') return principal;",
            "  const member = config.team.members.find(item => item.id === principal.id);",
            "  if (!member) {",
            "    if (principal.tokenVersion !== undefined && principal.tokenVersion !== null) {",
            "      throw principalInactive(principal.id, 'no longer exists');",
            "    }",
            "    return principal; // Compatibility for legacy durable records and synthetic policy tests.",
            "  }",
            "  if (member.disabled || !member.salt || !member.tokenHash) throw principalInactive(principal.id);",
            "  if (!TEAM_ROLES.includes(member.role)) throw new Error(`Unknown team role: ${member.role}`);",
            "  if (member.expiresAt && Date.parse(member.expiresAt) <= Date.now()) throw principalInactive(principal.id, 'has expired');",
            "  const workspaceIds = Array.isArray(member.workspaceIds)",
            "    ? [...new Set(member.workspaceIds.filter(id => typeof id === 'string').map(id => id.trim()).filter(Boolean))]",
            "    : [];",
            "  if (!workspaceIds.length) throw principalInactive(principal.id, 'has no active workspace scope');",
            "  const tokenVersion = member.tokenVersion || 1;",
            "  if (principal.tokenVersion !== undefined && principal.tokenVersion !== null && Number(principal.tokenVersion) !== tokenVersion) {",
            "    throw principalInactive(principal.id, 'credential was rotated');",
            "  }",
            "  return {",
            "    id: member.id,",
            "    name: member.name,",
            "    role: member.role,",
            "    workspaceIds,",
            "    source: 'team-token',",
            "    tokenVersion",
            "  };",
            "}"
          ].join('\n');
          replace(
            'gateway/team-access.mjs',
            "export function fallbackLocalPrincipal() {\n  return { id: 'local-owner', name: 'Local owner', role: 'owner', workspaceIds: [], source: 'local' };\n}\n",
            "export function fallbackLocalPrincipal() {\n  return { id: 'local-owner', name: 'Local owner', role: 'owner', workspaceIds: [], source: 'local' };\n}\n\n" + principalHelper + "\n"
          );
          replace(
            'gateway/team-access.mjs',
            "  const effectivePrincipal = principal || fallbackLocalPrincipal();",
            "  const effectivePrincipal = currentTeamPrincipal(principal || fallbackLocalPrincipal(), config);"
          );
          replace(
            'gateway/team-access.mjs',
            "function dangerousCommand(command) {",
            "function dangerousGitPush(value) {\n  if (!/\\bgit\\s+push\\b/.test(value)) return false;\n  return /(?:^|\\s)-f(?:\\s|$)/.test(value) ||\n    /(?:^|\\s)--force(?:-with-lease)?(?:=\\S+)?(?:\\s|$)/.test(value) ||\n    /(?:^|\\s)\\+[^\\s]+/.test(value);\n}\n\nfunction dangerousCommand(command) {"
          );
          replace(
            'gateway/team-access.mjs',
            "    /\\bgit\\s+reset\\b.*--hard\\b/.test(value) || /\\bgit\\s+clean\\b.*-[^\\s]*[fdx]/.test(value) ||\n    /\\bgit\\s+push\\b.*--force(?:-with-lease)?\\b/.test(value);",
            "    /\\bgit\\s+reset\\b.*--hard\\b/.test(value) || /\\bgit\\s+clean\\b.*-[^\\s]*[fdx]/.test(value) ||\n    dangerousGitPush(value);"
          );
          replace(
            'gateway/team-access.mjs',
            "  if (name === 'git_raw') {\n    const values = (args?.args || []).map(value => String(value).toLowerCase());\n    const joined = values.join(' ');\n    if ((values[0] === 'reset' && values.includes('--hard')) || values[0] === 'clean' ||\n      (values[0] === 'push' && /(?:^| )--force(?:-with-lease)?(?: |$)/.test(joined))) {\n      throw new Error('High-risk raw Git operations are reserved for the owner token');\n    }\n  }",
            "  if (name === 'git_raw') {\n    const values = (args?.args || []).map(value => String(value).toLowerCase());\n    const command = values.find(value => !value.startsWith('-')) || '';\n    const forcePush = command === 'push' && (\n      values.includes('-f') ||\n      values.some(value => /^--force(?:-with-lease)?(?:=|$)/.test(value)) ||\n      values.some(value => value.startsWith('+') && value.length > 1)\n    );\n    if ((command === 'reset' && values.includes('--hard')) || command === 'clean' || forcePush) {\n      throw new Error('High-risk raw Git operations are reserved for the owner token');\n    }\n  }"
          );

          replace(
            'gateway/tool-policy.mjs',
            "function explicitCapabilityForTool(name, annotations = {}, args = {}) {",
            "function gitRawCommand(args = {}) {\n  const values = Array.isArray(args?.args)\n    ? args.args.map(value => String(value || '').trim()).filter(Boolean)\n    : [];\n  return values.find(value => !value.startsWith('-'))?.toLowerCase() || '';\n}\n\nfunction explicitCapabilityForTool(name, annotations = {}, args = {}) {"
          );
          replace(
            'gateway/tool-policy.mjs',
            "  if (tool === 'git_raw') {\n    const first = String(args?.args?.[0] || '').toLowerCase();\n    return ['push', 'pull', 'fetch', 'remote'].includes(first) ? 'publish' : 'git';\n  }",
            "  if (tool === 'git_raw') {\n    const command = gitRawCommand(args);\n    return ['push', 'pull', 'fetch', 'remote'].includes(command) ? 'publish' : 'git';\n  }"
          );
          replace(
            'gateway/tool-policy.mjs',
            "  explicitCapabilityForTool\n};",
            "  explicitCapabilityForTool,\n  gitRawCommand\n};"
          );

          replace(
            'gateway/job-queue.mjs',
            "    source: principal?.source || 'unknown',\n    workspaceIds: Array.isArray(principal?.workspaceIds) ? [...principal.workspaceIds] : []\n  };",
            "    source: principal?.source || 'unknown',\n    workspaceIds: Array.isArray(principal?.workspaceIds) ? [...principal.workspaceIds] : [],\n    tokenVersion: Number.isInteger(principal?.tokenVersion) ? principal.tokenVersion : null\n  };"
          );
          replace(
            'gateway/job-runtime.mjs',
            "          const retryable = !['job_timeout', 'job_cancelled'].includes(error?.code) && !/not allowed|requires the owner role|cannot use/i.test(message);",
            "          const retryable = !['job_timeout', 'job_cancelled', 'principal_inactive'].includes(error?.code) && !/not allowed|requires the owner role|cannot use/i.test(message);"
          );

          replace(
            'gateway/local-shared.mjs',
            "export function isDangerousCommand(command) {",
            "function dangerousGitPush(value) {\n  if (!/\\bgit\\s+push\\b/.test(value)) return false;\n  return /(?:^|\\s)-f(?:\\s|$)/.test(value) ||\n    /(?:^|\\s)--force(?:-with-lease)?(?:=\\S+)?(?:\\s|$)/.test(value) ||\n    /(?:^|\\s)\\+[^\\s]+/.test(value);\n}\n\nexport function isDangerousCommand(command) {"
          );
          replace(
            'gateway/local-shared.mjs',
            "    /\\bgit\\s+reset\\b.*--hard\\b/.test(normalized) || /\\bgit\\s+clean\\b.*-[^\\s]*[fdx]/.test(normalized) ||\n    /\\bgit\\s+push\\b.*--force(?:-with-lease)?\\b/.test(normalized);",
            "    /\\bgit\\s+reset\\b.*--hard\\b/.test(normalized) || /\\bgit\\s+clean\\b.*-[^\\s]*[fdx]/.test(normalized) ||\n    dangerousGitPush(normalized);"
          );

          replace(
            'gateway/server.mjs',
            "function isDangerousGitArgs(args=[]){\n  const a = args.map(x=>String(x).toLowerCase());\n  const joined = a.join(' ');\n  return (a[0] === 'reset' && a.includes('--hard')) ||\n    a[0] === 'clean' ||\n    (a[0] === 'push' && (a.includes('--force') || a.includes('-f') || a.includes('--force-with-lease'))) ||\n    (a[0] === 'checkout' && joined.includes(' -- ')) ||\n    (a[0] === 'restore' && (a.includes('.') || a.includes(':/' ) || a.includes('--staged')));\n}",
            "function isDangerousGitArgs(args=[]){\n  const a = args.map(x=>String(x).toLowerCase());\n  const command = a.find(value => !value.startsWith('-')) || '';\n  const joined = a.join(' ');\n  const forcePush = command === 'push' && (\n    a.includes('-f') ||\n    a.some(value => /^--force(?:-with-lease)?(?:=|$)/.test(value)) ||\n    a.some(value => value.startsWith('+') && value.length > 1)\n  );\n  return (command === 'reset' && a.includes('--hard')) ||\n    command === 'clean' ||\n    forcePush ||\n    (command === 'checkout' && joined.includes(' -- ')) ||\n    (command === 'restore' && (a.includes('.') || a.includes(':/' ) || a.includes('--staged')));\n}"
          );

          replace(
            'package.json',
            '"description": "Block destructive shell and Git patterns."',
            '"description": "Block recognized destructive shell and Git patterns in balanced mode. fullAccess intentionally bypasses this guard and should be treated as trusted execution."'
          );

          replace(
            'SECURITY.md',
            '- Team/member credentials cannot use policy-blocked force/destructive operations merely because the underlying OS account could execute them.',
            '- Team/member credentials are denied recognized direct force/destructive Git and shell patterns by policy. Execute access still runs as the DevMate OS identity and is a trusted execution boundary, not a hostile-code sandbox.'
          );
          replace(
            'SECURITY.md',
            '- Job submission/claim re-evaluates target capability, workspace scope, lease, approval, plugin state and Runner requirements. The queue is not an authorization bypass.',
            '- Job submission/claim re-evaluates current member status, role and workspace scope; current-schema jobs also bind the member credential generation. Lease, approval, plugin state and Runner requirements are rechecked as well. The queue is not an authorization bypass.'
          );

          replaceAll('.github/workflows/ci.yml', 'uses: actions/checkout@v7', 'uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7', 2);
          replaceAll('.github/workflows/ci.yml', 'uses: actions/setup-node@v7', 'uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7', 2);
          replaceAll('.github/workflows/ci.yml', 'uses: actions/upload-artifact@v7', 'uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7', 2);
          replace('.github/workflows/ci.yml', 'uses: actions/cache@v6', 'uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6');
          replace(
            '.github/workflows/ci.yml',
            "  verify:\n    runs-on: windows-latest\n\n    steps:",
            "  verify:\n    runs-on: windows-latest\n    timeout-minutes: 30\n\n    steps:"
          );
          replaceAll(
            '.github/workflows/ci.yml',
            "      - name: Checkout\n        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7\n",
            "      - name: Checkout\n        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7\n        with:\n          persist-credentials: false\n",
            2
          );

          replace('.github/workflows/release.yml', 'uses: actions/checkout@v7', 'uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7');
          replace('.github/workflows/release.yml', 'uses: actions/setup-node@v7', 'uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7');
          replace('.github/workflows/release.yml', 'uses: actions/attest@v4', 'uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4');
          replace('.github/workflows/release.yml', 'uses: actions/upload-artifact@v7', 'uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7');
          replace(
            '.github/workflows/release.yml',
            "        with:\n          fetch-depth: 0\n",
            "        with:\n          fetch-depth: 0\n          persist-credentials: false\n"
          );

          fs.writeFileSync('scripts/check-workflows.mjs', `#!/usr/bin/env node
          import fs from 'node:fs';
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';
          import yaml from 'js-yaml';

          const root = path.resolve(path.dirname(fileURLToPath(import.meta.url)), '..');
          const directory = path.join(root, '.github', 'workflows');
          const files = fs.readdirSync(directory).filter(name => /\\.ya?ml$/i.test(name)).sort();
          const PINNED_ACTION = /^[A-Za-z0-9_.-]+\\/[A-Za-z0-9_.-]+(?:\\/[^@\\s]+)?@[a-f0-9]{40}$/i;
          if (!files.length) throw new Error('No GitHub workflows found');

          for (const name of files) {
            const file = path.join(directory, name);
            const source = fs.readFileSync(file, 'utf8');
            let document;
            try {
              document = yaml.load(source, { filename: file, json: true });
            } catch (error) {
              throw new Error(\`${name} is not valid YAML: \${error.message}\`);
            }
            if (!document || typeof document !== 'object' || Array.isArray(document)) {
              throw new Error(\`${name} must contain one workflow mapping\`);
            }
            if (!document.name || !document.on || !document.jobs || typeof document.jobs !== 'object') {
              throw new Error(\`${name} is missing name, on, or jobs\`);
            }
            if (!document.permissions || typeof document.permissions !== 'object' || Array.isArray(document.permissions)) {
              throw new Error(\`${name} must declare explicit top-level permissions\`);
            }
            for (const [jobName, job] of Object.entries(document.jobs)) {
              if (!job || typeof job !== 'object' || !Array.isArray(job.steps) || job.steps.length === 0) {
                throw new Error(\`${name} job \${jobName} must contain steps\`);
              }
              const timeout = job['timeout-minutes'];
              if (!Number.isInteger(timeout) || timeout < 1 || timeout > 60) {
                throw new Error(\`${name} job \${jobName} must set timeout-minutes from 1 to 60\`);
              }
              for (const [index, step] of job.steps.entries()) {
                if (!step || typeof step !== 'object' || !step.uses) continue;
                const uses = String(step.uses);
                if (uses.startsWith('./')) continue;
                if (!PINNED_ACTION.test(uses)) {
                  throw new Error(\`${name} job \${jobName} step \${index + 1} must pin external action to a full commit SHA: \${uses}\`);
                }
                if (/^actions\\/checkout@/i.test(uses) && step.with?.['persist-credentials'] !== false) {
                  throw new Error(\`${name} job \${jobName} checkout must set persist-credentials: false\`);
                }
              }
            }
          }
          console.log(\`Validated \${files.length} GitHub workflows with pinned actions, bounded jobs, explicit permissions, and non-persistent checkout credentials.\`);
          `.replace(/^          /gm, ''), 'utf8');

          fs.writeFileSync('tests/deep-audit-security.test.mjs', `import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import test from 'node:test';
          import lockRuntime from '../config-file-lock.cjs';
          import {
            authorizeToolCall,
            createTeamMember,
            normalizeInstanceConfig,
            revokeTeamMember,
            rotateTeamMemberToken,
            updateTeamMember,
            verifyAccessToken
          } from '../gateway/team-access.mjs';
          import { requiredCapabilityForTool } from '../gateway/tool-policy.mjs';

          function config() {
            return {
              auth: { required: true, token: 'owner-secret-token-value' },
              permissions: { profile: 'fullAccess' },
              connection: { provider: 'ngrok', publicUrl: '' },
              team: { members: [], requireWorkspaceLeaseForWrites: false },
              requestPolicy: {},
              runtime: {},
              jobs: {},
              activeWorkspaceId: 'app',
              workspaces: [
                { id: 'app', name: 'Application', reference: false, mode: 'workspace-write' },
                { id: 'other', name: 'Other', reference: false, mode: 'workspace-write' }
              ]
            };
          }

          function authorization(current, principal, name, args, annotations) {
            return authorizeToolCall({ name, args, annotations, config: current, principal });
          }

          test('durable-style team principals follow current role, scope, revocation, and token generation', () => {
            const current = normalizeInstanceConfig(config());
            const created = createTeamMember(current, { id: 'alice', name: 'Alice', role: 'developer', workspaceIds: ['app'] });
            const stale = verifyAccessToken(created.token, current);

            updateTeamMember(current, 'alice', { role: 'reviewer' });
            assert.throws(
              () => authorization(current, stale, 'write_file', { workspaceId: 'app' }, { destructiveHint: true }),
              /cannot use/
            );

            updateTeamMember(current, 'alice', { role: 'developer', workspaceIds: ['other'] });
            assert.throws(
              () => authorization(current, stale, 'read_file', { workspaceId: 'app' }, { readOnlyHint: true }),
              /not allowed to access workspace app/
            );

            const rotated = rotateTeamMemberToken(current, 'alice');
            assert.throws(
              () => authorization(current, stale, 'read_file', { workspaceId: 'other' }, { readOnlyHint: true }),
              error => error?.code === 'principal_inactive' && /rotated/.test(error.message)
            );

            const fresh = verifyAccessToken(rotated.token, current);
            assert.equal(
              authorization(current, fresh, 'read_file', { workspaceId: 'other' }, { readOnlyHint: true }).workspaceId,
              'other'
            );
            revokeTeamMember(current, 'alice');
            assert.throws(
              () => authorization(current, fresh, 'read_file', { workspaceId: 'other' }, { readOnlyHint: true }),
              error => error?.code === 'principal_inactive'
            );
          });

          test('git_raw classifies the actual subcommand after safe global options', () => {
            assert.equal(
              requiredCapabilityForTool('git_raw', { destructiveHint: true }, { args: ['--no-pager', 'push', 'origin', 'main'] }),
              'publish'
            );
            assert.equal(
              requiredCapabilityForTool('git_raw', { destructiveHint: true }, { args: ['--no-pager', 'status'] }),
              'git'
            );
          });

          test('team force-push aliases and force refspecs are blocked', () => {
            const current = normalizeInstanceConfig(config());
            const created = createTeamMember(current, { id: 'maintainer', name: 'Maintainer', role: 'maintainer', workspaceIds: ['app'] });
            const principal = verifyAccessToken(created.token, current);
            for (const args of [
              ['--no-pager', 'push', '-f', 'origin', 'main'],
              ['push', '--force-with-lease=main', 'origin', 'main'],
              ['push', 'origin', '+main:main']
            ]) {
              assert.throws(
                () => authorization(current, principal, 'git_raw', { workspaceId: 'app', args }, { destructiveHint: true }),
                /High-risk raw Git operations/
              );
            }
            assert.throws(
              () => authorization(current, principal, 'run_command', { workspaceId: 'app', command: 'git push -f origin main' }, { destructiveHint: true }),
              /high-risk command/
            );
          });

          test('file locks are never stolen solely because a live owner is old', () => {
            const root = fs.mkdtempSync(path.join(os.tmpdir(), 'devmate-live-lock-'));
            const file = path.join(root, 'config.json');
            const lockPath = \`${file}.lock\`;
            try {
              fs.writeFileSync(file, '{}');
              fs.writeFileSync(lockPath, JSON.stringify({
                token: 'other-owner',
                pid: process.pid,
                acquiredAt: new Date(Date.now() - 120000).toISOString(),
                file
              }));
              assert.equal(lockRuntime.staleLock(lockRuntime.readLock(lockPath), 1000), false);
              assert.throws(
                () => lockRuntime.acquireFileLock(file, { timeoutMs: 100, staleMs: 1000 }),
                error => error?.code === 'file_lock_timeout'
              );
            } finally {
              fs.rmSync(root, { recursive: true, force: true });
            }
          });

          test('queue persistence carries token generation and inactive principals are non-retryable', () => {
            const queue = fs.readFileSync(new URL('../gateway/job-queue.mjs', import.meta.url), 'utf8');
            const runtime = fs.readFileSync(new URL('../gateway/job-runtime.mjs', import.meta.url), 'utf8');
            assert.equal(queue.includes('tokenVersion: Number.isInteger(principal?.tokenVersion)'), true);
            assert.equal(runtime.includes("'principal_inactive'"), true);
          });
          `.replace(/^          /gm, ''), 'utf8');
          NODE

          rm -f .github/workflows/deep-audit-hardening-once.yml

      - name: Install
        run: npm ci

      - name: Repository contracts
        run: npm run check

      - name: Focused security and concurrency tests
        run: node --test tests/deep-audit-security.test.mjs tests/team-access.test.mjs tests/tool-policy.test.mjs tests/config-file-lock.test.cjs tests/job-runtime.test.mjs tests/request-auth-boundaries.test.mjs

      - name: Full unit and policy tests
        run: npm run test:unit

      - name: Gateway smoke tests
        run: npm run smoke:gateway

      - name: Commit verified audit hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --exit-code && { echo 'Deep audit produced no changes'; exit 1; }
          git commit -m 'Harden authorization, Git policy, locks, and CI supply chain'
          git push origin HEAD:master
