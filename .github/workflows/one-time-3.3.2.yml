name: One-time DevMate 3.3.2 provider hardening

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  harden:
    if: github.event.head_commit.message == 'Stage DevMate 3.3.2 provider hardening'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Decode and validate complete patch
        shell: pwsh
        run: |
          node -e "const fs=require('fs'),z=require('zlib');const names=[1,2,3,4,5].map(i=>'scripts/one-time-3.3.2.patch.part'+i);const b64=names.map(n=>fs.readFileSync(n,'utf8').trim()).join('');fs.writeFileSync(process.env.RUNNER_TEMP+'\\devmate-3.3.2.patch',z.gunzipSync(Buffer.from(b64,'base64')))"
          git apply --check "$env:RUNNER_TEMP\devmate-3.3.2.patch"

      - name: Apply complete patch
        shell: pwsh
        run: git apply "$env:RUNNER_TEMP\devmate-3.3.2.patch"

      - name: Remove one-time machinery before validation
        shell: pwsh
        run: |
          Remove-Item scripts/one-time-3.3.2.patch.gz.b64 -Force -ErrorAction SilentlyContinue
          Remove-Item scripts/one-time-3.3.2.patch.part* -Force
          Remove-Item .github/workflows/one-time-3.3.2.yml -Force

      - name: Synchronize version contract
        run: npm run version:sync

      - name: Repository contracts
        run: npm run check

      - name: Full unit and policy suite
        run: npm run test:unit

      - name: Gateway smoke
        run: npm run smoke:gateway

      - name: Package and smoke VSIX
        run: npm run package:vsix && node scripts/smoke-vsix-runtime.mjs && node scripts/smoke-vsix-shared-tunnel.mjs

      - name: Build and smoke Obsidian
        run: npm run build:obsidian && node scripts/smoke-obsidian-runtime.mjs

      - name: Commit verified DevMate 3.3.2
        shell: pwsh
        run: |
          git config user.name "kukutx"
          git config user.email "61358650+Kukutx@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Release DevMate 3.3.2 provider hardening"
          git push origin master
