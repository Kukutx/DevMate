name: Personal no-auth public MCP hotfix

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/personal-noauth-hotfix.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply permanent policy patch
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('scripts/personal-noauth-hotfix.py'); s=p.read_text(); s=s.replace(\"replace('scripts/standalone-runtime.mjs', \\\"detail: config.auth?.mode || 'oauth'\\\", \\\"detail: config.auth?.mode || 'none'\\\", 1)\", \"replace('scripts/standalone-runtime.mjs', \\\"detail: config.auth?.mode || 'oauth'\\\", \\\"detail: config.auth?.mode || 'none'\\\", 2)\"); s=s.replace(\"ok: config.auth?.mode === 'oauth', detail: config.auth?.mode || 'oauth'\", \"ok: config.auth?.mode === 'oauth', detail: config.auth?.mode || 'none'\"); p.write_text(s)"
          python3 scripts/personal-noauth-hotfix.py

      - name: Install dependencies
        run: npm ci

      - name: Repository contracts
        run: npm run check

      - name: Unit tests
        run: npm run test:unit

      - name: Package fixed VSIX
        run: npm run package:vsix

      - name: Commit permanent fix and remove one-shot files
        shell: bash
        run: |
          git config user.name 'DevMate Hotfix'
          git config user.email 'devmate-hotfix@users.noreply.github.com'
          git rm .github/workflows/personal-noauth-hotfix.yml scripts/personal-noauth-hotfix.py
          git add -A
          git commit -m 'fix: restore single-owner public no-auth contract'
          git push origin HEAD:master

      - uses: actions/upload-artifact@v4
        with:
          name: devmate-3.6.0-personal-noauth-fixed
          path: '*.vsix'
          if-no-files-found: error
