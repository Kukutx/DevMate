name: Personal no-auth public MCP hotfix

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/personal-noauth-hotfix.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Apply permanent policy patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/personal-noauth-hotfix.py')
          s = p.read_text()
          s = s.replace("replace('scripts/standalone-runtime.mjs', \"detail: config.auth?.mode || 'oauth'\", \"detail: config.auth?.mode || 'none'\", 1)", "replace('scripts/standalone-runtime.mjs', \"detail: config.auth?.mode || 'oauth'\", \"detail: config.auth?.mode || 'none'\", 2)")
          s = s.replace("ok: config.auth?.mode === 'oauth', detail: config.auth?.mode || 'oauth'", "ok: config.auth?.mode === 'oauth', detail: config.auth?.mode || 'none'")
          s = s.replace(r"\n          .addOption('none', 'None (loopback only)')", r"\n        .addOption('none', 'None (loopback only)')")
          s = s.replace(r"\n          .addOption('oauth', 'OAuth (team/shared)')", r"\n        .addOption('oauth', 'OAuth (team/shared)')")
          old = '''replace('tests/devmate-command.test.mjs', "  assert.deepEqual(config.auth, { mode: 'oauth' });\\n  assert.equal(await exists(path.join(current.root, 'state', 'oauth-secrets.json')), true);", "  assert.deepEqual(config.auth, { mode: 'none' });\\n  assert.equal(await exists(path.join(current.root, 'state', 'oauth-secrets.json')), false);", 1)'''
          new = '''replace('tests/devmate-command.test.mjs', "  const config = await readConfig(current.config);\\n  assert.deepEqual(config.auth, { mode: 'oauth' });\\n  assert.equal(await exists(path.join(current.root, 'state', 'oauth-secrets.json')), true);\\n  assert.equal('deployment' in config, false);", "  const config = await readConfig(current.config);\\n  assert.deepEqual(config.auth, { mode: 'none' });\\n  assert.equal(await exists(path.join(current.root, 'state', 'oauth-secrets.json')), false);\\n  assert.equal('deployment' in config, false);", 1)'''
          if old not in s:
              raise SystemExit('could not disambiguate personal auth test patch')
          s = s.replace(old, new, 1)
          s = s.replace("        replace(path, old, new, 1)", "        replace(path, old, new, 2 if path == 'obsidian-plugin/README.md' else 1)", 1)
          p.write_text(s)

          p = Path('scripts/finalize-personal-noauth-3.6.1-docs.py')
          s = p.read_text()
          old = """    found = source.count(old)\n    if found != count:\n        raise SystemExit(f'{path}: expected {count} matches, found {found}: {old[:160]!r}')\n    p.write_text(source.replace(old, new), encoding='utf-8')"""
          new = """    found = source.count(old)\n    if found == count:\n        p.write_text(source.replace(old, new), encoding='utf-8')\n        return\n    if found == 0 and source.count(new) >= count:\n        return\n    raise SystemExit(f'{path}: expected {count} matches, found {found}: {old[:160]!r}')"""
          if old not in s:
              raise SystemExit('could not make final docs patch idempotent')
          p.write_text(s.replace(old, new, 1))
          PY
          python3 scripts/personal-noauth-hotfix.py
          python3 scripts/finalize-personal-noauth-3.6.1.py
          python3 scripts/finalize-personal-noauth-3.6.1-docs.py
          python3 scripts/finalize-auth-generation-3.6.1.py
          python3 scripts/finalize-host-recovery-3.6.1.py
          node scripts/sync-version.mjs

      - name: Install dependencies
        run: npm ci

      - name: Repository contracts
        run: npm run check

      - name: Unit tests
        run: npm run test:unit

      - name: Package fixed VSIX
        run: npm run package:vsix

      - name: Commit permanent 3.6.1 fix and remove one-shot files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git config user.name 'DevMate Hotfix'
          git config user.email 'devmate-hotfix@users.noreply.github.com'
          git rm .github/workflows/personal-noauth-hotfix.yml scripts/personal-noauth-hotfix.py scripts/finalize-personal-noauth-3.6.1.py scripts/finalize-personal-noauth-3.6.1-docs.py scripts/finalize-auth-generation-3.6.1.py scripts/finalize-host-recovery-3.6.1.py
          git add -A
          git commit -m 'fix: release 3.6.1 single-owner public no-auth'
          git push origin HEAD:master

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: devmate-3.6.1-personal-noauth-fixed
          path: '*.vsix'
          if-no-files-found: error
