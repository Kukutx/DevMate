name: Personal no-auth public MCP hotfix

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/personal-noauth-hotfix.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply permanent policy patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/personal-noauth-hotfix.py')
          s = p.read_text()
          s = s.replace("replace('scripts/standalone-runtime.mjs', \"detail: config.auth?.mode || 'oauth'\", \"detail: config.auth?.mode || 'none'\", 1)", "replace('scripts/standalone-runtime.mjs', \"detail: config.auth?.mode || 'oauth'\", \"detail: config.auth?.mode || 'none'\", 2)")
          s = s.replace("ok: config.auth?.mode === 'oauth', detail: config.auth?.mode || 'oauth'", "ok: config.auth?.mode === 'oauth', detail: config.auth?.mode || 'none'")
          s = s.replace(r"\n          .addOption('none', 'None (loopback only)')", r"\n        .addOption('none', 'None (loopback only)')")
          s = s.replace(r"\n          .addOption('oauth', 'OAuth (team/shared)')", r"\n        .addOption('oauth', 'OAuth (team/shared)')")
          old = '''replace('tests/devmate-command.test.mjs', "  assert.deepEqual(config.auth, { mode: 'oauth' });\\n  assert.equal(await exists(path.join(current.root, 'state', 'oauth-secrets.json')), true);", "  assert.deepEqual(config.auth, { mode: 'none' });\\n  assert.equal(await exists(path.join(current.root, 'state', 'oauth-secrets.json')), false);", 1)'''
          new = '''replace('tests/devmate-command.test.mjs', "  const config = await readConfig(current.config);\\n  assert.deepEqual(config.auth, { mode: 'oauth' });\\n  assert.equal(await exists(path.join(current.root, 'state', 'oauth-secrets.json')), true);\\n  assert.equal('deployment' in config, false);", "  const config = await readConfig(current.config);\\n  assert.deepEqual(config.auth, { mode: 'none' });\\n  assert.equal(await exists(path.join(current.root, 'state', 'oauth-secrets.json')), false);\\n  assert.equal('deployment' in config, false);", 1)'''
          if old not in s:
              raise SystemExit('could not disambiguate personal auth test patch')
          s = s.replace(old, new, 1)
          s = s.replace("        replace(path, old, new, 1)", "        replace(path, old, new, 2 if path == 'obsidian-plugin/README.md' else 1)", 1)
          p.write_text(s)
          PY
          python3 scripts/personal-noauth-hotfix.py

      - name: Install dependencies
        run: npm ci

      - name: Repository contracts
        run: npm run check

      - name: Unit tests
        run: npm run test:unit

      - name: Package fixed VSIX
        run: npm run package:vsix

      - name: Commit permanent fix and remove one-shot files
        shell: bash
        run: |
          git config user.name 'DevMate Hotfix'
          git config user.email 'devmate-hotfix@users.noreply.github.com'
          git rm .github/workflows/personal-noauth-hotfix.yml scripts/personal-noauth-hotfix.py
          git add -A
          git commit -m 'fix: restore single-owner public no-auth contract'
          git push origin HEAD:master

      - uses: actions/upload-artifact@v4
        with:
          name: devmate-3.6.0-personal-noauth-fixed
          path: '*.vsix'
          if-no-files-found: error
