name: Apply VS Code RuntimeController Migration

on:
  push:
    branches:
      - refactor/runtime-concurrency-hardening
    paths:
      - scripts/apply-vscode-controller-migration.mjs
      - .github/workflows/apply-vscode-controller-migration.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/runtime-concurrency-hardening
          fetch-depth: 0

      - name: Apply asserted patch
        run: node scripts/apply-vscode-controller-migration.mjs

      - name: Remove temporary migration files
        run: rm scripts/apply-vscode-controller-migration.mjs .github/workflows/apply-vscode-controller-migration.yml

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension.js host/runtime/config-store.js host/runtime/process-controller.js scripts/apply-vscode-controller-migration.mjs .github/workflows/apply-vscode-controller-migration.yml
          git commit -m "Move VS Code Gateway lifecycle onto RuntimeController"
          git push origin HEAD:refactor/runtime-concurrency-hardening
