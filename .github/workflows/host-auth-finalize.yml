name: Secure OAuth host integration

on:
  push:
    branches:
      - fix/final-deep-hardening

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/final-deep-hardening
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: node scripts/host-auth-finalize.mjs
      - name: Commit secure host integration
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension-entry-shared-tunnel.js extension.js vscode-host/public-tunnel-verifier.js obsidian-plugin/src/main.js obsidian-plugin/src/settings.js scripts/standalone-runtime.mjs gateway/server-runtime.mjs package.json
          git commit -m "refactor: secure OAuth across all host runtimes"
          git push origin HEAD:fix/final-deep-hardening
