name: One-time VS Code runtime fix

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Patch VS Code runtime launch
        shell: pwsh
        run: |
          $runtimePath = 'vscode-host/runtime-io.js'
          $runtime = Get-Content $runtimePath -Raw
          $runtime = $runtime.Replace("const path = require('node:path');`n", '')
          $start = $runtime.IndexOf("const VSCODE_ELECTRON_NODE_FLAG")
          $end = $runtime.IndexOf("let spawnImpl = nativeSpawn;")
          if ($start -lt 0 -or $end -lt 0 -or $end -le $start) { throw 'runtime-io patch anchors not found' }
          $replacement = "function nativeSpawn(...args) {`n  return rawNativeSpawn(...args);`n}`n`n"
          $runtime = $runtime.Substring(0, $start) + $replacement + $runtime.Substring($end)
          $exportsOld = "  decorateGatewaySpawnArgs,`n  isGatewayEntry,`n  VSCODE_ELECTRON_NODE_FLAG,`n"
          if (-not $runtime.Contains($exportsOld)) { throw 'runtime-io export anchor not found' }
          $runtime = $runtime.Replace($exportsOld, '')
          Set-Content -Path $runtimePath -Value $runtime -NoNewline

          $extensionPath = 'extension.js'
          $extension = Get-Content $extensionPath -Raw
          $importOld = "const { RuntimeController } = require('./host/runtime-controller.js');"
          $importNew = "$importOld`nconst { resolveNodeRuntime } = require('./host/runtime/node-runtime.js');"
          if (-not $extension.Contains($importOld)) { throw 'extension runtime import anchor not found' }
          $extension = $extension.Replace($importOld, $importNew)

          $globalsOld = "let gatewayController = null;`nlet gatewayControllerKey = '';"
          $globalsNew = "$globalsOld`nlet gatewayNodeRuntime = null;`nlet gatewayNodeRuntimeKey = '';"
          if (-not $extension.Contains($globalsOld)) { throw 'extension runtime globals anchor not found' }
          $extension = $extension.Replace($globalsOld, $globalsNew)

          $controllerAnchor = 'async function ensureGatewayController(ctx){'
          if (-not $extension.Contains($controllerAnchor)) { throw 'ensureGatewayController anchor not found' }
          $resolver = @"
function ensureGatewayNodeRuntime(){
  const key = `${process.execPath}|`${process.versions.node || ''};
  if(gatewayNodeRuntime && gatewayNodeRuntimeKey === key) return gatewayNodeRuntime;
  const runtime = resolveNodeRuntime({spawnSyncImpl:spawnSync});
  gatewayNodeRuntime = runtime;
  gatewayNodeRuntimeKey = key;
  log(`Using Node `${runtime.nodeVersion} Gateway runtime from `${runtime.source}: `${runtime.executable}`);
  return runtime;
}
"@
          $extension = $extension.Replace($controllerAnchor, "$resolver`n$controllerAnchor")

          $reuseOld = "    gatewayController.preferredPort = configuredPort();`n    gatewayController.gatewayEntry = gatewayPath(ctx);`n    return gatewayController;"
          $reuseNew = "    gatewayController.preferredPort = configuredPort();`n    gatewayController.gatewayEntry = gatewayPath(ctx);`n    gatewayController.nodeExecutable = ensureGatewayNodeRuntime().executable;`n    return gatewayController;"
          if (-not $extension.Contains($reuseOld)) { throw 'existing Gateway controller anchor not found' }
          $extension = $extension.Replace($reuseOld, $reuseNew)

          $newControllerOld = "  gatewayController = new RuntimeController({`n    workspaceRoot: root,"
          $newControllerNew = "  const nodeRuntime = ensureGatewayNodeRuntime();`n  gatewayController = new RuntimeController({`n    workspaceRoot: root,"
          if (-not $extension.Contains($newControllerOld)) { throw 'new Gateway controller anchor not found' }
          $extension = $extension.Replace($newControllerOld, $newControllerNew)
          $extension = $extension.Replace('    nodeExecutable: process.execPath,', '    nodeExecutable: nodeRuntime.executable,')
          Set-Content -Path $extensionPath -Value $extension -NoNewline

          $privateTestPath = 'tests/private-runtime-io.test.cjs'
          $privateTest = Get-Content $privateTestPath -Raw
          $pattern = "test\('VS Code Electron gets its required Node-mode flag only for the Gateway entry',[\s\S]*?\n\}\);\n\ntest\('SpawnLayer"
          $replacementTest = @"
test('VS Code runtime IO never injects private Electron Node flags', () => {
  const runtimeSource = source('vscode-host/runtime-io.js');
  assert.doesNotMatch(runtimeSource, /--ms-enable-electron-run-as-node/);
  assert.doesNotMatch(runtimeSource, /decorateGatewaySpawnArgs|VSCODE_ELECTRON_NODE_FLAG/);
});

test('SpawnLayer
"@
          $patchedPrivate = [regex]::Replace($privateTest, $pattern, $replacementTest, 1)
          if ($patchedPrivate -eq $privateTest) { throw 'private runtime flag test anchor not found' }
          $privateTest = $patchedPrivate
          $oldAssertions = "  assert.match(source('vscode-host/runtime-io.js'), /--ms-enable-electron-run-as-node/);`n  assert.match(source('vscode-host/runtime-io.js'), /isGatewayEntry/);"
          $newAssertions = "  assert.doesNotMatch(source('vscode-host/runtime-io.js'), /--ms-enable-electron-run-as-node|decorateGatewaySpawnArgs|VSCODE_ELECTRON_NODE_FLAG/);`n  assert.match(source('extension.js'), /resolveNodeRuntime/);"
          if (-not $privateTest.Contains($oldAssertions)) { throw 'private runtime source assertions anchor not found' }
          $privateTest = $privateTest.Replace($oldAssertions, $newAssertions)
          Set-Content -Path $privateTestPath -Value $privateTest -NoNewline

          $nodeTestPath = 'tests/node-runtime.test.cjs'
          $nodeTest = Get-Content $nodeTestPath -Raw
          $nodeAnchor = "  assert.equal(spawnSyncImpl.calls[0].options.env.ELECTRON_RUN_AS_NODE, '1');"
          $nodeNew = "$nodeAnchor`n  assert.equal(spawnSyncImpl.calls[0].args.includes('--ms-enable-electron-run-as-node'), false);"
          if (-not $nodeTest.Contains($nodeAnchor)) { throw 'node runtime test anchor not found' }
          $nodeTest = $nodeTest.Replace($nodeAnchor, $nodeNew)
          Set-Content -Path $nodeTestPath -Value $nodeTest -NoNewline

          $smokePath = 'scripts/smoke-vsix-runtime.mjs'
          $smoke = Get-Content $smokePath -Raw
          $sourceAnchor = "  const extensionSource = fs.readFileSync(path.join(extensionPath, 'extension.js'), 'utf8');"
          $sourceNew = "$sourceAnchor`n  const runtimeIoSource = fs.readFileSync(path.join(extensionPath, 'vscode-host', 'runtime-io.js'), 'utf8');`n  assert.match(extensionSource, /resolveNodeRuntime/, 'VSIX must resolve a verified Node runtime before launching the Gateway');`n  assert.doesNotMatch(runtimeIoSource, /--ms-enable-electron-run-as-node/, 'VSIX must not inject unsupported Electron Node flags');"
          if (-not $smoke.Contains($sourceAnchor)) { throw 'VSIX smoke source anchor not found' }
          $smoke = $smoke.Replace($sourceAnchor, $sourceNew)
          $requireAnchor = "  const { RuntimeController } = requireFromVsix('./host/runtime-controller.js');"
          $requireNew = "$requireAnchor`n  const { resolveNodeRuntime } = requireFromVsix('./host/runtime/node-runtime.js');`n  const nodeRuntime = resolveNodeRuntime();"
          if (-not $smoke.Contains($requireAnchor)) { throw 'VSIX smoke runtime import anchor not found' }
          $smoke = $smoke.Replace($requireAnchor, $requireNew)
          $smoke = $smoke.Replace('    nodeExecutable: process.execPath', '    nodeExecutable: nodeRuntime.executable')
          Set-Content -Path $smokePath -Value $smoke -NoNewline

      - name: Run focused tests
        shell: pwsh
        run: |
          npm ci
          node --test tests/private-runtime-io.test.cjs tests/node-runtime.test.cjs
          npm run check

      - name: Commit fix
        shell: pwsh
        run: |
          git config user.name "kukutx"
          git config user.email "61358650+Kukutx@users.noreply.github.com"
          git add vscode-host/runtime-io.js extension.js tests/private-runtime-io.test.cjs tests/node-runtime.test.cjs scripts/smoke-vsix-runtime.mjs
          if (-not (git diff --cached --quiet)) {
            git commit -m "Fix VS Code Gateway runtime selection"
            git push origin master
          }
