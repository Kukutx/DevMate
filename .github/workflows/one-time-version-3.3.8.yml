name: One-time DevMate 3.3.8 version sync

on:
  push:
    branches:
      - fix/ngrok-fast-recovery-3.3.8

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set DevMate 3.3.8 release metadata
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = '3.3.8';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');

          const file = 'CHANGELOG.md';
          const current = fs.readFileSync(file, 'utf8');
          const release = `## 3.3.8\n\n- Fixed ERR_NGROK_334 recovery when the conflicting local ngrok process exposes its Agent API on a secondary loopback port or still forwards to the same Gateway port.\n- Removed blind runtime-level ERR_NGROK_334 backoff retries; TunnelController now owns one bounded reconciliation attempt and unresolved conflicts fail fast.\n- Reclaims startup leases immediately when their recorded owner process is dead, eliminating reload delays caused by fresh orphaned lock files.\n- Scans the bounded local ngrok Agent range concurrently, verifies DevMate upstreams when possible, preserves ambiguous unrelated endpoints, and never enables pooling implicitly.\n\n`;
          if (!current.includes('## 3.3.8\n')) {
            fs.writeFileSync(file, current.replace('# Changelog\n\n', '# Changelog\n\n' + release));
          }
          NODE
          npm run version:sync

      - name: Remove one-time workflow
        run: git rm .github/workflows/one-time-version-3.3.8.yml

      - name: Commit synchronized release metadata
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json CHANGELOG.md tests/smoke-gateway.mjs tests/smoke-local-capabilities.mjs obsidian-plugin/manifest.json obsidian-plugin/package.json obsidian-plugin/versions.json
          git commit -m 'Prepare DevMate 3.3.8 fast ngrok recovery'
          git push origin HEAD:fix/ngrok-fast-recovery-3.3.8
