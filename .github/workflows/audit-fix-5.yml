name: One-time Windows Godot canonical path fix

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Patch canonical project backup paths
        shell: bash
        run: |
          set -euo pipefail
          if git log -1 --pretty=%B | grep -Fq '[audit-fix-5]'; then
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path('gateway/plugins/godot-qa-bridge.mjs')
          text = p.read_text()
          old = "async function backupFiles(project, files) {\n  const stamp = new Date().toISOString().replace(/[:.]/g, '-');\n  const root = resolveProjectChild(project.root, path.join('.godot', 'devmate-backups', stamp));\n  const copied = [];\n  for (const file of files) {\n    const stat = fs.statSync(file, { throwIfNoEntry: false });\n    if (!stat?.isFile()) continue;\n    const relative = path.relative(project.root, file);\n    const target = resolveProjectChild(project.root, path.relative(project.root, path.join(root, relative)));"
          new = "async function backupFiles(project, files) {\n  const stamp = new Date().toISOString().replace(/[:.]/g, '-');\n  const canonicalProjectRoot = fs.realpathSync.native(project.root);\n  const root = resolveProjectChild(canonicalProjectRoot, path.join('.godot', 'devmate-backups', stamp));\n  const copied = [];\n  for (const file of files) {\n    const stat = fs.statSync(file, { throwIfNoEntry: false });\n    if (!stat?.isFile()) continue;\n    const relative = path.relative(canonicalProjectRoot, file);\n    const target = resolveProjectChild(canonicalProjectRoot, path.relative(canonicalProjectRoot, path.join(root, relative)));"
          if old not in text:
              raise SystemExit('missing expected backupFiles block')
          p.write_text(text.replace(old, new))
          PY
          git diff --check

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          if git log -1 --pretty=%B | grep -Fq '[audit-fix-5]'; then
            exit 0
          fi
          git config user.name kukutx
          git config user.email 61358650+Kukutx@users.noreply.github.com
          git add gateway/plugins/godot-qa-bridge.mjs
          git commit -m 'Canonicalize Godot backup paths on Windows [audit-fix-5]'
          git push origin HEAD:master
