name: Apply Extension Config Version Guard

on:
  push:
    branches:
      - refactor/runtime-concurrency-hardening
    paths:
      - scripts/apply-extension-config-version-guard.mjs
      - .github/workflows/apply-extension-config-version-guard.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/runtime-concurrency-hardening
          fetch-depth: 0

      - name: Apply asserted migration
        run: node scripts/apply-extension-config-version-guard.mjs

      - name: Remove temporary migration files
        run: rm scripts/apply-extension-config-version-guard.mjs .github/workflows/apply-extension-config-version-guard.yml

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Kukutx@users.noreply.github.com"
          git add extension-config-io.js scripts/apply-extension-config-version-guard.mjs .github/workflows/apply-extension-config-version-guard.yml
          git commit -m "Guard VS Code config schema versions"
          git push origin HEAD:refactor/runtime-concurrency-hardening
