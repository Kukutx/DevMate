name: No-auth public MCP repair

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/no-auth-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Run no-auth public MCP repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply current no-auth design
        shell: python
        run: |
          from pathlib import Path
          import json

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'missing expected block in {path}: {old[:100]!r}')
              p.write_text(s.replace(old, new))

          replace('gateway/request-guard.mjs',
          """  if (isLocalRequest(req)) return fallbackLocalPrincipal();
            if (config.auth?.mode !== 'oauth') return null;
          """,
          """  if (isLocalRequest(req) || config.auth?.mode === 'none') return fallbackLocalPrincipal();
            if (config.auth?.mode !== 'oauth') return null;
          """)

          replace('shared/oauth-tokens.cjs',
          """  if (config?.auth?.mode !== 'oauth') {
              const error = new Error('Public MCP preflight requires OAuth authentication');
              error.code = 'DEVMATE_PUBLIC_MCP_OAUTH_REQUIRED';
              throw error;
            }
          """,
          """  if (config?.auth?.mode !== 'oauth') return '';
          """)

          replace('extension.js',
          "function authenticationMode(){ return cfg().get('authenticationMode') === 'none' ? 'none' : 'oauth'; }",
          "function authenticationMode(){ return cfg().get('authenticationMode') === 'oauth' ? 'oauth' : 'none'; }")

          replace('shared/instance-config.cjs',
          """  // Local loopback access is OS-trusted. Remote MCP access uses OAuth only;
            // authentication secrets live outside the instance configuration.
          """,
          """  // No-auth is the default for local and public MCP access. OAuth remains optional;
            // authentication secrets live outside the instance configuration.
          """)

          p = Path('package.json')
          data = json.loads(p.read_text())
          auth = data['contributes']['configuration']['properties']['devMate.authenticationMode']
          auth['default'] = 'none'
          auth['description'] = 'MCP authentication mode. none is the default for local and public MCP access; oauth is optional.'
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')

          replace('scripts/standalone-runtime.mjs',
          """  const requestedAuthentication = options['authentication-mode'] === undefined
              ? (publicUrl ? 'oauth' : undefined)
              : String(options['authentication-mode']).trim().toLowerCase();
            if (publicUrl && requestedAuthentication === 'none') {
              throw new Error('--authentication-mode none is loopback-only and cannot be combined with --public-url');
            }
          """,
          """  const requestedAuthentication = options['authentication-mode'] === undefined
              ? 'none'
              : String(options['authentication-mode']).trim().toLowerCase();
          """)

          replace('scripts/standalone-runtime.mjs',
          """    { key: 'oauth-secrets', ok: config.auth?.mode !== 'oauth' || (() => { try { readOAuthSecrets(file); return true; } catch { return false; } })(), detail: config.auth?.mode === 'oauth' ? 'required' : 'loopback-only' },
              { key: 'member-auth', ok: !(config.team?.members || []).some(item => !item.disabled && (!item.expiresAt || Date.parse(item.expiresAt) > Date.now())) || config.auth?.mode === 'oauth', detail: config.auth?.mode === 'oauth' ? 'oauth' : 'loopback-only' },
          """,
          """    { key: 'oauth-secrets', ok: config.auth?.mode !== 'oauth' || (() => { try { readOAuthSecrets(file); return true; } catch { return false; } })(), detail: config.auth?.mode === 'oauth' ? 'required' : 'optional' },
              { key: 'member-auth', ok: true, detail: config.auth?.mode === 'oauth' ? 'oauth-enabled' : 'not-used-in-no-auth-mode' },
          """)

          replace('scripts/standalone-runtime.mjs',
          """  if (config.connection.publicUrl) {
              checks.push({ key: 'public-authentication', ok: config.auth?.mode === 'oauth', detail: config.auth?.mode || 'none' });
            }
          """,
          """  if (config.connection.publicUrl) {
              checks.push({ key: 'public-authentication', ok: ['none', 'oauth'].includes(config.auth?.mode), detail: config.auth?.mode || 'none' });
            }
          """)

          replace('scripts/standalone-runtime.mjs',
          """    if (config.auth?.mode !== 'oauth') configureAuthentication(config, 'oauth');
              result = createTeamMember(config, { id: options.id, name, role: options.role, workspaceIds, expiresAt: options['expires-at'] || null });
              return config;
            });
            ensureOAuthSecrets(file);
            return result;
          """,
          """    result = createTeamMember(config, { id: options.id, name, role: options.role, workspaceIds, expiresAt: options['expires-at'] || null });
              return config;
            });
            if (readConfig(file).auth?.mode === 'oauth') ensureOAuthSecrets(file);
            return result;
          """)

          replace('scripts/standalone-runtime.mjs',
          """    if (config.auth?.mode !== 'oauth') configureAuthentication(config, 'oauth');
              result = rotateTeamMemberLoginCode(config, id);
              return config;
            });
            ensureOAuthSecrets(file);
            return result;
          """,
          """    result = rotateTeamMemberLoginCode(config, id);
              return config;
            });
            if (readConfig(file).auth?.mode === 'oauth') ensureOAuthSecrets(file);
            return result;
          """)

          replace('scripts/devmate-command.mjs', "'authentication-mode': 'oauth',", "'authentication-mode': 'none',")

          replace('scripts/devmate-command.mjs',
          """  if (memberName) {
              if (effective['authentication-mode'] === undefined) effective['authentication-mode'] = 'oauth';
              if (effective['authentication-mode'] !== 'oauth') {
                throw new Error('--member-name requires --authentication-mode oauth because member access is an OAuth identity flow');
              }
            }
          """,
          """)

          replace('scripts/devmate-command.mjs',
          "  if (activeMembers.length && config.auth?.mode !== 'oauth') warnings.push('Active members require OAuth authentication.');\n",
          "")

          replace('scripts/devmate-command.mjs',
          "Standalone personal/runner bootstrap uses loopback-only no-auth. Team/control-plane presets and any bootstrap that creates a member use OAuth. Public remote MCP access always requires OAuth.\\n",
          "All bootstrap presets default to no-auth, including public MCP. OAuth remains available only when explicitly selected with --authentication-mode oauth.\\n")

          for file in ['gateway/request-guard.mjs','shared/oauth-tokens.cjs','extension.js','shared/instance-config.cjs','scripts/standalone-runtime.mjs','scripts/devmate-command.mjs']:
              print(file)
      - name: Syntax check changed runtime files
        run: |
          node --check gateway/request-guard.mjs
          node --check shared/oauth-tokens.cjs
          node --check extension.js
          node --check scripts/standalone-runtime.mjs
          node --check scripts/devmate-command.mjs
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add gateway/request-guard.mjs shared/oauth-tokens.cjs extension.js shared/instance-config.cjs package.json scripts/standalone-runtime.mjs scripts/devmate-command.mjs
          git commit -m "Restore no-auth public MCP behavior"
          git push origin HEAD:master
