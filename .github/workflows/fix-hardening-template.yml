name: One-time hardening template fix

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fix nested template escaping and remove helper
        shell: pwsh
        run: |
          node scripts/fix-hardening-template.mjs
          Remove-Item scripts/fix-hardening-template.mjs -Force
          Remove-Item .github/workflows/fix-hardening-template.yml -Force

          git config user.name "kukutx"
          git config user.email "61358650+Kukutx@users.noreply.github.com"
          git add scripts/deep-runtime-hardening.mjs scripts/fix-hardening-template.mjs .github/workflows/fix-hardening-template.yml
          git commit -m "Fix hardening template generation"
          git push origin master
