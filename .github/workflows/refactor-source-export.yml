name: Refactor source export

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/host-platform-v2
      - name: Record base tree
        shell: bash
        run: git rev-parse 'HEAD^{tree}' > base-tree.txt
      - name: Upload base tree
        uses: actions/upload-artifact@v4
        with:
          name: devmate-refactor-base-tree
          path: base-tree.txt
          retention-days: 1
