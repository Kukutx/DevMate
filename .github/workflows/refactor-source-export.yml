name: Finalize host refactor

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/host-platform-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Finalize release documentation
        run: node scripts/finalize-host-refactor.mjs
      - name: Synchronize version contract
        run: node scripts/sync-version.mjs
      - name: Install dependencies
        run: npm ci
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Audit complete dependency tree
        run: npm audit --audit-level=moderate
      - name: Repository contracts
        run: npm run check
      - name: Unit and policy tests
        run: npm run test:unit
      - name: Gateway smoke
        run: npm run smoke:gateway
      - name: Package VSIX
        run: npm run package:vsix
      - name: Build Obsidian plugin
        run: npm run build:obsidian
      - name: Commit finalized source
        shell: bash
        run: |
          rm -rf obsidian-plugin/dist gateway/server.bundle.mjs
          rm -f ./*.vsix .github/workflows/refactor-source-export.yml scripts/finalize-host-refactor.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize DevMate 3.0.0 host refactor [host-finalize]"
          git push origin HEAD:refactor/host-platform-v2
