name: Conversation isolation hardening

on:
  push:
    branches:
      - fix/conversation-workspace-isolation

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/conversation-workspace-isolation
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply isolation hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(p): return Path(p).read_text()
          def write(p,s): Path(p).write_text(s)
          def must_replace(s, old, new, label):
              if old not in s: raise SystemExit(f'missing replacement target: {label}')
              return s.replace(old,new,1)

          # Stable ChatGPT conversation identity from any supported private metadata hint.
          write('gateway/request-context.mjs', '''import crypto from 'node:crypto';
          import { AsyncLocalStorage } from 'node:async_hooks';

          const storage = new AsyncLocalStorage();
          const CONVERSATION_META_KEYS = Object.freeze([
            'openai/session',
            'openai/conversation',
            'openai/conversationId',
            'openai/thread',
            'openai/threadId',
            'openai/widgetSessionId'
          ]);

          function cleanMetaString(value, max = 4096) {
            return typeof value === 'string' ? value.trim().slice(0, max) : '';
          }

          function conversationScope(value) {
            const stable = cleanMetaString(value);
            if (!stable) return null;
            return `chatgpt-${crypto.createHash('sha256').update(stable, 'utf8').digest('hex').slice(0, 32)}`;
          }

          export function conversationScopeFromToolContext(context) {
            const meta = context?.mcpReq?._meta || context?._meta || {};
            for (const key of CONVERSATION_META_KEYS) {
              const scope = conversationScope(meta?.[key]);
              if (scope) return scope;
            }
            return null;
          }

          export function runWithRequestContext(context, fn) {
            return storage.run(Object.freeze({ ...(context || {}) }), fn);
          }

          export function runWithConversationScope(conversationScopeValue, fn) {
            const current = requestContext() || {};
            return storage.run(Object.freeze({ ...current, conversationScope: conversationScopeValue || current.conversationScope || null }), fn);
          }

          export function runWithWorkSessionContext(workSessionId, fn) {
            const current = requestContext() || {};
            return storage.run(Object.freeze({ ...current, workSessionId: workSessionId || null }), fn);
          }

          export function runWithRequestSignal(signal, fn) {
            const current = requestContext() || {};
            return storage.run(Object.freeze({ ...current, signal: signal || current.signal || null }), fn);
          }

          export function requestContext() { return storage.getStore() || null; }
          export function requestPrincipal() { return requestContext()?.principal || null; }
          export function requestId() { return requestContext()?.requestId || null; }
          export function requestConversationScope() { return requestContext()?.conversationScope || null; }
          export function requestWorkSessionId() { return requestContext()?.workSessionId || null; }
          export function requestSignal() { return requestContext()?.signal || null; }

          export const __test = { CONVERSATION_META_KEYS, cleanMetaString, conversationScope };
          '''.replace('          ', ''))

          # Persistent process ownership follows the ChatGPT conversation that created it.
          p='gateway/persistent-processes.mjs'; s=read(p)
          s=must_replace(s, "import processTreeRuntime from '../host/runtime/process-tree.js';\n", "import processTreeRuntime from '../host/runtime/process-tree.js';\nimport { requestConversationScope } from './request-context.mjs';\n", 'persistent import')
          s=must_replace(s, "    status: 'running', startedAt: now(), finishedAt: null, exitCode: null, signal: null, error: null,\n", "    status: 'running', startedAt: now(), finishedAt: null, exitCode: null, signal: null, error: null,\n    conversationScope: requestConversationScope(),\n", 'persistent scope')
          s=must_replace(s, "export function processRecord(id) {\n", "export function processConversationScope(id) { return registry.get(id)?.conversationScope || null; }\nexport function processRecord(id) {\n", 'persistent helper')
          write(p,s)

          # Preview ownership follows its creating conversation.
          p='gateway/plugins/preview-manager.mjs'; s=read(p)
          s=must_replace(s, "import { isSensitiveWorkspacePath } from '../sensitive-path-policy.mjs';\n", "import { requestConversationScope } from '../request-context.mjs';\nimport { isSensitiveWorkspacePath } from '../sensitive-path-policy.mjs';\n", 'preview import')
          s=must_replace(s, "      crossOriginIsolation: !!crossOriginIsolation, spaFallback: !!spaFallback,\n      startedAt: new Date().toISOString(), requests: 0, lastRequestAt: null, server: null\n", "      crossOriginIsolation: !!crossOriginIsolation, spaFallback: !!spaFallback,\n      conversationScope: requestConversationScope(),\n      startedAt: new Date().toISOString(), requests: 0, lastRequestAt: null, server: null\n", 'preview scope')
          s=must_replace(s, "export function getPreview(id) {\n", "export function previewConversationScope(id) { return previews.get(id)?.conversationScope || null; }\n\nexport function getPreview(id) {\n", 'preview helper')
          write(p,s)

          # Approval digests are conversation-scoped so reconnects cannot consume another chat's approval.
          p='gateway/approvals.mjs'; s=read(p)
          s=must_replace(s, "import { defaultedArray, defaultedBoolean, defaultedInteger } from './strict-config.mjs';\n", "import { requestConversationScope } from './request-context.mjs';\nimport { defaultedArray, defaultedBoolean, defaultedInteger } from './strict-config.mjs';\n", 'approval import')
          s=must_replace(s, "    workspaceId: request.workspaceId || null,\n", "    workspaceId: request.workspaceId || null,\n    conversationScope: request.conversationScope || null,\n", 'approval public scope')
          s=must_replace(s, "export function approvalDigest({ principal, tool, workspaceId, args }) {\n  return crypto.createHash('sha256').update(canonical({\n    principalId: principal?.id || '',\n    tool: String(tool || ''),\n    workspaceId: workspaceId || null,\n    args: args || {}\n", "export function approvalDigest({ principal, tool, workspaceId, args, conversationScope = requestConversationScope() }) {\n  return crypto.createHash('sha256').update(canonical({\n    principalId: principal?.id || '',\n    tool: String(tool || ''),\n    workspaceId: workspaceId || null,\n    conversationScope: conversationScope || null,\n    args: args || {}\n", 'approval digest')
          s=must_replace(s, "export function ensureToolApproval({ config, principal, tool, capability, workspaceId, args }) {\n", "export function ensureToolApproval({ config, principal, tool, capability, workspaceId, args, conversationScope = requestConversationScope() }) {\n", 'approval ensure signature')
          s=must_replace(s, "  const digest = approvalDigest({ principal, tool, workspaceId, args });\n", "  const digest = approvalDigest({ principal, tool, workspaceId, args, conversationScope });\n", 'approval digest call')
          s=must_replace(s, "    workspaceId: workspaceId || null,\n    requestedBy: principal.id,\n", "    workspaceId: workspaceId || null,\n    conversationScope: conversationScope || null,\n    requestedBy: principal.id,\n", 'approval stored scope')
          write(p,s)

          # Require a deliberate conversation binding instead of silently adopting the current editor/vault.
          p='gateway/team-capabilities.mjs'; s=read(p)
          s=s.replace("import { listPersistentProcesses } from './persistent-processes.mjs';", "import { listPersistentProcesses, processConversationScope } from './persistent-processes.mjs';")
          s=s.replace("import { getPreview } from './plugins/preview-manager.mjs';", "import { getPreview, previewConversationScope } from './plugins/preview-manager.mjs';")
          start=s.index('function persistAutoConversationBinding')
          end=s.index('async function authorizedToolExecution', start)
          block='''function persistExplicitConversationBinding(scope, workspace) {
            if (!scope || !workspace) return null;
            let binding = null;
            mutateConfig(config => {
              normalizeInstanceConfig(config);
              binding = conversationWorkspaceBinding(config, scope);
              if (!binding) binding = bindConversationWorkspaceToWorkspace(config, scope, workspace, { source: 'explicit-tool' });
              return config;
            }, { retries: 4 });
            return binding;
          }

          function conversationBindingRequired(current) {
            const choices = (current.workspaces || []).filter(item => item && !item.reference && item.mode !== 'readonly')
              .map(item => ({ id: item.id, name: item.name, root: item.root }));
            const error = new Error('This ChatGPT conversation is not bound to a project. Call workspace_bind first. If the user supplied an absolute local path, bind that exact path; otherwise choose an explicit workspaceId from list_workspaces. DevMate will not silently use the current VS Code or Obsidian workspace.');
            error.code = 'conversation_workspace_binding_required';
            error.workspaces = choices;
            return error;
          }

          function assertConversationResourceScope(kind, id, actualScope, expectedScope) {
            if (!expectedScope) return;
            if (actualScope && actualScope === expectedScope) return;
            const error = new Error(`${kind} ${id} belongs to another or legacy unscoped ChatGPT conversation and will not be adopted automatically`);
            error.code = 'conversation_resource_conflict';
            throw error;
          }

          function prepareConversationWorkspace(name, args, current) {
            const scope = requestConversationScope();
            const inferred = inferredWorkspace(name, args);
            let authorizationArgs = inferred && !args.workspaceId ? { ...args, workspaceId: inferred } : args;
            if (!scope || !workspaceScopedTool(name)) return { current, args: authorizationArgs };

            if (args.id && ['process_status', 'read_process_output', 'send_process_input', 'stop_process'].includes(name)) {
              assertConversationResourceScope('process', args.id, processConversationScope(args.id), scope);
            }
            if (args.id && ['web_preview_status', 'web_preview_stop'].includes(name)) {
              assertConversationResourceScope('preview', args.id, previewConversationScope(args.id), scope);
            }

            let binding = conversationWorkspace(current, scope);
            if (!binding) {
              if (!String(authorizationArgs.workspaceId || '').trim()) throw conversationBindingRequired(current);
              const requested = resolveWorkspace(current, authorizationArgs.workspaceId);
              persistExplicitConversationBinding(scope, requested);
              current = normalizeInstanceConfig(readConfig());
              binding = conversationWorkspace(current, scope);
            }
            if (!binding) throw conversationBindingRequired(current);

            if (authorizationArgs.workspaceId) {
              const requested = resolveWorkspace(current, authorizationArgs.workspaceId);
              assertConversationWorkspaceMatch(current, scope, requested);
            }
            authorizationArgs = { ...authorizationArgs, workspaceId: binding.id };
            return { current, args: authorizationArgs };
          }

          '''.replace('          ','')
          s=s[:start]+block+s[end:]
          # Scope list-like results to both the bound workspace and the current conversation.
          s=must_replace(s, "function filterResult(name, result, principal) {\n  if (!result?.structuredContent) return sanitizeToolResult(name, result);\n", "function filterResult(name, result, principal, authorizedWorkspaceId = null, conversationScope = requestConversationScope()) {\n  if (!result?.structuredContent) return sanitizeToolResult(name, result);\n  const scopedData = result.structuredContent;\n  if (name === 'list_processes' && Array.isArray(scopedData.processes)) {\n    scopedData.processes = scopedData.processes.filter(item =>\n      (!authorizedWorkspaceId || item.workspaceId === authorizedWorkspaceId) &&\n      (!conversationScope || processConversationScope(item.id) === conversationScope)\n    );\n    scopedData.running = scopedData.processes.filter(item => ['running', 'stopping'].includes(item.status)).length;\n    syncTextContent(result);\n  }\n  if (name === 'web_preview_status' && Array.isArray(scopedData.previews)) {\n    scopedData.previews = scopedData.previews.filter(item =>\n      (!authorizedWorkspaceId || item.workspaceId === authorizedWorkspaceId) &&\n      (!conversationScope || previewConversationScope(item.id) === conversationScope)\n    );\n    syncTextContent(result);\n  }\n", 'filter result signature')
          s=must_replace(s, "        authorized.principal\n      );", "        authorized.principal,\n        authorized.workspaceId,\n        requestConversationScope()\n      );", 'filter call')
          s=s.replace('persistAutoConversationBinding,', 'persistExplicitConversationBinding,')
          write(p,s)

          # Durable jobs cannot escape a path-narrowed conversation binding after the chat ends.
          p='gateway/job-tools.mjs'; s=read(p)
          s=must_replace(s, "import { requestConversationScope } from './request-context.mjs';\n", "import { conversationWorkspace, sameWorkspaceRoot } from './conversation-workspaces.mjs';\nimport { requestConversationScope } from './request-context.mjs';\n", 'job binding import')
          needle="    const authorized = targetAuthorization(target, args, principal);\n"
          repl=needle+"    const currentConfig = normalizeInstanceConfig(readConfig());\n    const bound = conversationWorkspace(currentConfig);\n    if (bound) {\n      const configured = currentConfig.workspaces.find(item => item?.id === authorized.workspaceId);\n      if (!configured || !sameWorkspaceRoot(bound, configured)) {\n        const error = new Error('Durable jobs are disabled for conversation-only or path-narrowed workspace bindings because they outlive the ChatGPT conversation. Run the tool synchronously, or bind the exact configured workspace root first.');\n        error.code = 'conversation_workspace_durable_job_unsafe';\n        throw error;\n      }\n    }\n"
          s=must_replace(s,needle,repl,'job durable narrowed guard')
          write(p,s)

          # Strong server instruction: explicit user paths outrank host defaults.
          p='gateway/server.mjs'; s=read(p)
          old="DevMate is a local development gateway for personal and team workflows. It supports reading, editing, running commands, and full Git workflows according to the user's request. Keep responses practical and avoid exposing secrets; reference workspaces are read-only."
          new=old+" In ChatGPT, bind the conversation to its intended project before project-scoped work. When the user supplies an absolute local path, call workspace_bind with that exact path and treat it as authoritative; never substitute the current VS Code or Obsidian workspace. Never adopt work sessions, jobs, persistent processes, or previews from another conversation after a reconnect."
          s=must_replace(s,old,new,'server instructions')
          write(p,s)

          # Regression tests.
          write('tests/conversation-workspace-isolation.test.mjs', '''import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { conversationScopeFromToolContext, runWithConversationScope } from '../gateway/request-context.mjs';
          import { bindConversationWorkspaceToPath, conversationWorkspace } from '../gateway/conversation-workspaces.mjs';
          import { resolveWorkspace } from '../gateway/workspace-resolver.mjs';
          import { activeWorkSession, clearWorkSessions, startWorkSession } from '../gateway/work-sessions.mjs';
          import { clearWorkspaceLeases } from '../gateway/workspace-leases.mjs';

          const scopeA = 'chatgpt-' + 'a'.repeat(32);
          const scopeB = 'chatgpt-' + 'b'.repeat(32);

          test('ChatGPT conversation metadata remains stable across supported metadata keys', () => {
            const a1 = conversationScopeFromToolContext({ mcpReq: { _meta: { 'openai/session': 'conversation-a' } } });
            const a2 = conversationScopeFromToolContext({ mcpReq: { _meta: { 'openai/conversationId': 'conversation-a' } } });
            const b = conversationScopeFromToolContext({ mcpReq: { _meta: { 'openai/session': 'conversation-b' } } });
            assert.equal(a1, a2);
            assert.notEqual(a1, b);
            assert.match(a1, /^chatgpt-[a-f0-9]{32}$/);
          });

          test('an explicit local path overrides the host active workspace only inside its conversation', () => {
            const root = fs.mkdtempSync(path.join(os.tmpdir(), 'devmate-conversation-root-'));
            const host = fs.mkdtempSync(path.join(os.tmpdir(), 'devmate-host-root-'));
            const config = {
              activeWorkspaceId: 'host',
              workspaces: [{ id: 'host', name: 'Host', root: host, mode: 'workspace-write', reference: false }]
            };
            bindConversationWorkspaceToPath(config, scopeA, root, { allowExternalWrite: true });
            runWithConversationScope(scopeA, () => {
              assert.equal(resolveWorkspace(config, '').root, fs.realpathSync.native(root));
              assert.equal(conversationWorkspace(config).root, fs.realpathSync.native(root));
            });
            runWithConversationScope(scopeB, () => assert.equal(resolveWorkspace(config, '').id, 'host'));
          });

          test('work sessions are never adopted by another ChatGPT conversation', () => {
            clearWorkSessions();
            clearWorkspaceLeases();
            const principal = { id: 'local-owner', name: 'Local owner', role: 'owner', source: 'local' };
            const session = startWorkSession({ principal, workspaceId: 'app', conversationScope: scopeA });
            assert.equal(activeWorkSession(principal.id, 'app', scopeA)?.id, session.id);
            assert.equal(activeWorkSession(principal.id, 'app', scopeB), null);
            assert.throws(
              () => startWorkSession({ principal, workspaceId: 'app', conversationScope: scopeB }),
              error => error?.code === 'work_session_conversation_conflict'
            );
            clearWorkSessions();
            clearWorkspaceLeases();
          });

          test('authorization layer requires a deliberate binding instead of silently adopting host state', () => {
            const source = fs.readFileSync(new URL('../gateway/team-capabilities.mjs', import.meta.url), 'utf8');
            assert.match(source, /conversation_workspace_binding_required/);
            assert.match(source, /DevMate will not silently use the current VS Code or Obsidian workspace/);
            assert.doesNotMatch(source, /source:\s*'auto'/);
          });
          '''.replace('          ',''))

          # Changelog entry.
          p='CHANGELOG.md'; s=read(p)
          marker='# Changelog\n'
          entry='''# Changelog

          ## 3.6.2
          - Bound project-scoped ChatGPT work to a stable per-conversation identity so reconnects cannot adopt another conversation's workspace or work session.
          - Added `workspace_bind`, `workspace_binding_status`, and `workspace_unbind`; an explicit absolute local path now outranks VS Code/Obsidian active-workspace state and can safely narrow work to a project subdirectory.
          - Isolated durable jobs, approvals, persistent processes, and previews from cross-conversation reuse; path-narrowed conversation work is blocked from unsafe durable execution.
          - Added regression coverage for reconnect isolation, explicit path precedence, and cross-conversation session refusal.
          '''.replace('          ','')
          if '## 3.6.2' not in s: s=s.replace(marker,entry,1)
          write(p,s)
          PY

          npm ci
          npm version 3.6.2 --no-git-tag-version
          npm run version:sync
          node --test tests/conversation-workspace-isolation.test.mjs
          npm run check
          npm run test:unit
          npm run smoke:gateway
          npm run package:vsix
      - name: Commit verified hardening
        shell: bash
        run: |
          git rm .github/workflows/_conversation-isolation-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: harden conversation workspace isolation" || exit 0
          git push origin HEAD:fix/conversation-workspace-isolation
