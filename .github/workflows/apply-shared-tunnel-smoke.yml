name: Apply Packaged Shared Tunnel Smoke

on:
  push:
    branches:
      - refactor/shared-tunnel-runtime
    paths:
      - .github/workflows/apply-shared-tunnel-smoke.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest branch
        uses: actions/checkout@v4
        with:
          ref: refactor/shared-tunnel-runtime
          fetch-depth: 0
      - name: Add Windows and Linux installed-artifact gates
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = '.github/workflows/ci.yml';
          let source = fs.readFileSync(file, 'utf8');
          const windowsNeedle = "      - name: Smoke test packaged VSIX Worker\n        run: node scripts/smoke-vsix-worker.mjs\n";
          const windowsBlock = `${windowsNeedle}\n      - name: Smoke test packaged VSIX shared tunnel\n        run: node scripts/smoke-vsix-shared-tunnel.mjs\n`;
          if (!source.includes('Smoke test packaged VSIX shared tunnel')) {
            if (!source.includes(windowsNeedle)) throw new Error('Windows VSIX smoke step not found');
            source = source.replace(windowsNeedle, windowsBlock);
          }
          const linuxNeedle = "      - name: Linux packaged VSIX Worker smoke test\n        run: node scripts/smoke-vsix-worker.mjs\n";
          const linuxBlock = `${linuxNeedle}\n      - name: Linux packaged VSIX shared tunnel smoke test\n        run: node scripts/smoke-vsix-shared-tunnel.mjs\n`;
          if (!source.includes('Linux packaged VSIX shared tunnel smoke test')) {
            if (!source.includes(linuxNeedle)) throw new Error('Linux VSIX smoke step not found');
            source = source.replace(linuxNeedle, linuxBlock);
          }
          fs.writeFileSync(file, source, 'utf8');
          NODE
          node --check scripts/smoke-vsix-shared-tunnel.mjs
          grep -q "Smoke test packaged VSIX shared tunnel" .github/workflows/ci.yml
          grep -q "Linux packaged VSIX shared tunnel smoke test" .github/workflows/ci.yml
          git rm .github/workflows/apply-shared-tunnel-smoke.yml
          git add .github/workflows/ci.yml scripts/smoke-vsix-shared-tunnel.mjs
          git config user.name kukutx
          git config user.email 61358650+Kukutx@users.noreply.github.com
          git commit -m "Run shared tunnel smoke from packaged VSIX"
          git push origin HEAD:refactor/shared-tunnel-runtime
