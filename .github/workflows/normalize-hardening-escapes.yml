name: One-time hardening escape normalization

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  normalize:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Normalize nested template escapes and remove workflow
        shell: pwsh
        run: |
          $path = 'scripts/deep-runtime-hardening.mjs'
          $text = Get-Content $path -Raw
          $pairs = @(
            @('\\${path.relative(extensionPath, file)}', '\${path.relative(extensionPath, file)}'),
            @('\\${specifier}', '\${specifier}'),
            @('\\${file}', '\${file}')
          )
          foreach ($pair in $pairs) {
            if (-not $text.Contains($pair[0])) { throw "escape normalization anchor not found: $($pair[0])" }
            $text = $text.Replace($pair[0], $pair[1])
          }
          Set-Content -Path $path -Value $text -NoNewline
          Remove-Item .github/workflows/normalize-hardening-escapes.yml -Force

          git config user.name "kukutx"
          git config user.email "61358650+Kukutx@users.noreply.github.com"
          git add scripts/deep-runtime-hardening.mjs .github/workflows/normalize-hardening-escapes.yml
          git commit -m "Normalize hardening nested template escapes"
          git push origin master
