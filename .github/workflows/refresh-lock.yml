name: Refresh dependency lock

on:
  push:
    branches:
      - feat/obsidian-host

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[lock-refresh]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/obsidian-host
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit fix --package-lock-only
      - name: Commit refreshed lock
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json package.json; then
            echo "Dependency lock is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          git commit -m "chore: refresh audited dependency lock [lock-refresh]"
          git push origin HEAD:feat/obsidian-host
