name: Conversation isolation verified runner

on:
  push:
    branches:
      - fix/conversation-workspace-isolation

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/conversation-workspace-isolation
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Execute verified hardening script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [
            Path('.github/workflows/_conversation-isolation-fix.yml'),
            Path('.github/workflows/_conversation-isolation-fix2.yml'),
            Path('.github/workflows/_conversation-isolation-runner.yml'),
          ]
          for p in files:
            text = p.read_text()
            if 'timeout-minutes:' not in text:
              text = text.replace('    runs-on: ubuntu-latest\n', '    runs-on: ubuntu-latest\n    timeout-minutes: 60\n', 1)
              p.write_text(text)

          source = Path('.github/workflows/_conversation-isolation-fix2.yml').read_text()
          start_marker = '      - name: Apply hardening and verify\n'
          end_marker = '      - name: Commit verified changes\n'
          block = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          block = block.split('        run: |\n', 1)[1]
          lines = []
          for line in block.splitlines():
            lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/devmate-conversation-harden.sh').write_text('\n'.join(lines) + '\n')
          PY
          bash /tmp/devmate-conversation-harden.sh
      - name: Commit only after all checks pass
        shell: bash
        run: |
          rm -f .github/workflows/_conversation-isolation-fix.yml \
                .github/workflows/_conversation-isolation-fix2.yml \
                .github/workflows/_conversation-isolation-runner.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: harden conversation workspace isolation"
          git push origin HEAD:fix/conversation-workspace-isolation
