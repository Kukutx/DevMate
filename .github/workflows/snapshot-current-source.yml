name: Snapshot current DevMate source

on:
  push:
    branches:
      - refactor/shared-tunnel-runtime
    paths:
      - .github/workflows/snapshot-current-source.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: refactor/shared-tunnel-runtime
          fetch-depth: 0

      - name: Archive current source tree
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=obsidian-plugin/node_modules \
            --exclude=obsidian-plugin/dist \
            --exclude='*.vsix' \
            --exclude='*.tgz' \
            --exclude=.godot-ci \
            --exclude=tmp \
            -czf "$RUNNER_TEMP/devmate-current-source.tar.gz" .

      - name: Upload current source tree
        uses: actions/upload-artifact@v7
        with:
          name: devmate-current-source
          path: ${{ runner.temp }}/devmate-current-source.tar.gz
          if-no-files-found: error
          retention-days: 1
