name: Apply Spawn Layer Lifecycle V2

on:
  push:
    branches:
      - refactor/runtime-concurrency-hardening
    paths:
      - .github/workflows/apply-spawn-layer-lifecycle-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/runtime-concurrency-hardening
          fetch-depth: 0

      - name: Apply corrected patch
        run: node scripts/apply-spawn-layer-lifecycle.mjs

      - name: Verify changed JavaScript
        run: |
          node --check extension.js
          node --check extension-entry.js
          node --check extension-entry-win32.js
          node --check vscode-host/spawn-layer.js

      - name: Remove temporary migration files
        run: rm scripts/apply-spawn-layer-lifecycle.mjs .github/workflows/apply-spawn-layer-lifecycle-v2.yml

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension.js extension-entry.js extension-entry-win32.js scripts/apply-spawn-layer-lifecycle.mjs .github/workflows/apply-spawn-layer-lifecycle-v2.yml
          git commit -m "Make VS Code spawn wrappers activation-scoped"
          git push origin HEAD:refactor/runtime-concurrency-hardening
