name: Converge DevMate runtime

on:
  schedule:
    - cron: '*/5 * * * *'
  issue_comment:
    types:
      - created

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: converge-devmate-runtime-pr-36
  cancel-in-progress: true

jobs:
  converge:
    if: ${{ github.event_name == 'schedule' || (github.event.issue.pull_request && github.event.issue.number == 36 && github.event.comment.body == '/converge-runtime') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v7
        with:
          ref: refactor/shared-tunnel-runtime
          fetch-depth: 0

      - name: Detect pending convergence
        id: gate
        shell: bash
        run: |
          if [ -f scripts/apply_architecture_refactor.py ] && [ -f scripts/finalize_architecture_cleanup.py ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: npm ci

      - name: Generate and clean unified architecture
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_architecture_refactor.py
          python3 scripts/finalize_architecture_refactor.py
          python3 scripts/finalize_architecture_cleanup.py

      - name: Validate dependency audits
        if: steps.gate.outputs.run == 'true'
        run: |
          npm audit --omit=dev --audit-level=moderate
          npm audit --audit-level=moderate

      - name: Validate repository contracts
        if: steps.gate.outputs.run == 'true'
        run: npm run check

      - name: Validate unit and policy tests
        if: steps.gate.outputs.run == 'true'
        run: npm run test:unit

      - name: Validate Gateway
        if: steps.gate.outputs.run == 'true'
        run: npm run smoke:gateway

      - name: Validate VSIX package
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run package:vsix
          node scripts/smoke-vsix-worker.mjs
          node scripts/smoke-vsix-shared-tunnel.mjs

      - name: Validate Obsidian package
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run build:obsidian
          node scripts/smoke-obsidian-worker.mjs

      - name: Validate standalone Docker image
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker build --file deploy/docker/Dockerfile --tag devmate-converged .
          docker run --rm --entrypoint node devmate-converged /opt/devmate/scripts/devmate-cli.mjs help

      - name: Commit validated architecture
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "[architecture-refactor] Unify DevMate runtime core"
          git push origin HEAD:refactor/shared-tunnel-runtime
