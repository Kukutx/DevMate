name: Validate DevMate repair SHA

on:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: validate-devmate-repair-sha
  cancel-in-progress: true

env:
  REPAIR_SHA: 5a26ab320a3522dd2510d7a80cc6e843400ec792

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout fixed repair SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ env.REPAIR_SHA }}

      - name: Assert exact SHA
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:REPAIR_SHA) { throw 'Unexpected checkout SHA' }

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit dependency tree
        run: |
          npm audit --omit=dev --audit-level=moderate
          npm audit --audit-level=moderate

      - name: Repository contracts
        run: npm run check

      - name: Unit and policy tests
        run: npm run test:unit

      - name: Gateway smoke
        run: npm run smoke:gateway

      - name: Package and verify VSIX
        run: |
          npm run package:vsix
          node scripts/smoke-vsix-worker.mjs
          node scripts/smoke-vsix-shared-tunnel.mjs

      - name: Build and verify Obsidian bundle
        run: |
          npm run build:obsidian
          node scripts/smoke-obsidian-worker.mjs

  godot-real:
    name: Linux and Real Godot 4.7.1
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GODOT_VERSION: 4.7.1
      GODOT_STATUS: stable
    steps:
      - name: Checkout fixed repair SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ env.REPAIR_SHA }}

      - name: Assert exact SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$REPAIR_SHA"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit dependency tree
        run: |
          npm audit --omit=dev --audit-level=moderate
          npm audit --audit-level=moderate

      - name: Repository contracts
        run: npm run check

      - name: Unit and policy tests
        run: npm run test:unit

      - name: Gateway smoke
        run: npm run smoke:gateway

      - name: Package and verify VSIX
        run: |
          npm run package:vsix
          node scripts/smoke-vsix-worker.mjs
          node scripts/smoke-vsix-shared-tunnel.mjs

      - name: Build and verify Obsidian bundle
        run: |
          npm run build:obsidian
          node scripts/smoke-obsidian-worker.mjs

      - name: Standalone Docker network smoke
        shell: bash
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/devmate-docker-state"
          workspace="$RUNNER_TEMP/devmate-docker-workspace"
          mkdir -p "$state" "$workspace"
          chmod 0777 "$state" "$workspace"
          docker build --file deploy/docker/Dockerfile --tag devmate-repair-ci .
          docker run --rm \
            --volume "$state:/var/lib/devmate" \
            --volume "$workspace:/srv/devmate-workspaces" \
            devmate-repair-ci init \
            --workspace /srv/devmate-workspaces \
            --config /var/lib/devmate/config.json \
            --provider external >/dev/null
          docker run --detach --rm \
            --name devmate-repair-runtime \
            --publish 127.0.0.1:18787:8787 \
            --volume "$state:/var/lib/devmate" \
            --volume "$workspace:/srv/devmate-workspaces" \
            devmate-repair-ci serve --config /var/lib/devmate/config.json
          trap 'docker rm --force devmate-repair-runtime >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18787/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18787/health >/dev/null

      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb

      - name: Cache Godot editor
        uses: actions/cache@v6
        with:
          path: .godot-ci
          key: godot-${{ runner.os }}-${{ runner.arch }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}

      - name: Download and verify official Godot editor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .godot-ci
          archive="Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          executable="Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          if [ ! -x ".godot-ci/${executable}" ]; then
            api="https://api.github.com/repos/godotengine/godot-builds/releases/tags/${GODOT_VERSION}-${GODOT_STATUS}"
            curl --fail --silent --show-error --location "$api" --output .godot-ci/release.json
            archive_url=$(jq -r --arg name "$archive" '.assets[] | select(.name == $name) | .browser_download_url' .godot-ci/release.json)
            sums_url=$(jq -r '.assets[] | select(.name == "SHA512-SUMS.txt") | .browser_download_url' .godot-ci/release.json)
            test -n "$archive_url" && test "$archive_url" != "null"
            test -n "$sums_url" && test "$sums_url" != "null"
            curl --fail --silent --show-error --location "$archive_url" --output ".godot-ci/${archive}"
            curl --fail --silent --show-error --location "$sums_url" --output .godot-ci/SHA512-SUMS.txt
            (
              cd .godot-ci
              checksum_line=$(awk -v file="$archive" '$NF == file { print; exit }' SHA512-SUMS.txt)
              test -n "$checksum_line"
              printf '%s\n' "$checksum_line" | sha512sum --check --strict -
              unzip -q -o "$archive"
              chmod +x "$executable"
            )
          fi
          echo "GODOT_REAL_BIN=$PWD/.godot-ci/${executable}" >> "$GITHUB_ENV"

      - name: Show Godot version
        run: "$GODOT_REAL_BIN --version"

      - name: Real Godot validation and performance
        run: node --test tests/godot-real-runtime.test.mjs

      - name: Real Godot deterministic capture
        run: xvfb-run --auto-servernum node --test tests/godot-real-capture.test.mjs
