name: Converge DevMate runtime

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: converge-devmate-runtime-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  converge:
    if: ${{ github.head_ref == 'refactor/shared-tunnel-runtime' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v7
        with:
          ref: refactor/shared-tunnel-runtime
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate and clean unified architecture
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_architecture_refactor.py
          python3 scripts/finalize_architecture_refactor.py
          python3 scripts/finalize_architecture_cleanup.py

      - name: Validate dependency audits
        run: |
          npm audit --omit=dev --audit-level=moderate
          npm audit --audit-level=moderate

      - name: Validate repository contracts
        run: npm run check

      - name: Validate unit and policy tests
        run: npm run test:unit

      - name: Validate Gateway
        run: npm run smoke:gateway

      - name: Validate VSIX package
        shell: bash
        run: |
          set -euo pipefail
          npm run package:vsix
          node scripts/smoke-vsix-worker.mjs
          node scripts/smoke-vsix-shared-tunnel.mjs

      - name: Validate Obsidian package
        shell: bash
        run: |
          set -euo pipefail
          npm run build:obsidian
          node scripts/smoke-obsidian-worker.mjs

      - name: Validate standalone Docker image
        shell: bash
        run: |
          set -euo pipefail
          docker build --file deploy/docker/Dockerfile --tag devmate-converged .
          docker run --rm --entrypoint node devmate-converged /opt/devmate/scripts/devmate-cli.mjs help

      - name: Commit validated architecture
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "[architecture-refactor] Unify DevMate runtime core"
          git push origin HEAD:refactor/shared-tunnel-runtime
