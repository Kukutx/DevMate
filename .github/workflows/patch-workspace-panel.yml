name: Patch workspace panel

on:
  push:
    branches:
      - fix/pin-project-only-after-explicit-selection

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: fix/pin-project-only-after-explicit-selection
      - name: Apply deterministic panel patch
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'extension.js';
          let source = fs.readFileSync(file, 'utf8');
          const changes = [
            [
              '    <b>Active project</b><code>${esc(root || \'Open a VS Code folder first\')}</code>',
              '    <b>Current Project</b><code>${esc(root || \'Open a VS Code folder first\')}</code>'
            ],
            [
              '    <button class="secondary" data-cmd="connectionSetup">Connection Setup</button>',
              '    <button class="secondary" data-cmd="connectionSetup">Connection Setup</button>\\n    <button class="secondary" data-cmd="manageWorkspaces">Manage Workspaces</button>'
            ],
            [
              '    <p class="muted">DevMate keeps one writable active workspace. Add other projects as readonly references.</p>',
              '    <p class="muted">The Current Project follows VS Code. Additional writable workspaces can be managed separately and selected per ChatGPT conversation; reference projects remain readonly.</p>'
            ],
            [
              "    if(m.cmd==='connectionSetup') await vscode.commands.executeCommand('devMate.connectionSetup');",
              "    if(m.cmd==='connectionSetup') await vscode.commands.executeCommand('devMate.connectionSetup');\\n    if(m.cmd==='manageWorkspaces') await vscode.commands.executeCommand('devMate.manageWorkspaces');"
            ]
          ];
          for (const [from, to] of changes) {
            const count = source.split(from).length - 1;
            if (count !== 1) throw new Error(`Expected exactly one panel patch match, found ${count}: ${from.slice(0, 80)}`);
            source = source.replace(from, to);
          }
          fs.writeFileSync(file, source);
          NODE
      - name: Commit source patch and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/patch-workspace-panel.yml
          git config user.name "DevMate CI"
          git config user.email "actions@users.noreply.github.com"
          git add extension.js .github/workflows/patch-workspace-panel.yml
          git commit -m "feat: surface current project and workspace manager"
          git push origin HEAD:fix/pin-project-only-after-explicit-selection
