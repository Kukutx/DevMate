name: Minimal project isolation correction

on:
  push:
    branches:
      - fix/default-workspace-when-no-path

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/default-workspace-when-no-path
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Apply requested behavior only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 6ba3a08055cd636afa0ca1e544eab27a99954bdd
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          BASE='6ba3a08055cd636afa0ca1e544eab27a99954bdd'
          def base(path): return subprocess.check_output(['git','show',f'{BASE}:{path}'], text=True)
          def once(s, old, new, label):
              if old not in s: raise SystemExit(f'missing target: {label}')
              return s.replace(old,new,1)

          # Remove conversation-ownership rules from records/resources. Same-project
          # conversations must be able to continue existing work.
          for path in [
              'gateway/approvals.mjs',
              'gateway/job-tools.mjs',
              'gateway/persistent-processes.mjs',
              'gateway/plugins/preview-manager.mjs',
              'gateway/work-session-rollback.mjs',
              'gateway/work-sessions.mjs'
          ]:
              Path(path).write_text(base(path))
          Path('gateway/conversation-resources.mjs').unlink(missing_ok=True)

          # Keep only workspace binding additions; restore normal work-session behavior.
          p=Path('gateway/team-collaboration-tools.mjs'); s=p.read_text()
          s=s.replace('  activeWorkSession,\n', '')
          if 'function assertNoActiveConversationSession' in s:
              a=s.index('function assertNoActiveConversationSession')
              b=s.index('function bindWorkspace', a)
              s=s[:a]+s[b:]
          s=s.replace('function bindWorkspace(input, principal) {\n  const scope = assertConversationScope();\n  const preview = normalizeInstanceConfig(readConfig());\n  assertNoActiveConversationSession(preview, principal, scope);', 'function bindWorkspace(input) {\n  const scope = assertConversationScope();')
          s=s.replace('    const principal = principalNow();\n    const binding = bindWorkspace(input, principal);', '    const binding = bindWorkspace(input);')
          s=s.replace('    const principal = principalNow();\n    const preview = normalizeInstanceConfig(readConfig());\n    assertNoActiveConversationSession(preview, principal, scope);\n', '')
          start=s.index("  register('work_session_start'")
          end=s.index("  register('published_preview_share'", start)
          legacy=base('gateway/team-collaboration-tools.mjs')
          lstart=legacy.index("  register('work_session_start'")
          lend=legacy.index("  register('published_preview_share'", lstart)
          s=s[:start]+legacy[lstart:lend]+s[end:]
          p.write_text(s)

          # Project isolation only: explicit workspace_bind wins; otherwise first
          # project call pins the current default workspace for this conversation.
          p=Path('gateway/team-capabilities.mjs'); s=p.read_text()
          s=s.replace("import { audit, readConfig, redactSensitiveString } from './local-shared.mjs';", "import { audit, mutateConfig, readConfig, redactSensitiveString } from './local-shared.mjs';")
          s=s.replace("  assertConversationWorkspaceMatch,\n  conversationWorkspace\n", "  assertConversationWorkspaceMatch,\n  bindConversationWorkspaceToWorkspace,\n  conversationWorkspace\n")
          s=s.replace("import { listPersistentProcesses, processConversationScope } from './persistent-processes.mjs';", "import { listPersistentProcesses } from './persistent-processes.mjs';")
          s=s.replace("import { getPreview, previewConversationScope } from './plugins/preview-manager.mjs';", "import { getPreview } from './plugins/preview-manager.mjs';")

          old_filter="""function filterResult(name, result, principal, authorizedWorkspaceId = null, conversationScope = requestConversationScope()) {
  if (!result?.structuredContent) return sanitizeToolResult(name, result);
  const scopedData = result.structuredContent;
  if (name === 'list_processes' && Array.isArray(scopedData.processes)) {
    scopedData.processes = scopedData.processes.filter(item => (!authorizedWorkspaceId || item.workspaceId === authorizedWorkspaceId) && (!conversationScope || processConversationScope(item.id) === conversationScope));
    scopedData.running = scopedData.processes.filter(item => ['running', 'stopping'].includes(item.status)).length;
    syncTextContent(result);
  }
  if (name === 'web_preview_status' && Array.isArray(scopedData.previews)) {
    scopedData.previews = scopedData.previews.filter(item => (!authorizedWorkspaceId || item.workspaceId === authorizedWorkspaceId) && (!conversationScope || previewConversationScope(item.id) === conversationScope));
    syncTextContent(result);
  }
"""
          new_filter="""function filterResult(name, result, principal, authorizedWorkspaceId = null) {
  if (!result?.structuredContent) return sanitizeToolResult(name, result);
  const scopedData = result.structuredContent;
  if (name === 'list_processes' && Array.isArray(scopedData.processes) && authorizedWorkspaceId) {
    scopedData.processes = scopedData.processes.filter(item => item.workspaceId === authorizedWorkspaceId);
    scopedData.running = scopedData.processes.filter(item => ['running', 'stopping'].includes(item.status)).length;
    syncTextContent(result);
  }
  if (name === 'web_preview_status' && Array.isArray(scopedData.previews) && authorizedWorkspaceId) {
    scopedData.previews = scopedData.previews.filter(item => item.workspaceId === authorizedWorkspaceId);
    syncTextContent(result);
  }
"""
          s=once(s,old_filter,new_filter,'workspace-only result filter')

          a=s.index('function conversationBindingRequired')
          b=s.index('async function authorizedToolExecution', a)
          replacement="""function defaultConversationWorkspace(current) {
  const workspaces = Array.isArray(current?.workspaces) ? current.workspaces : [];
  return workspaces.find(item => item?.id === current?.activeWorkspaceId && !item.reference && item.mode !== 'readonly')
    || workspaces.find(item => item && !item.reference && item.mode !== 'readonly')
    || workspaces[0]
    || null;
}

function persistDefaultConversationBinding(scope, workspace) {
  if (!scope || !workspace) return null;
  let result = null;
  mutateConfig(config => {
    normalizeInstanceConfig(config);
    const existing = conversationWorkspace(config, scope);
    if (existing) { result = existing; return config; }
    result = bindConversationWorkspaceToWorkspace(config, scope, workspace, { source: 'default' });
    return config;
  }, { retries: 4 });
  return result;
}

function prepareConversationWorkspace(name, args, current) {
  const scope = requestConversationScope();
  const inferred = inferredWorkspace(name, args);
  let authorizationArgs = inferred && !args.workspaceId ? { ...args, workspaceId: inferred } : args;
  if (!scope || !workspaceScopedTool(name)) return { current, args: authorizationArgs };

  let binding = conversationWorkspace(current, scope);
  if (!binding) {
    const fallback = defaultConversationWorkspace(current);
    if (!fallback) throw new Error('No workspace configured');
    persistDefaultConversationBinding(scope, fallback);
    current = normalizeInstanceConfig(readConfig());
    binding = conversationWorkspace(current, scope);
  }
  if (!binding) throw new Error('No workspace configured');

  if (authorizationArgs.workspaceId) {
    const requested = resolveWorkspace(current, authorizationArgs.workspaceId);
    assertConversationWorkspaceMatch(current, scope, requested);
  }
  return { current, args: { ...authorizationArgs, workspaceId: binding.id } };
}

"""
          s=s[:a]+replacement+s[b:]
          s=s.replace('        authorized.principal,\n        authorized.workspaceId,\n        requestConversationScope()\n', '        authorized.principal,\n        authorized.workspaceId\n')
          s=s.replace('    ? activeWorkSession(authorized.principal.id, authorized.workspaceId, requestConversationScope())', '    ? activeWorkSession(authorized.principal.id, authorized.workspaceId)')
          s=s.replace("touchWorkSession(authorized.principal.id, authorized.workspaceId, { failed: result?.isError === true, conversationScope: requestConversationScope() })", "touchWorkSession(authorized.principal.id, authorized.workspaceId, { failed: result?.isError === true })")
          s=s.replace("touchWorkSession(authorized.principal.id, authorized.workspaceId, { failed: true, conversationScope: requestConversationScope() })", "touchWorkSession(authorized.principal.id, authorized.workspaceId, { failed: true })")
          s=s.replace(',\n      conversationScope: requestConversationScope()\n    });', '\n    });')
          s=s.replace('  persistExplicitConversationBinding,\n', '')
          if '  defaultConversationWorkspace,\n' not in s:
              s=s.replace('  failedGitPhase,\n', '  failedGitPhase,\n  defaultConversationWorkspace,\n  persistDefaultConversationBinding,\n')
          p.write_text(s)

          # Keep the instruction exactly to the requested project-selection rule.
          p=Path('gateway/server.mjs'); s=p.read_text()
          old_text="DevMate is a local development gateway for personal and team workflows. It supports reading, editing, running commands, and full Git workflows according to the user's request. Keep responses practical and avoid exposing secrets; reference workspaces are read-only. In ChatGPT, bind the conversation to its intended project before project-scoped work. When the user supplies an absolute local path, call workspace_bind with that exact path and treat it as authoritative; never substitute the current VS Code or Obsidian workspace. Never adopt work sessions, jobs, persistent processes, or previews from another conversation after a reconnect."
          new_text="DevMate is a local development gateway for personal and team workflows. It supports reading, editing, running commands, and full Git workflows according to the user's request. Keep responses practical and avoid exposing secrets; reference workspaces are read-only. In ChatGPT, if the user provides an absolute local path, call workspace_bind with that path and use it. If the user provides no path, use the current default VS Code or Obsidian workspace. Keep a conversation on its selected project across reconnects; records from the same project may be continued by another conversation."
          s=once(s,old_text,new_text,'server instruction')
          p.write_text(s)

          # Replace the over-strict regression with the requested behavior.
          Path('tests/conversation-workspace-isolation.test.mjs').write_text(r'''import test from 'node:test';
import assert from 'node:assert/strict';
import fs from 'node:fs';
import os from 'node:os';
import path from 'node:path';
import { conversationScopeFromToolContext, runWithConversationScope } from '../gateway/request-context.mjs';
import { bindConversationWorkspaceToPath, conversationWorkspace } from '../gateway/conversation-workspaces.mjs';
import { resolveWorkspace } from '../gateway/workspace-resolver.mjs';
import { activeWorkSession, clearWorkSessions, startWorkSession } from '../gateway/work-sessions.mjs';
import { clearWorkspaceLeases } from '../gateway/workspace-leases.mjs';
import { __test as capabilityTest } from '../gateway/team-capabilities.mjs';

const scopeA = 'chatgpt-' + 'a'.repeat(32);
const scopeB = 'chatgpt-' + 'b'.repeat(32);

test('conversation identity is stable across reconnect metadata', () => {
  const a1 = conversationScopeFromToolContext({ mcpReq: { _meta: { 'openai/session': 'conversation-a' } } });
  const a2 = conversationScopeFromToolContext({ mcpReq: { _meta: { 'openai/session': 'conversation-a' } } });
  const b = conversationScopeFromToolContext({ mcpReq: { _meta: { 'openai/session': 'conversation-b' } } });
  assert.equal(a1, a2);
  assert.notEqual(a1, b);
});

test('explicit local path overrides the host default only for that conversation', () => {
  const explicit = fs.mkdtempSync(path.join(os.tmpdir(), 'devmate-explicit-'));
  const host = fs.mkdtempSync(path.join(os.tmpdir(), 'devmate-default-'));
  const config = { activeWorkspaceId: 'host', workspaces: [{ id: 'host', name: 'Host', root: host, mode: 'workspace-write', reference: false }] };
  bindConversationWorkspaceToPath(config, scopeA, explicit, { allowExternalWrite: true });
  runWithConversationScope(scopeA, () => assert.equal(resolveWorkspace(config, '').root, fs.realpathSync.native(explicit)));
  runWithConversationScope(scopeB, () => assert.equal(resolveWorkspace(config, '').id, 'host'));
});

test('no explicit path selects the current default workspace', () => {
  const one = fs.mkdtempSync(path.join(os.tmpdir(), 'devmate-one-'));
  const two = fs.mkdtempSync(path.join(os.tmpdir(), 'devmate-two-'));
  const config = { activeWorkspaceId: 'two', workspaces: [
    { id: 'one', name: 'One', root: one, mode: 'workspace-write', reference: false },
    { id: 'two', name: 'Two', root: two, mode: 'workspace-write', reference: false }
  ] };
  assert.equal(capabilityTest.defaultConversationWorkspace(config).id, 'two');
});

test('same-project work-session records remain shareable across conversations', () => {
  clearWorkSessions(); clearWorkspaceLeases();
  const principal = { id: 'local-owner', name: 'Local owner', role: 'owner', source: 'local' };
  let session;
  runWithConversationScope(scopeA, () => { session = startWorkSession({ principal, workspaceId: 'app' }); });
  runWithConversationScope(scopeB, () => assert.equal(activeWorkSession(principal.id, 'app')?.id, session.id));
  clearWorkSessions(); clearWorkspaceLeases();
});
''')

          # Changelog/version.
          p=Path('CHANGELOG.md'); s=p.read_text()
          if '## 3.6.4' not in s:
              s=s.replace('# Changelog\n', '# Changelog\n\n## 3.6.4\n- Kept reconnect isolation at the project/workspace level only. Same-project conversations can continue existing records and work sessions.\n- Explicit local paths take precedence; when no path is provided, a new conversation uses the current VS Code/Obsidian default workspace.\n', 1)
          p.write_text(s)
          PY

          rm -f .github/workflows/_minimal-project-isolation-fix.yml
          npm ci
          npm version 3.6.4 --no-git-tag-version
          npm run version:sync
          node --test tests/conversation-workspace-isolation.test.mjs tests/approval-execution-boundary.test.cjs
          npm run check
          npm run test:unit
          npm run smoke:gateway
          npm run package:vsix

          if grep -R "conversation-resources\|processConversationScope\|previewConversationScope\|work_session_conversation_conflict\|conversation_workspace_durable_job_unsafe" gateway tests --exclude='server.bundle.mjs'; then
            echo 'Found removed over-strict conversation ownership logic' >&2
            exit 1
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: isolate projects without locking same-project sessions"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/Kukutx/DevMate.git"
          git push origin HEAD:fix/default-workspace-when-no-path
