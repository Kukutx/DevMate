name: Apply VS Code Host Package

on:
  push:
    branches:
      - refactor/vscode-host-hardening
    paths:
      - scripts/apply-vscode-host-package.mjs
      - .github/workflows/apply-vscode-host-package.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/vscode-host-hardening
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply manifest update
        run: node scripts/apply-vscode-host-package.mjs

      - name: Remove one-time migration files
        run: |
          rm scripts/apply-vscode-host-package.mjs
          rm .github/workflows/apply-vscode-host-package.yml

      - name: Commit manifest update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Use self-contained VS Code Gateway bundle"
          git push origin HEAD:refactor/vscode-host-hardening
