name: One-time deep runtime hardening

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  harden:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply deep runtime hardening
        run: node scripts/deep-runtime-hardening.mjs

      - name: Remove one-time hardening machinery
        shell: pwsh
        run: |
          Remove-Item scripts/deep-runtime-hardening.mjs -Force
          Remove-Item .github/workflows/deep-runtime-hardening.yml -Force

      - name: Repository contracts
        run: npm run check

      - name: Full unit and policy suite
        run: npm run test:unit

      - name: Gateway smoke
        run: npm run smoke:gateway

      - name: Package and smoke VSIX runtime
        shell: pwsh
        run: |
          npm run package:vsix
          node scripts/smoke-vsix-runtime.mjs
          node scripts/smoke-vsix-shared-tunnel.mjs

      - name: Commit hardening
        shell: pwsh
        run: |
          git config user.name "kukutx"
          git config user.email "61358650+Kukutx@users.noreply.github.com"
          git add -A
          if (-not (git diff --cached --quiet)) {
            git commit -m "Harden and simplify desktop runtime boundaries"
            git push origin master
          }
