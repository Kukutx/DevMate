name: Targeted ngrok conflict fix

on:
  push:
    branches:
      - ngrok-conflict-fix

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.repository == 'Kukutx/DevMate' && github.actor == 'Kukutx'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Repair one-time patcher matching
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'scripts/apply-ngrok-conflict-fix.cjs';
          let text = fs.readFileSync(file, 'utf8');
          const before = "  text = replaceOnce(text, `    this.borrowedAgentApiBase = '';\\n    this.borrowedPublicUrl = '';`, `    this.borrowedAgentApiBase = '';\\n    this.borrowedPublicVerified = false;\\n    this.borrowedPublicUrl = '';`, 'borrowed public verification state');";
          const after = "  text = replaceOnce(text, `    this.borrowedProvider = false;\\n    this.borrowedAgentApiBase = '';\\n    this.borrowedPublicUrl = '';\\n    this.borrowedFailureCount = 0;\\n    this.port = 0;`, `    this.borrowedProvider = false;\\n    this.borrowedAgentApiBase = '';\\n    this.borrowedPublicVerified = false;\\n    this.borrowedPublicUrl = '';\\n    this.borrowedFailureCount = 0;\\n    this.port = 0;`, 'borrowed public verification state');";
          if (!text.includes(before)) throw new Error('Expected ambiguous patcher block not found');
          text = text.replace(before, after);
          fs.writeFileSync(file, text, 'utf8');
          NODE

      - name: Apply targeted fix
        run: node scripts/apply-ngrok-conflict-fix.cjs

      - name: Install
        run: npm ci

      - name: Repository contracts
        run: npm run check

      - name: Unit and policy tests
        run: npm run test:unit

      - name: Gateway smoke
        run: npm run smoke:gateway

      - name: Package VSIX
        run: npm run package:vsix

      - name: Packaged VSIX runtime smoke
        run: node scripts/smoke-vsix-runtime.mjs

      - name: Packaged VSIX shared tunnel smoke
        run: node scripts/smoke-vsix-shared-tunnel.mjs

      - name: Commit final clean tree
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix real ngrok ERR334 conflict path without cleanup debt"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:ngrok-conflict-fix
