name: Apply Final Spawn Layer Migration

on:
  push:
    branches:
      - refactor/runtime-concurrency-hardening
    paths:
      - .github/workflows/apply-spawn-layer-final.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest branch
        uses: actions/checkout@v4
        with:
          ref: refactor/runtime-concurrency-hardening
          fetch-depth: 0

      - name: Apply activation-scoped process layers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          root = Path('.')
          def decode(value):
              return base64.b64decode(value).decode()
          def replace_once(path, old, new, label):
              file = root / path
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match in {path}, found {count}')
              file.write_text(text.replace(old, new, 1))
          def replace_between(path, start_marker, end_marker, replacement, label):
              file = root / path
              text = file.read_text()
              start = text.find(start_marker)
              if start < 0:
                  raise RuntimeError(f'{label}: start marker missing in {path}')
              end = text.find(end_marker, start + len(start_marker)) if end_marker else len(text)
              if end < 0:
                  raise RuntimeError(f'{label}: end marker missing in {path}')
              file.write_text(text[:start] + replacement + text[end:])

          extension = (root / 'extension.js').read_text()
          old_line = "const { spawn, spawnSync } = require('child_process');\n"
          if old_line in extension:
              extension = extension.replace(old_line, "const childProcess = require('child_process');\n", 1)
              marker = "const { RuntimeController, SUPPORTED_CONFIG_VERSION } = require('./host/runtime-controller.js');\n"
              if marker not in extension:
                  raise RuntimeError('RuntimeController import marker missing')
              extension = extension.replace(marker, marker + "\nfunction spawn(...args){ return childProcess.spawn(...args); }\nfunction spawnSync(...args){ return childProcess.spawnSync(...args); }\n", 1)
          (root / 'extension.js').write_text(extension)

          entry = (root / 'extension-entry.js').read_text()
          if "require('./vscode-host/spawn-layer.js')" not in entry:
              entry = entry.replace(
                  "const childProcess = require('child_process');\n",
                  "const childProcess = require('child_process');\nconst { SpawnLayer } = require('./vscode-host/spawn-layer.js');\n",
                  1
              )
          if 'let managedSpawnLayer = null;' not in entry:
              entry = entry.replace(
                  'let globalContext = null;\n',
                  'let globalContext = null;\nlet managedSpawnLayer = null;\nlet activationAttempted = false;\nlet activated = false;\n',
                  1
              )
          (root / 'extension-entry.js').write_text(entry)

          replace_between(
              'extension-entry.js',
              'function loadBaseExtensionWithNgrokWrapper() {',
              'async function saveManagedAuthtoken',
              decode(''),
              'managed spawn helpers'
          )
          replace_between(
              'extension-entry.js',
              'async function activate(context) {',
              '',
              decode(''),
              'managed ngrok lifecycle'
          )
          (root / 'extension-entry-win32.js').write_text(decode(''))
          PY

      - name: Verify and commit
        shell: bash
        run: |
          node --check extension.js
          node --check extension-entry.js
          node --check extension-entry-win32.js
          node --check vscode-host/spawn-layer.js
          rm .github/workflows/apply-spawn-layer-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension.js extension-entry.js extension-entry-win32.js .github/workflows/apply-spawn-layer-final.yml
          git commit -m "Make VS Code process wrappers activation-scoped"
          git push origin HEAD:refactor/runtime-concurrency-hardening
