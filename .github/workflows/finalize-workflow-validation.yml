name: Finalize workflow validation

on:
  push:
    branches:
      - refactor/shared-tunnel-runtime
    paths:
      - .github/workflows/finalize-workflow-validation.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: refactor/shared-tunnel-runtime
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Add permanent workflow parser
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          package_path = root / 'package.json'
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package.setdefault('devDependencies', {})['js-yaml'] = '^4.3.1'
          package['devDependencies'] = dict(sorted(package['devDependencies'].items()))
          package['scripts']['check'] = 'npm run version:check && node scripts/check-repository.mjs && node scripts/check-workflows.mjs && node scripts/check-obsidian-release.mjs'
          activation = package.setdefault('activationEvents', [])
          if 'onCommand:devMate.copyToken' not in activation:
              activation.insert(activation.index('onCommand:devMate.copyUrl') + 1, 'onCommand:devMate.copyToken')
          package_path.write_text(json.dumps(package, indent=2) + '\n', encoding='utf-8')

          checker = r'''#!/usr/bin/env node
          import fs from 'node:fs';
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';
          import yaml from 'js-yaml';

          const root = path.resolve(path.dirname(fileURLToPath(import.meta.url)), '..');
          const directory = path.join(root, '.github', 'workflows');
          const files = fs.readdirSync(directory).filter(name => /\.ya?ml$/i.test(name)).sort();
          if (!files.length) throw new Error('No GitHub workflows found');

          for (const name of files) {
            const file = path.join(directory, name);
            const source = fs.readFileSync(file, 'utf8');
            let document;
            try {
              document = yaml.load(source, { filename: file, json: true });
            } catch (error) {
              throw new Error(`${name} is not valid YAML: ${error.message}`);
            }
            if (!document || typeof document !== 'object' || Array.isArray(document)) {
              throw new Error(`${name} must contain one workflow mapping`);
            }
            if (!document.name || !document.on || !document.jobs || typeof document.jobs !== 'object') {
              throw new Error(`${name} is missing name, on, or jobs`);
            }
            for (const [jobName, job] of Object.entries(document.jobs)) {
              if (!job || typeof job !== 'object' || !Array.isArray(job.steps) || job.steps.length === 0) {
                throw new Error(`${name} job ${jobName} must contain steps`);
              }
            }
          }
          console.log(`Validated ${files.length} GitHub workflows.`);
          '''
          lines = [line[10:] if line.startswith('          ') else line for line in checker.splitlines()]
          (root / 'scripts' / 'check-workflows.mjs').write_text('\n'.join(lines).strip() + '\n', encoding='utf-8')
          PY
          npm install --package-lock-only --ignore-scripts
          npm ci
          node scripts/check-workflows.mjs
          npm run version:check

      - name: Commit workflow validation contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json scripts/check-workflows.mjs
          git commit -m "Validate GitHub workflow syntax in repository checks"
          git push origin HEAD:refactor/shared-tunnel-runtime
