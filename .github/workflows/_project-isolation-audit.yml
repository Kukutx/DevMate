name: Verify project isolation audit

on:
  push:
    branches:
      - fix/project-isolation-audit

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/project-isolation-audit
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Patch and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/_project-isolation-audit.py
          git rm .github/workflows/_project-isolation-audit.yml scripts/_project-isolation-audit.py
          npm ci
          npm version 3.6.5 --no-git-tag-version
          npm run version:sync
          node --test tests/conversation-workspace-isolation.test.mjs tests/job-tools-visibility.test.mjs tests/team-access.test.mjs tests/approval-execution-boundary.test.cjs
          npm run check
          npm run test:unit
          npm run smoke:gateway
          npm run package:vsix
          if grep -R "conversation_resource_conflict\|work_session_conversation_conflict\|conversation_workspace_durable_job_unsafe\|belongs to another ChatGPT conversation\|must deliberately bind" gateway --exclude='server.bundle.mjs'; then exit 1; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: complete project isolation audit"
          git push origin HEAD:fix/project-isolation-audit
