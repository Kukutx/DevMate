name: Verify project isolation audit
on:
  push:
    branches: [fix/project-isolation-audit]
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/project-isolation-audit
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Patch and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'missing replacement target: {label}')
              p.write_text(s.replace(old, new, 1))

          p = Path('gateway/conversation-workspaces.mjs')
          s = p.read_text()
          s = s.replace("export const CONVERSATION_BINDING_TTL_MS = 7 * 24 * 60 * 60 * 1000;\n", '')
          s = s.replace(",\n    expiresAt: new Date(now + CONVERSATION_BINDING_TTL_MS).toISOString()\n  };", "\n  };")
          s = s.replace("  const expires = Date.parse(value.expiresAt || '');\n  if (!Number.isFinite(expires)) return null;\n", '')
          s = s.replace(",\n    expiresAt: new Date(expires).toISOString()\n  };", "\n  };")
          s = s.replace("    if (!binding || Date.parse(binding.expiresAt) <= now) continue;", "    if (!binding) continue;")
          s = s.replace("    binding.expiresAt = new Date(now + CONVERSATION_BINDING_TTL_MS).toISOString();\n", '')
          s = s.replace(",\n    expiresAt: binding.expiresAt\n  };", "\n  };")
          p.write_text(s)

          replace_once(
              'gateway/team-capabilities.mjs',
              "  bindConversationWorkspaceToWorkspace,\n  conversationWorkspace\n} from './conversation-workspaces.mjs';",
              "  bindConversationWorkspaceToWorkspace,\n  conversationWorkspace,\n  conversationWorkspaceBinding\n} from './conversation-workspaces.mjs';",
              'conversation binding import'
          )
          replace_once(
              'gateway/team-capabilities.mjs',
              "function prepareConversationWorkspace(name, args, current) {",
              "function refreshConversationBinding(scope, current) {\n  const stored = conversationWorkspaceBinding(current, scope);\n  if (!stored) return current;\n  const updatedAt = Date.parse(stored.updatedAt || stored.createdAt || '');\n  if (Number.isFinite(updatedAt) && Date.now() - updatedAt < 24 * 60 * 60 * 1000) return current;\n  mutateConfig(config => {\n    normalizeInstanceConfig(config);\n    conversationWorkspaceBinding(config, scope, { touch: true });\n    return config;\n  }, { retries: 4 });\n  return normalizeInstanceConfig(readConfig());\n}\n\nfunction prepareConversationWorkspace(name, args, current) {",
              'binding refresh helper'
          )
          replace_once(
              'gateway/team-capabilities.mjs',
              "  if (!binding) throw new Error('No workspace configured');\n\n  if (authorizationArgs.workspaceId) {",
              "  if (!binding) throw new Error('No workspace configured');\n  current = refreshConversationBinding(scope, current);\n  binding = conversationWorkspace(current, scope);\n  if (!binding) throw new Error('No workspace configured');\n\n  if (authorizationArgs.workspaceId) {",
              'binding refresh use'
          )

          replace_once(
              'gateway/tool-policy.mjs',
              "  'workspace_bind', 'workspace_binding_status', 'workspace_unbind',\n  'add_trusted_root', 'remove_trusted_root',\n  'work_session_start', 'work_session_status', 'work_session_finish', 'work_session_rollback',\n  'plugin_catalog', 'plugin_diagnostics', 'plugin_enable', 'plugin_disable', 'plugin_configure', 'devmate_plugins_panel',\n  'team_status', 'team_member_list', 'team_member_create', 'team_member_update', 'team_member_rotate', 'team_member_revoke',\n  'team_activity_status', 'team_configure', 'deployment_status', 'deployment_readiness', 'deployment_policy_template',\n  'workspace_lease_status', 'published_preview_share', 'published_preview_list', 'published_preview_revoke',\n  'job_target_catalog', 'job_runtime_configure', 'job_submit', 'job_list', 'job_status', 'job_artifacts', 'job_cancel', 'job_retry', 'runner_status',",
              "  'workspace_bind', 'workspace_binding_status', 'workspace_unbind',\n  'add_trusted_root', 'remove_trusted_root',\n  'plugin_catalog', 'plugin_diagnostics', 'plugin_enable', 'plugin_disable', 'plugin_configure', 'devmate_plugins_panel',\n  'team_status', 'team_member_list', 'team_member_create', 'team_member_update', 'team_member_rotate', 'team_member_revoke',\n  'team_activity_status', 'team_configure', 'deployment_status', 'deployment_readiness', 'deployment_policy_template',\n  'job_target_catalog', 'job_runtime_configure', 'runner_status',",
              'project-scoped resource tools'
          )

          p = Path('gateway/team-collaboration-tools.mjs')
          s = p.read_text()
          s = s.replace("      workspaceId: z.string().min(1),\n      title:", "      workspaceId: z.string().min(1).optional(),\n      title:", 1)
          old = "  }, async ({ id, workspaceId, all = false }) => {\n    const principal = principalNow();\n    const config = normalizeInstanceConfig(readConfig());\n    if (id) {\n      const item = workSession(id);\n      if (!item) return toolText({ session: null });\n      assertVisibleWorkspace(principal, item.workspaceId);"
          new = "  }, async ({ id, workspaceId, all = false }) => {\n    const principal = principalNow();\n    const config = normalizeInstanceConfig(readConfig());\n    const resolvedWorkspaceId = workspaceId ? resolveWorkspace(config, workspaceId).id : undefined;\n    if (resolvedWorkspaceId) assertVisibleWorkspace(principal, resolvedWorkspaceId);\n    if (id) {\n      const item = workSession(id);\n      if (!item) return toolText({ session: null });\n      if (resolvedWorkspaceId && item.workspaceId !== resolvedWorkspaceId) throw new Error(`Work session ${id} belongs to a different project workspace`);\n      assertVisibleWorkspace(principal, item.workspaceId);"
          if old not in s: raise SystemExit('missing work session status header')
          s = s.replace(old, new, 1)
          s = s.replace("    const resolvedWorkspaceId = workspaceId ? resolveWorkspace(config, workspaceId).id : undefined;\n    if (resolvedWorkspaceId) assertVisibleWorkspace(principal, resolvedWorkspaceId);\n    const canSeeAll", "    const canSeeAll", 1)
          s = s.replace("      id: z.string().min(1),\n      force: z.boolean().optional(),\n      releaseLease:", "      id: z.string().min(1),\n      workspaceId: z.string().optional(),\n      force: z.boolean().optional(),\n      releaseLease:", 1)
          s = s.replace("  }, async ({ id, force = false, releaseLease = true }) => {\n    const principal = principalNow();\n    const result = finishWorkSession({ id, principal, force, releaseLease });", "  }, async ({ id, workspaceId, force = false, releaseLease = true }) => {\n    const principal = principalNow();\n    const config = normalizeInstanceConfig(readConfig());\n    const item = workSession(id);\n    if (item && workspaceId && item.workspaceId !== resolveWorkspace(config, workspaceId).id) throw new Error(`Work session ${id} belongs to a different project workspace`);\n    const result = finishWorkSession({ id, principal, force, releaseLease });", 1)
          s = s.replace("      workSessionId: z.string().min(1),\n      dryRun:", "      workSessionId: z.string().min(1),\n      workspaceId: z.string().optional(),\n      dryRun:", 1)
          s = s.replace("  }, async ({ workSessionId, dryRun = false, force = false, limit = 1000 }) => {\n    const principal = principalNow();\n    return toolText(await rollbackWorkSession({ workSessionId, principal, dryRun, force, limit }));", "  }, async ({ workSessionId, workspaceId, dryRun = false, force = false, limit = 1000 }) => {\n    const principal = principalNow();\n    const config = normalizeInstanceConfig(readConfig());\n    const item = workSession(workSessionId);\n    if (item && workspaceId && item.workspaceId !== resolveWorkspace(config, workspaceId).id) throw new Error(`Work session ${workSessionId} belongs to a different project workspace`);\n    return toolText(await rollbackWorkSession({ workSessionId, principal, dryRun, force, limit }));", 1)
          s = s.replace("      previewId: z.string().min(1),\n      ttlSeconds:", "      previewId: z.string().min(1),\n      workspaceId: z.string().optional(),\n      ttlSeconds:", 1)
          s = s.replace("    const preview = getPreview(input.previewId);\n    assertVisibleWorkspace(principal, preview.workspaceId, 'publish');\n    const result = createPreviewShare({\n      ...input,", "    const preview = getPreview(input.previewId);\n    const selectedWorkspaceId = input.workspaceId ? resolveWorkspace(config, input.workspaceId).id : null;\n    if (selectedWorkspaceId && preview.workspaceId !== selectedWorkspaceId) throw new Error(`Preview ${input.previewId} belongs to a different project workspace`);\n    assertVisibleWorkspace(principal, preview.workspaceId, 'publish');\n    const { workspaceId: _workspaceId, ...shareInput } = input;\n    const result = createPreviewShare({\n      ...shareInput,", 1)
          s = s.replace("    inputSchema: { id: z.string().min(1) },", "    inputSchema: { id: z.string().min(1), workspaceId: z.string().optional() },", 1)
          s = s.replace("  }, async ({ id }) => {\n    const principal = principalNow();\n    const item = listPreviewShares().find(value => value.id === id);\n    if (item) assertVisibleWorkspace(principal, item.workspaceId, 'revoke a share for');", "  }, async ({ id, workspaceId }) => {\n    const principal = principalNow();\n    const config = normalizeInstanceConfig(readConfig());\n    const item = listPreviewShares().find(value => value.id === id);\n    if (item && workspaceId && item.workspaceId !== resolveWorkspace(config, workspaceId).id) throw new Error(`Published preview ${id} belongs to a different project workspace`);\n    if (item) assertVisibleWorkspace(principal, item.workspaceId, 'revoke a share for');", 1)
          s = s.replace(",\n        source: binding.source,\n        expiresAt: binding.expiresAt\n      }", ",\n        source: binding.source\n      }", 1)
          p.write_text(s)

          replace_once(
              'gateway/job-tools.mjs',
              "function currentProjectWorkspaceId() {\n  const config = normalizeInstanceConfig(readConfig());\n  const bound = conversationWorkspace(config);\n  if (bound?.id) return bound.id;\n  const workspaces = Array.isArray(config.workspaces) ? config.workspaces : [];\n  return config.activeWorkspaceId || workspaces.find(item => item && !item.reference && item.mode !== 'readonly')?.id || workspaces[0]?.id || null;\n}\n\nfunction ensureCurrentProjectJob(job) {\n  const currentWorkspaceId = currentProjectWorkspaceId();",
              "function currentConversationWorkspaceId() {\n  const config = normalizeInstanceConfig(readConfig());\n  return conversationWorkspace(config)?.id || null;\n}\n\nfunction currentProjectWorkspaceId() {\n  const config = normalizeInstanceConfig(readConfig());\n  const bound = conversationWorkspace(config);\n  if (bound?.id) return bound.id;\n  const workspaces = Array.isArray(config.workspaces) ? config.workspaces : [];\n  return config.activeWorkspaceId || workspaces.find(item => item && !item.reference && item.mode !== 'readonly')?.id || workspaces[0]?.id || null;\n}\n\nfunction ensureCurrentProjectJob(job) {\n  const currentWorkspaceId = currentConversationWorkspaceId();",
              'job project fence only for conversations'
          )

          p = Path('tests/conversation-workspace-isolation.test.mjs')
          s = p.read_text()
          s = s.replace("import { bindConversationWorkspaceToPath } from '../gateway/conversation-workspaces.mjs';", "import { bindConversationWorkspaceToPath, conversationWorkspaceBinding, pruneConversationWorkspaceBindings } from '../gateway/conversation-workspaces.mjs';")
          s = s.replace("import { __test as capabilityTest } from '../gateway/team-capabilities.mjs';", "import { __test as capabilityTest } from '../gateway/team-capabilities.mjs';\nimport { workspaceScopedTool } from '../gateway/tool-policy.mjs';")
          s += "\n\ntest('project selection does not expire just because a conversation is old', () => {\n  const root = fs.mkdtempSync(path.join(os.tmpdir(), 'devmate-stable-project-'));\n  const config = { activeWorkspaceId: 'app', workspaces: [{ id: 'app', name: 'App', root, mode: 'workspace-write', reference: false }] };\n  bindConversationWorkspaceToPath(config, scopeA, root, { allowExternalWrite: true, now: 0 });\n  pruneConversationWorkspaceBindings(config, 365 * 24 * 60 * 60 * 1000);\n  assert.equal(conversationWorkspaceBinding(config, scopeA)?.workspaceId, 'app');\n});\n\ntest('project-tied records are scoped by project, not by conversation owner', () => {\n  for (const name of ['work_session_start', 'work_session_status', 'work_session_finish', 'work_session_rollback', 'workspace_lease_status', 'published_preview_share', 'published_preview_list', 'published_preview_revoke', 'job_submit', 'job_list', 'job_status', 'job_artifacts', 'job_cancel', 'job_retry']) {\n    assert.equal(workspaceScopedTool(name), true, name);\n  }\n});\n"
          p.write_text(s)

          p = Path('CHANGELOG.md')
          s = p.read_text()
          if '## 3.6.5' not in s:
              s = s.replace('# Changelog\n', '# Changelog\n\n## 3.6.5\n- Audited project isolation so project selection stays stable without expiring, while same-project sessions and records remain shareable.\n- Applied the selected-project boundary consistently to work sessions, leases, previews, and durable jobs.\n')
          p.write_text(s)
          PY

          git rm .github/workflows/_project-isolation-audit.yml
          npm ci
          npm version 3.6.5 --no-git-tag-version
          npm run version:sync
          node --test tests/conversation-workspace-isolation.test.mjs tests/job-tools-visibility.test.mjs tests/approval-execution-boundary.test.cjs
          npm run check
          npm run test:unit
          npm run smoke:gateway
          npm run package:vsix
          if grep -R "conversation_resource_conflict\|work_session_conversation_conflict\|conversation_workspace_durable_job_unsafe\|belongs to another ChatGPT conversation\|must deliberately bind" gateway tests --exclude='server.bundle.mjs'; then exit 1; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: audit project isolation boundaries"
          git push origin HEAD:fix/project-isolation-audit
