name: Verify project isolation audit
on:
  push:
    branches: [fix/project-isolation-audit]
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/project-isolation-audit
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Patch and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'missing replacement target: {label}')
              p.write_text(s.replace(old, new, 1))

          # Project choice is memory, not ownership. Do not expire it by time.
          p = Path('gateway/conversation-workspaces.mjs')
          s = p.read_text()
          s = s.replace("export const CONVERSATION_BINDING_TTL_MS = 7 * 24 * 60 * 60 * 1000;\n", '')
          s = s.replace("    updatedAt: timestamp,\n    expiresAt: new Date(now + CONVERSATION_BINDING_TTL_MS).toISOString()", "    updatedAt: timestamp")
          s = s.replace("  const expires = Date.parse(value.expiresAt || '');\n  if (!Number.isFinite(expires)) return null;\n", '')
          s = s.replace("    updatedAt: value.updatedAt || null,\n    expiresAt: new Date(expires).toISOString()", "    updatedAt: value.updatedAt || null")
          s = s.replace("    if (!binding || Date.parse(binding.expiresAt) <= now) continue;", "    if (!binding) continue;")
          s = s.replace("    binding.expiresAt = new Date(now + CONVERSATION_BINDING_TTL_MS).toISOString();\n", '')
          s = s.replace("    source: binding.source,\n    expiresAt: binding.expiresAt", "    source: binding.source")
          p.write_text(s)

          # Keep active conversation project selections fresh for bounded LRU retention.
          replace_once(
              'gateway/team-capabilities.mjs',
              "  bindConversationWorkspaceToWorkspace,\n  conversationWorkspace\n} from './conversation-workspaces.mjs';",
              "  bindConversationWorkspaceToWorkspace,\n  conversationWorkspace,\n  conversationWorkspaceBinding\n} from './conversation-workspaces.mjs';",
              'conversation binding import'
          )
          replace_once(
              'gateway/team-capabilities.mjs',
              "function prepareConversationWorkspace(name, args, current) {",
              "function refreshConversationBinding(scope, current) {\n  const stored = conversationWorkspaceBinding(current, scope);\n  if (!stored) return current;\n  const updatedAt = Date.parse(stored.updatedAt || stored.createdAt || '');\n  if (Number.isFinite(updatedAt) && Date.now() - updatedAt < 24 * 60 * 60 * 1000) return current;\n  mutateConfig(config => {\n    normalizeInstanceConfig(config);\n    conversationWorkspaceBinding(config, scope, { touch: true });\n    return config;\n  }, { retries: 4 });\n  return normalizeInstanceConfig(readConfig());\n}\n\nfunction prepareConversationWorkspace(name, args, current) {",
              'binding refresh helper'
          )
          replace_once(
              'gateway/team-capabilities.mjs',
              "  if (!binding) throw new Error('No workspace configured');\n\n  if (authorizationArgs.workspaceId) {",
              "  if (!binding) throw new Error('No workspace configured');\n  current = refreshConversationBinding(scope, current);\n  binding = conversationWorkspace(current, scope);\n  if (!binding) throw new Error('No workspace configured');\n\n  if (authorizationArgs.workspaceId) {",
              'binding refresh use'
          )

          # Non-workspace collaboration tools still need a ChatGPT-only project fence.
          replace_once(
              'gateway/team-collaboration-tools.mjs',
              "import {\n  bindConversationWorkspaceToPath,\n  bindConversationWorkspaceToWorkspace,\n  clearConversationWorkspaceBinding,\n  publicConversationWorkspaceBinding\n} from './conversation-workspaces.mjs';",
              "import {\n  assertConversationWorkspaceMatch,\n  bindConversationWorkspaceToPath,\n  bindConversationWorkspaceToWorkspace,\n  clearConversationWorkspaceBinding,\n  conversationWorkspace,\n  publicConversationWorkspaceBinding\n} from './conversation-workspaces.mjs';",
              'collaboration conversation imports'
          )
          replace_once(
              'gateway/team-collaboration-tools.mjs',
              "function bindWorkspace(input) {",
              "function defaultConversationWorkspace(config) {\n  const workspaces = Array.isArray(config?.workspaces) ? config.workspaces : [];\n  return workspaces.find(item => item?.id === config?.activeWorkspaceId && !item.reference && item.mode !== 'readonly')\n    || workspaces.find(item => item && !item.reference && item.mode !== 'readonly')\n    || workspaces[0]\n    || null;\n}\n\nfunction selectedConversationProject(requested = '') {\n  const scope = requestConversationScope();\n  let config = normalizeInstanceConfig(readConfig());\n  if (!scope) return { config, scope: null, workspace: null };\n  let workspace = conversationWorkspace(config, scope);\n  if (!workspace) {\n    const fallback = defaultConversationWorkspace(config);\n    if (!fallback) throw new Error('No workspace configured');\n    mutateConfig(current => {\n      normalizeInstanceConfig(current);\n      if (!conversationWorkspace(current, scope)) {\n        bindConversationWorkspaceToWorkspace(current, scope, fallback, { source: 'default' });\n      }\n      return current;\n    }, { retries: 4 });\n    config = normalizeInstanceConfig(readConfig());\n    workspace = conversationWorkspace(config, scope);\n  }\n  if (!workspace) throw new Error('No workspace configured');\n  if (requested) {\n    const candidate = resolveWorkspace(config, requested);\n    assertConversationWorkspaceMatch(config, scope, candidate);\n  }\n  return { config, scope, workspace };\n}\n\nfunction bindWorkspace(input) {",
              'collaboration selected project helper'
          )
          p = Path('gateway/team-collaboration-tools.mjs')
          s = p.read_text()
          s = s.replace("        source: binding.source,\n        expiresAt: binding.expiresAt", "        source: binding.source")
          s = s.replace("      workspaceId: z.string().min(1),\n      title:", "      workspaceId: z.string().min(1).optional(),\n      title:", 1)
          s = s.replace(
              "    const config = normalizeInstanceConfig(readConfig());\n    const principal = principalNow();\n    const workspace = resolveWorkspace(config, input.workspaceId);\n    assertVisibleWorkspace(principal, workspace.id, 'start a session for');",
              "    const selected = selectedConversationProject(input.workspaceId);\n    const config = selected.config;\n    const principal = principalNow();\n    const workspace = selected.scope ? selected.workspace : resolveWorkspace(config, input.workspaceId);\n    assertVisibleWorkspace(principal, workspace.id, 'start a session for');",
              1
          )
          old = "  }, async ({ id, workspaceId, all = false }) => {\n    const principal = principalNow();\n    const config = normalizeInstanceConfig(readConfig());\n    if (id) {\n      const item = workSession(id);\n      if (!item) return toolText({ session: null });\n      assertVisibleWorkspace(principal, item.workspaceId);"
          new = "  }, async ({ id, workspaceId, all = false }) => {\n    const principal = principalNow();\n    const selected = selectedConversationProject(workspaceId);\n    const config = selected.config;\n    if (id) {\n      const item = workSession(id);\n      if (!item) return toolText({ session: null });\n      if (selected.scope && item.workspaceId !== selected.workspace.id) throw new Error(`Work session ${id} belongs to a different project workspace`);\n      assertVisibleWorkspace(principal, item.workspaceId);"
          if old not in s: raise SystemExit('missing work session status header')
          s = s.replace(old, new, 1)
          s = s.replace(
              "    const resolvedWorkspaceId = workspaceId ? resolveWorkspace(config, workspaceId).id : undefined;",
              "    const resolvedWorkspaceId = selected.scope ? selected.workspace.id : (workspaceId ? resolveWorkspace(config, workspaceId).id : undefined);",
              1
          )
          s = s.replace(
              "  }, async ({ id, force = false, releaseLease = true }) => {\n    const principal = principalNow();\n    const result = finishWorkSession({ id, principal, force, releaseLease });",
              "  }, async ({ id, force = false, releaseLease = true }) => {\n    const principal = principalNow();\n    const selected = selectedConversationProject();\n    const item = workSession(id);\n    if (selected.scope && item && item.workspaceId !== selected.workspace.id) throw new Error(`Work session ${id} belongs to a different project workspace`);\n    const result = finishWorkSession({ id, principal, force, releaseLease });",
              1
          )
          s = s.replace(
              "  }, async ({ workSessionId, dryRun = false, force = false, limit = 1000 }) => {\n    const principal = principalNow();\n    return toolText(await rollbackWorkSession({ workSessionId, principal, dryRun, force, limit }));",
              "  }, async ({ workSessionId, dryRun = false, force = false, limit = 1000 }) => {\n    const principal = principalNow();\n    const selected = selectedConversationProject();\n    const item = workSession(workSessionId);\n    if (selected.scope && item && item.workspaceId !== selected.workspace.id) throw new Error(`Work session ${workSessionId} belongs to a different project workspace`);\n    return toolText(await rollbackWorkSession({ workSessionId, principal, dryRun, force, limit }));",
              1
          )
          s = s.replace(
              "    const config = normalizeInstanceConfig(readConfig());\n    const principal = principalNow();\n    const preview = getPreview(input.previewId);\n    assertVisibleWorkspace(principal, preview.workspaceId, 'publish');",
              "    const selected = selectedConversationProject();\n    const config = selected.config;\n    const principal = principalNow();\n    const preview = getPreview(input.previewId);\n    if (selected.scope && preview.workspaceId !== selected.workspace.id) throw new Error(`Preview ${input.previewId} belongs to a different project workspace`);\n    assertVisibleWorkspace(principal, preview.workspaceId, 'publish');",
              1
          )
          s = s.replace(
              "  }, async filters => {\n    const principal = principalNow();\n    let items = listPreviewShares(filters);",
              "  }, async filters => {\n    const principal = principalNow();\n    const selected = selectedConversationProject(filters.workspaceId);\n    const effectiveFilters = selected.scope ? { ...filters, workspaceId: selected.workspace.id } : filters;\n    let items = listPreviewShares(effectiveFilters);",
              1
          )
          s = s.replace(
              "  }, async ({ id }) => {\n    const principal = principalNow();\n    const item = listPreviewShares().find(value => value.id === id);\n    if (item) assertVisibleWorkspace(principal, item.workspaceId, 'revoke a share for');",
              "  }, async ({ id }) => {\n    const principal = principalNow();\n    const selected = selectedConversationProject();\n    const item = listPreviewShares().find(value => value.id === id);\n    if (selected.scope && item && item.workspaceId !== selected.workspace.id) throw new Error(`Published preview ${id} belongs to a different project workspace`);\n    if (item) assertVisibleWorkspace(principal, item.workspaceId, 'revoke a share for');",
              1
          )
          s = s.replace(
              "  }, async ({ workspaceId }) => {\n    const principal = principalNow();\n    const config = normalizeInstanceConfig(readConfig());\n    const resolvedWorkspaceId = workspaceId ? resolveWorkspace(config, workspaceId).id : undefined;",
              "  }, async ({ workspaceId }) => {\n    const principal = principalNow();\n    const selected = selectedConversationProject(workspaceId);\n    const config = selected.config;\n    const resolvedWorkspaceId = selected.scope ? selected.workspace.id : (workspaceId ? resolveWorkspace(config, workspaceId).id : undefined);",
              1
          )
          p.write_text(s)

          # Durable jobs remain non-workspace control-plane tools, but ChatGPT calls are fenced to the selected project only.
          replace_once(
              'gateway/job-tools.mjs',
              "import { audit, readConfig, toolText, writeConfig } from './local-shared.mjs';\nimport { conversationWorkspace } from './conversation-workspaces.mjs';",
              "import { audit, mutateConfig, readConfig, toolText, writeConfig } from './local-shared.mjs';\nimport {\n  assertConversationWorkspaceMatch,\n  bindConversationWorkspaceToWorkspace,\n  conversationWorkspace\n} from './conversation-workspaces.mjs';\nimport { requestConversationScope } from './request-context.mjs';",
              'job imports'
          )
          replace_once(
              'gateway/job-tools.mjs',
              "import { principalNow } from './team-tool-data.mjs';",
              "import { principalNow } from './team-tool-data.mjs';\nimport { resolveWorkspace } from './workspace-resolver.mjs';",
              'job resolver import'
          )
          p = Path('gateway/job-tools.mjs')
          s = p.read_text()
          start = s.index('function currentProjectWorkspaceId()')
          end = s.index('function ensureVisible(', start)
          helper = """function defaultConversationWorkspace(config) {
  const workspaces = Array.isArray(config?.workspaces) ? config.workspaces : [];
  return workspaces.find(item => item?.id === config?.activeWorkspaceId && !item.reference && item.mode !== 'readonly')
    || workspaces.find(item => item && !item.reference && item.mode !== 'readonly')
    || workspaces[0]
    || null;
}

function selectedConversationProject(requested = '') {
  const scope = requestConversationScope();
  if (!scope) return { scope: null, workspace: null };
  let config = normalizeInstanceConfig(readConfig());
  let workspace = conversationWorkspace(config, scope);
  if (!workspace) {
    const fallback = defaultConversationWorkspace(config);
    if (!fallback) throw new Error('No workspace configured');
    mutateConfig(current => {
      normalizeInstanceConfig(current);
      if (!conversationWorkspace(current, scope)) {
        bindConversationWorkspaceToWorkspace(current, scope, fallback, { source: 'default' });
      }
      return current;
    }, { retries: 4 });
    config = normalizeInstanceConfig(readConfig());
    workspace = conversationWorkspace(config, scope);
  }
  if (!workspace) throw new Error('No workspace configured');
  if (requested) {
    const candidate = resolveWorkspace(config, requested);
    assertConversationWorkspaceMatch(config, scope, candidate);
  }
  return { scope, workspace };
}

function selectedJobWorkspaceId(requested = '') {
  const selected = selectedConversationProject(requested);
  return selected.scope ? selected.workspace.id : String(requested || '').trim() || null;
}

function ensureCurrentProjectJob(job, requested = '') {
  const selected = selectedConversationProject(requested);
  if (selected.scope && job.workspaceId && job.workspaceId !== selected.workspace.id) {
    throw new Error(`Job ${job.id} belongs to a different project workspace`);
  }
  return job;
}

"""
          s = s[:start] + helper + s[end:]
          s = s.replace(
              "    const args = withWorkspace(rawArgs, workspaceId || currentProjectWorkspaceId());",
              "    const scope = requestConversationScope();\n    const args = scope\n      ? { ...rawArgs, workspaceId: selectedJobWorkspaceId(workspaceId || rawArgs.workspaceId) }\n      : withWorkspace(rawArgs, workspaceId);",
              1
          )
          s = s.replace(
              "  }, async ({ status, workspaceId, limit = 100 }) => toolText({\n    jobs: listJobs({ principal: principalNow(), status, workspaceId: workspaceId || currentProjectWorkspaceId(), limit })\n  }));",
              "  }, async ({ status, workspaceId, limit = 100 }) => {\n    const effectiveWorkspaceId = requestConversationScope() ? selectedJobWorkspaceId(workspaceId) : workspaceId;\n    return toolText({ jobs: listJobs({ principal: principalNow(), status, workspaceId: effectiveWorkspaceId, limit }) });\n  });",
              1
          )
          s = s.replace(
              "  }, async ({ id, includeArguments = false, includeResult = true }) => {\n    const principal = principalNow();\n    return toolText({ job: ensureCurrentProjectJob(ensureVisible(getJob(id, { includeArguments, includeResult }), principal)) });",
              "  }, async ({ id, workspaceId, includeArguments = false, includeResult = true }) => {\n    const principal = principalNow();\n    return toolText({ job: ensureCurrentProjectJob(ensureVisible(getJob(id, { includeArguments, includeResult }), principal), workspaceId) });",
              1
          )
          s = s.replace(
              "  }, async ({ id }) => {\n    const principal = principalNow();\n    const job = ensureCurrentProjectJob(ensureVisible(getJob(id), principal));",
              "  }, async ({ id, workspaceId }) => {\n    const principal = principalNow();\n    const job = ensureCurrentProjectJob(ensureVisible(getJob(id), principal), workspaceId);",
              1
          )
          s = s.replace(
              "  }, async ({ id, force = false }) => {\n    const principal = principalNow();\n    ensureCurrentProjectJob(ensureVisible(getJob(id), principal));",
              "  }, async ({ id, workspaceId, force = false }) => {\n    const principal = principalNow();\n    ensureCurrentProjectJob(ensureVisible(getJob(id), principal), workspaceId);",
              1
          )
          s = s.replace(
              "  }, async ({ id }) => {\n    const principal = principalNow();\n    const existing = ensureCurrentProjectJob(ensureVisible(getJob(id, { includeArguments: true }), principal));",
              "  }, async ({ id, workspaceId }) => {\n    const principal = principalNow();\n    const existing = ensureCurrentProjectJob(ensureVisible(getJob(id, { includeArguments: true }), principal), workspaceId);",
              1
          )
          p.write_text(s)

          # Regression coverage for exactly the requested behavior.
          p = Path('tests/conversation-workspace-isolation.test.mjs')
          s = p.read_text()
          s = s.replace(
              "import { bindConversationWorkspaceToPath } from '../gateway/conversation-workspaces.mjs';",
              "import { bindConversationWorkspaceToPath, conversationWorkspaceBinding, pruneConversationWorkspaceBindings } from '../gateway/conversation-workspaces.mjs';"
          )
          s += """

test('project selection does not expire just because a conversation is old', () => {
  const root = fs.mkdtempSync(path.join(os.tmpdir(), 'devmate-stable-project-'));
  const config = { activeWorkspaceId: 'app', workspaces: [{ id: 'app', name: 'App', root, mode: 'workspace-write', reference: false }] };
  bindConversationWorkspaceToPath(config, scopeA, root, { allowExternalWrite: true, now: 0 });
  pruneConversationWorkspaceBindings(config, 365 * 24 * 60 * 60 * 1000);
  assert.equal(conversationWorkspaceBinding(config, scopeA)?.workspaceId, 'app');
});

test('project resource fences do not restore conversation ownership locks', () => {
  const capabilitySource = fs.readFileSync(new URL('../gateway/team-capabilities.mjs', import.meta.url), 'utf8');
  const collaborationSource = fs.readFileSync(new URL('../gateway/team-collaboration-tools.mjs', import.meta.url), 'utf8');
  const jobSource = fs.readFileSync(new URL('../gateway/job-tools.mjs', import.meta.url), 'utf8');
  const combined = capabilitySource + collaborationSource + jobSource;
  assert.doesNotMatch(combined, /conversation_resource_conflict|work_session_conversation_conflict|conversation_workspace_durable_job_unsafe|belongs to another ChatGPT conversation|must deliberately bind/);
  assert.match(collaborationSource, /different project workspace/);
  assert.match(jobSource, /different project workspace/);
});
"""
          p.write_text(s)

          p = Path('CHANGELOG.md')
          s = p.read_text()
          if '## 3.6.5' not in s:
              s = s.replace('# Changelog\n', '# Changelog\n\n## 3.6.5\n- Kept each ChatGPT conversation on its selected project across long gaps and reconnects without expiring the project choice.\n- Applied the same project boundary to sessions, leases, previews, and jobs while keeping same-project records shareable across conversations.\n')
          p.write_text(s)
          PY

          git rm .github/workflows/_project-isolation-audit.yml
          npm ci
          npm version 3.6.5 --no-git-tag-version
          npm run version:sync
          node --test tests/conversation-workspace-isolation.test.mjs tests/job-tools-visibility.test.mjs tests/team-access.test.mjs tests/approval-execution-boundary.test.cjs
          npm run check
          npm run test:unit
          npm run smoke:gateway
          npm run package:vsix
          if grep -R "conversation_resource_conflict\|work_session_conversation_conflict\|conversation_workspace_durable_job_unsafe\|belongs to another ChatGPT conversation\|must deliberately bind" gateway tests --exclude='server.bundle.mjs'; then exit 1; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: complete project isolation audit"
          git push origin HEAD:fix/project-isolation-audit
