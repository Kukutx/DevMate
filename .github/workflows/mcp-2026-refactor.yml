name: MCP 2026 refactor

on:
  push:
    branches:
      - fix/final-deep-hardening

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/final-deep-hardening

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Apply strict MCP 2026 refactor
        run: node scripts/mcp-2026-refactor.mjs

      - name: Commit refactor
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gateway/server.mjs gateway/request-guard.mjs gateway/plugins/plugin-host.mjs scripts/devmate-runner.mjs
          git commit -m "refactor: enforce MCP 2026 stateless runtime"
          git push origin HEAD:fix/final-deep-hardening
