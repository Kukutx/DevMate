name: Portfolio PNG Sync

on:
  push:
    branches:
      - portfolio/visual-release-polish-final

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true

      - name: Convert portfolio visual to PNG
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          try:
              import cairosvg
          except ImportError:
              raise SystemExit(42)
          cairosvg.svg2png(
              url='docs/media/devmate-flow.svg',
              write_to='docs/media/devmate-flow.png',
              output_width=1200,
              output_height=420,
          )
          from pathlib import Path
          readme = Path('README.md')
          text = readme.read_text()
          text = text.replace('docs/media/devmate-flow.svg', 'docs/media/devmate-flow.png')
          readme.write_text(text)
          PY

      - name: Install converter if needed
        if: failure()
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check cairosvg
          python - <<'PY'
          import cairosvg
          from pathlib import Path
          cairosvg.svg2png(url='docs/media/devmate-flow.svg', write_to='docs/media/devmate-flow.png', output_width=1200, output_height=420)
          readme = Path('README.md')
          readme.write_text(readme.read_text().replace('docs/media/devmate-flow.svg', 'docs/media/devmate-flow.png'))
          PY

      - name: Commit PNG visual
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/media/devmate-flow.png
          grep -q 'docs/media/devmate-flow.png' README.md
          git rm docs/media/devmate-flow.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/media/devmate-flow.png
          git commit -m "docs: use packaged-safe PNG portfolio visual"
          git push origin HEAD:portfolio/visual-release-polish-final
