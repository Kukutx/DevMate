name: One-time runner consistency fix

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply runner consistency fixes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          function replace(file, before, after) {
            let text = fs.readFileSync(file, 'utf8');
            if (!text.includes(before)) throw new Error(`${file}: expected text not found`);
            text = text.replace(before, after);
            fs.writeFileSync(file, text, 'utf8');
          }
          function replaceAll(file, before, after, expected) {
            let text = fs.readFileSync(file, 'utf8');
            const count = text.split(before).length - 1;
            if (count !== expected) throw new Error(`${file}: expected ${expected} matches, found ${count}`);
            text = text.split(before).join(after);
            fs.writeFileSync(file, text, 'utf8');
          }

          replace(
            'gateway/runner-tools.mjs',
            "import { audit, readConfig, toolText, writeConfig } from './local-shared.mjs';\n",
            "import { audit, readConfig, toolText, writeConfig } from './local-shared.mjs';\nimport { normalizeInstanceConfig } from './team-access.mjs';\n"
          );
          replace(
            'gateway/runner-tools.mjs',
            "function publicRuntime(config) {\n  const runtime = jobRuntimeStatus();\n  return {\n    embeddedRunnerEnabled: config.jobs?.embeddedRunnerEnabled !== false,",
            "function normalizedRunnerConfig() {\n  return normalizeRunnerControlConfig(normalizeInstanceConfig(readConfig()));\n}\n\nfunction publicRuntime(config) {\n  const runtime = jobRuntimeStatus();\n  return {\n    embeddedRunnerEnabled: config.jobs?.embeddedRunnerEnabled === true,"
          );
          replaceAll(
            'gateway/runner-tools.mjs',
            'normalizeRunnerControlConfig(readConfig())',
            'normalizedRunnerConfig()',
            7
          );
          replace(
            'gateway/runner-tools.mjs',
            'export const __test = { maintainerNow, ownerNow, publicRuntime };',
            'export const __test = { maintainerNow, normalizedRunnerConfig, ownerNow, publicRuntime };'
          );

          replace(
            'gateway/job-tools.mjs',
            "    writeConfig(config);\n    const runner = refreshLocalRunner();\n    await audit('job_runtime_configure', {\n      principalId: principal.id,\n      keys: Object.keys(patch),\n      maxConcurrentJobs: runner.maxConcurrent\n    });\n    return toolText({ configured: true, policy: runtimePolicy(config), runner });",
            "    writeConfig(config);\n    const runtime = jobRuntimeStatus();\n    const runner = runtime.started ? refreshLocalRunner() : null;\n    await audit('job_runtime_configure', {\n      principalId: principal.id,\n      keys: Object.keys(patch),\n      maxConcurrentJobs: config.runtime.maxConcurrentJobs,\n      embeddedRunnerRunning: runtime.started\n    });\n    return toolText({ configured: true, policy: runtimePolicy(config), runner, runtime });"
          );

          replace(
            'tests/runner-tools.test.mjs',
            "  deployment: { mode: 'team' },\n  team: { enabled: true, members: [], requireWorkspaceLeaseForWrites: false },\n  production: {},\n",
            "  connection: { provider: 'ngrok', publicUrl: '' },\n  team: { members: [], requireWorkspaceLeaseForWrites: false },\n  requestPolicy: {},\n  runtime: { maxConcurrentJobs: 2 },\n"
          );
          replace(
            'tests/runner-tools.test.mjs',
            "const { registerRunnerTools } = await import('../gateway/runner-tools.mjs');",
            "const { __test, registerRunnerTools } = await import('../gateway/runner-tools.mjs');"
          );
          replace(
            'tests/runner-tools.test.mjs',
            "test('Runner topology status distinguishes configured and live embedded state', async () => {",
            "test('Runner runtime reporting treats missing embedded-runner state as disabled', () => {\n  const config = { jobs: {}, runnerControl: { enabled: false, path: '/runner/v1', maxRequestBytes: 65536, requestsPerMinute: 30, maxCredentials: 1, credentials: [] } };\n  assert.equal(__test.publicRuntime(config).embeddedRunnerEnabled, false);\n});\n\ntest('Runner topology status distinguishes configured and live embedded state', async () => {"
          );

          replace(
            'docs/JOBS.md',
            "The embedded Runner runs inside the central Gateway process and is disabled by default. Enable it only when durable background execution is actually needed. It registers:\n",
            "The embedded Runner runs inside the central Gateway process and is disabled by default. Enable it only when durable background execution is actually needed. Toggle it with `runner_control_configure`; restart the Gateway when the tool reports that a lifecycle restart is required. It registers:\n"
          );
          replace(
            'docs/JOBS.md',
            "Configure it with `job_runtime_configure`:\n",
            "Configure embedded concurrency and safe Git-save policy with `job_runtime_configure`:\n"
          );
          NODE
          rm -f .github/workflows/fix-runner-consistency-once.yml
      - run: npm ci
      - run: npm run check
      - name: Targeted tests
        run: node --test tests/runner-tools.test.mjs tests/job-runtime.test.mjs tests/team-strict-config.test.mjs tests/stability-endurance-contract.test.cjs
      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --exit-code && { echo 'No changes produced'; exit 1; }
          git commit -m 'Align runner controls with current config defaults'
          git push origin HEAD:master
