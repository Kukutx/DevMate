name: One-time runner boundary consistency fix

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply runner boundary fixes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          function replace(file, before, after) {
            let text = fs.readFileSync(file, 'utf8');
            if (!text.includes(before)) throw new Error(`${file}: expected text not found`);
            text = text.replace(before, after);
            fs.writeFileSync(file, text, 'utf8');
          }

          replace(
            'gateway/runner-control-plane.mjs',
            "    const preview = normalizeRunnerControlConfig(readConfig());\n    if (!touchRunnerCredential(preview, runnerId)) return false;\n    mutateConfig(current => {\n      normalizeRunnerControlConfig(current);",
            "    const preview = normalizeRunnerControlConfig(normalizeInstanceConfig(readConfig()));\n    if (!touchRunnerCredential(preview, runnerId)) return false;\n    mutateConfig(current => {\n      normalizeRunnerControlConfig(normalizeInstanceConfig(current));"
          );

          replace(
            'gateway/runner-tools.mjs',
            "    activeCredentials: config.runnerControl.credentials.filter(item =>\n      !item.disabled && (!item.expiresAt || Date.parse(item.expiresAt) > Date.now())\n    ).length",
            "    activeCredentials: config.runnerControl.credentials.filter(item =>\n      !item.disabled &&\n      !!item.salt &&\n      !!item.tokenHash &&\n      Array.isArray(item.workspaceIds) &&\n      item.workspaceIds.length > 0 &&\n      (!item.expiresAt || Date.parse(item.expiresAt) > Date.now())\n    ).length"
          );

          replace(
            'tests/runner-tools.test.mjs',
            "test('Runner topology status distinguishes configured and live embedded state', async () => {",
            "test('Runner runtime reporting counts only usable credentials as active', () => {\n  const config = {\n    jobs: {},\n    runnerControl: {\n      enabled: true,\n      path: '/runner/v1',\n      maxRequestBytes: 65536,\n      requestsPerMinute: 30,\n      maxCredentials: 4,\n      credentials: [\n        { disabled: false, salt: 'salt', tokenHash: 'hash', workspaceIds: ['app'] },\n        { disabled: false, workspaceIds: ['app'] },\n        { disabled: false, salt: 'salt', tokenHash: 'hash', workspaceIds: [] },\n        { disabled: true, salt: 'salt', tokenHash: 'hash', workspaceIds: ['app'] }\n      ]\n    }\n  };\n  assert.equal(__test.publicRuntime(config).activeCredentials, 1);\n});\n\ntest('Runner topology status distinguishes configured and live embedded state', async () => {"
          );

          replace(
            'tests/stability-endurance-contract.test.cjs',
            "  assert.equal(jobTools.includes('const runner = runtime.started ? refreshLocalRunner() : null'), true);\n});",
            "  assert.equal(jobTools.includes('const runner = runtime.started ? refreshLocalRunner() : null'), true);\n  const runnerControl = source('gateway/runner-control-plane.mjs');\n  const touchStart = runnerControl.indexOf('function touchCredentialBestEffort');\n  const touchEnd = runnerControl.indexOf('function consumeClaimBestEffort', touchStart);\n  const touch = runnerControl.slice(touchStart, touchEnd);\n  assert.equal(touch.includes('normalizeRunnerControlConfig(normalizeInstanceConfig(readConfig()))'), true);\n  assert.equal(touch.includes('normalizeRunnerControlConfig(normalizeInstanceConfig(current))'), true);\n});"
          );
          NODE
          rm -f .github/workflows/fix-runner-boundaries-once.yml
      - run: npm ci
      - run: npm run check
      - name: Targeted tests
        run: node --test tests/runner-tools.test.mjs tests/runner-control-plane.test.mjs tests/stability-endurance-contract.test.cjs
      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --exit-code && { echo 'No changes produced'; exit 1; }
          git commit -m 'Harden runner credential status and config boundary'
          git push origin HEAD:master
