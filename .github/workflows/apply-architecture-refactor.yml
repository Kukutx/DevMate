name: Apply architecture refactor

on:
  push:
    branches:
      - refactor/shared-tunnel-runtime
    paths:
      - scripts/apply_architecture_refactor.py
      - scripts/finalize_architecture_refactor.py
      - scripts/finalize_architecture_cleanup.py
      - scripts/finalize_architecture_cleanup_core.py
      - scripts/finalize_runtime_integrity.py
      - scripts/finalize_cli_config.py
      - scripts/finalize_network_runtime.py
      - scripts/finalize_runner_runtime.py
      - scripts/finalize_version_source.py
      - scripts/finalize_auth_transport.py
      - scripts/finalize_smoke_auth.py
      - scripts/finalize_vsix_contract.py
      - scripts/finalize_url_sanitization.py
      - scripts/finalize_test_paths.py
      - scripts/finalize_supply_chain.py
      - scripts/finalize_ci_cleanup.py
      - scripts/finalize_test_contracts.py
      - .github/workflows/apply-architecture-refactor.yml

permissions:
  contents: write

concurrency:
  group: apply-architecture-refactor-final-audit
  cancel-in-progress: true

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[architecture-refactor]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: refactor/shared-tunnel-runtime
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply architecture migration
        run: |
          python3 scripts/apply_architecture_refactor.py
          python3 scripts/finalize_architecture_refactor.py
          python3 scripts/finalize_architecture_cleanup.py

      - name: Dependency audits
        run: |
          npm audit --omit=dev --audit-level=moderate
          npm audit --audit-level=moderate

      - name: Repository contracts
        run: npm run check

      - name: Unit and policy tests
        run: npm run test:unit

      - name: Gateway smoke tests
        run: npm run smoke:gateway

      - name: Package and validate VSIX
        run: |
          npm run package:vsix
          node scripts/smoke-vsix-worker.mjs
          node scripts/smoke-vsix-shared-tunnel.mjs

      - name: Build and validate Obsidian package
        run: |
          npm run build:obsidian
          node scripts/smoke-obsidian-worker.mjs

      - name: Validate standalone Docker image
        shell: bash
        run: |
          set -euo pipefail
          docker build --file deploy/docker/Dockerfile --tag devmate-converged .
          docker run --rm --entrypoint node devmate-converged /opt/devmate/scripts/devmate-cli.mjs help

      - name: Archive validated source tree
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=obsidian-plugin/node_modules \
            --exclude=obsidian-plugin/dist \
            --exclude='*.vsix' \
            --exclude='*.tgz' \
            --exclude=.godot-ci \
            --exclude=tmp \
            -czf "$RUNNER_TEMP/devmate-converged-source.tar.gz" .

      - name: Upload validated source tree
        uses: actions/upload-artifact@v7
        with:
          name: devmate-converged-source
          path: ${{ runner.temp }}/devmate-converged-source.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Commit validated non-workflow tree
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD -- .github/workflows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "[architecture-refactor] Apply validated runtime core"
          git push origin HEAD:refactor/shared-tunnel-runtime
