name: One-time strict tunnel termination fix

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Patch termination semantics
        shell: bash
        run: |
          set -euo pipefail
          if git log -1 --pretty=%B | grep -Fq '[audit-fix-3]'; then
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing expected pattern in {path}: {old!r}')
              p.write_text(text.replace(old, new))

          replace(
              'host/runtime/process-controller.js',
              "function waitForChildExit(child, timeoutMs) {\n  if (!child || child.exitCode != null || child.signalCode != null) return Promise.resolve(true);\n  return Promise.race([\n    new Promise(resolve => child.once('exit', () => resolve(true))),\n    new Promise(resolve => setTimeout(() => resolve(false), Math.max(100, Number(timeoutMs) || CHILD_EXIT_TIMEOUT_MS)))\n  ]);\n}",
              "function waitForChildExit(child, timeoutMs, { signalCodeConfirmsExit = true } = {}) {\n  if (!child || child.exitCode != null || (signalCodeConfirmsExit && child.signalCode != null)) return Promise.resolve(true);\n  return Promise.race([\n    new Promise(resolve => child.once('exit', () => resolve(true))),\n    new Promise(resolve => child.once?.('close', () => resolve(true))),\n    new Promise(resolve => setTimeout(() => resolve(false), Math.max(100, Number(timeoutMs) || CHILD_EXIT_TIMEOUT_MS)))\n  ]);\n}"
          )
          replace(
              'host/runtime/process-controller.js',
              "async function terminateChild(child, {\n  timeoutMs = CHILD_EXIT_TIMEOUT_MS,\n  forceTimeoutMs = CHILD_FORCE_EXIT_TIMEOUT_MS\n} = {}) {\n  if (!child || child.exitCode != null) return { exited: true, forced: false };\n  try {\n    if (!child.killed && !child.terminating) child.kill();\n  } catch (error) {\n    return { exited: false, forced: false, error: error.message || String(error) };\n  }\n  if (await waitForChildExit(child, timeoutMs)) {\n    return { exited: true, forced: !!child.forceTerminated };\n  }\n  try {\n    if (typeof child.forceTerminate === 'function') child.forceTerminate();\n    else child.kill('SIGKILL');\n  } catch {}\n  const exited = await waitForChildExit(child, forceTimeoutMs);\n  return { exited, forced: true };\n}",
              "async function terminateChild(child, {\n  timeoutMs = CHILD_EXIT_TIMEOUT_MS,\n  forceTimeoutMs = CHILD_FORCE_EXIT_TIMEOUT_MS,\n  signalCodeConfirmsExit = true\n} = {}) {\n  if (!child || child.exitCode != null || (signalCodeConfirmsExit && child.signalCode != null)) return { exited: true, forced: false };\n  const gracefulExit = waitForChildExit(child, timeoutMs, { signalCodeConfirmsExit });\n  try {\n    if (!child.killed && !child.terminating) child.kill();\n  } catch (error) {\n    return { exited: false, forced: false, error: error.message || String(error) };\n  }\n  if (await gracefulExit) {\n    return { exited: true, forced: !!child.forceTerminated };\n  }\n  const forcedExit = waitForChildExit(child, forceTimeoutMs, { signalCodeConfirmsExit });\n  try {\n    if (typeof child.forceTerminate === 'function') child.forceTerminate();\n    else child.kill('SIGKILL');\n  } catch {}\n  const exited = await forcedExit;\n  return { exited, forced: true };\n}"
          )
          text = Path('vscode-host/tunnel-controller.js').read_text()
          old = "forceTimeoutMs: Math.min(1000, this.forceStopTimeoutMs)\n          });"
          new = "forceTimeoutMs: Math.min(1000, this.forceStopTimeoutMs),\n            signalCodeConfirmsExit: false\n          });"
          if old not in text:
              raise SystemExit('missing startup cleanup terminateChild call')
          text = text.replace(old, new, 1)
          old2 = "forceTimeoutMs: this.forceStopTimeoutMs\n    });"
          new2 = "forceTimeoutMs: this.forceStopTimeoutMs,\n      signalCodeConfirmsExit: false\n    });"
          if old2 not in text:
              raise SystemExit('missing local terminateChild call')
          Path('vscode-host/tunnel-controller.js').write_text(text.replace(old2, new2, 1))
          PY
          git diff --check

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          if git log -1 --pretty=%B | grep -Fq '[audit-fix-3]'; then
            exit 0
          fi
          git config user.name kukutx
          git config user.email 61358650+Kukutx@users.noreply.github.com
          git add host/runtime/process-controller.js vscode-host/tunnel-controller.js
          git commit -m 'Preserve strict tunnel exit confirmation [audit-fix-3]'
          git push origin HEAD:master
