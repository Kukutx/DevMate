name: Runtime hardening 3.3.9 once

on:
  push:
    branches:
      - runtime-hardening-339
    paths:
      - scripts/apply-runtime-hardening-339-once.mjs
      - .github/workflows/runtime-hardening-339-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Apply hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-runtime-hardening-339-once.mjs')
          text = p.read_text()
          before = '`    lifecycle = new VscodeHostLifecycle({ vscode });`'
          after = '`  lifecycle = new VscodeHostLifecycle({ vscode });`'
          if before not in text:
              raise SystemExit('shared-tunnel patch contract not found')
          p.write_text(text.replace(before, after, 1))
          PY
          node scripts/apply-runtime-hardening-339-once.mjs

      - name: Install
        run: npm ci

      - name: Repository contracts
        run: npm run check

      - name: Unit and policy tests
        run: npm run test:unit

      - name: Gateway smoke
        run: npm run smoke:gateway

      - name: Package VSIX
        run: npm run package:vsix

      - name: Packaged VSIX runtime smoke
        run: node scripts/smoke-vsix-runtime.mjs

      - name: Packaged shared-tunnel smoke
        run: node scripts/smoke-vsix-shared-tunnel.mjs

      - name: Commit validated hardening
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f ./*.vsix
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden runtime diagnostics and ngrok recovery"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:runtime-hardening-339
