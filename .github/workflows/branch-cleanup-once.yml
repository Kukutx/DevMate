name: One-time obsolete branch cleanup

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/branch-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Delete obsolete branches and verify master is the only branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            fix/deep-runtime-hardening \
            fix/final-deep-hardening \
            fix/mcp-git-runtime
          do
            gh api --method DELETE "repos/${REPO}/git/refs/heads/${branch}"
          done

          mapfile -t branches < <(gh api "repos/${REPO}/branches?per_page=100" --jq '.[].name' | sort)
          printf 'Remaining branches: %s\n' "${branches[*]}"
          [[ ${#branches[@]} -eq 1 && "${branches[0]}" == "master" ]]
