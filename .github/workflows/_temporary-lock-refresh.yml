name: Temporary dependency lock refresh

on:
  push:
    branches:
      - fix/dev-dependency-audit

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Refresh audited lockfile
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Verify complete dependency audit
        run: npm audit --audit-level=moderate
      - name: Verify package manifest unchanged
        run: git diff --exit-code -- package.json
      - name: Verify lockfile installs
        run: npm ci --ignore-scripts
      - name: Verify core repository contracts
        run: npm run version:check && node scripts/check-repository.mjs && node scripts/check-obsidian-release.mjs
      - name: Commit lockfile and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_temporary-lock-refresh.yml
          git add package-lock.json
          git diff --cached --check
          git commit -m "chore: refresh audited dev dependencies"
          git push origin HEAD:fix/dev-dependency-audit
