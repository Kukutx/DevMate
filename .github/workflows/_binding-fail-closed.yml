name: Conversation binding fail-closed follow-up

on:
  push:
    branches:
      - fix/conversation-binding-fail-closed

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/conversation-binding-fail-closed
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Apply final conversation binding hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('gateway/request-context.mjs')
          s = p.read_text()
          old = "const CONVERSATION_META_KEYS = Object.freeze([\n  'openai/conversationId', 'openai/conversation_id', 'openai/conversation',\n  'openai/threadId', 'openai/thread_id', 'openai/thread',\n  'openai/session', 'openai/widgetSessionId'\n]);"
          new = "const CONVERSATION_META_KEYS = Object.freeze([\n  'openai/session',\n  'openai/conversationId', 'openai/conversation_id', 'openai/conversation',\n  'openai/threadId', 'openai/thread_id', 'openai/thread'\n]);"
          if old not in s: raise SystemExit('missing conversation metadata key block')
          p.write_text(s.replace(old, new, 1))

          p = Path('gateway/team-capabilities.mjs')
          s = p.read_text()
          s = s.replace("import { audit, mutateConfig, readConfig, redactSensitiveString } from './local-shared.mjs';", "import { audit, readConfig, redactSensitiveString } from './local-shared.mjs';")
          s = s.replace("  bindConversationWorkspaceToWorkspace,\n  conversationWorkspace,\n  conversationWorkspaceBinding\n", "  conversationWorkspace\n")
          start = s.index('function persistExplicitConversationBinding')
          end = s.index('function conversationBindingRequired', start)
          s = s[:start] + s[end:]
          old = "  let binding = conversationWorkspace(current, scope);\n  if (!binding) {\n    if (!String(authorizationArgs.workspaceId || '').trim()) throw conversationBindingRequired(current);\n    const requested = resolveWorkspace(current, authorizationArgs.workspaceId);\n    persistExplicitConversationBinding(scope, requested);\n    current = normalizeInstanceConfig(readConfig());\n    binding = conversationWorkspace(current, scope);\n  }\n  if (!binding) throw conversationBindingRequired(current);"
          new = "  const binding = conversationWorkspace(current, scope);\n  if (!binding) throw conversationBindingRequired(current);"
          if old not in s: raise SystemExit('missing implicit binding block')
          s = s.replace(old, new, 1)
          s = s.replace('  persistExplicitConversationBinding,\n', '')
          p.write_text(s)

          p = Path('tests/conversation-workspace-isolation.test.mjs')
          s = p.read_text()
          s = s.replace("test('conversation metadata is stable and conversation identity outranks transport session identity', () => {", "test('documented ChatGPT session metadata is the canonical conversation identity', () => {")
          old = "  const preferred = conversationScopeFromToolContext({ mcpReq: { _meta: {\n    'openai/session': 'reconnect-transport-session',\n    'openai/conversationId': 'conversation-a'\n  } } });\n  assert.equal(a1, a2);\n  assert.equal(preferred, a2);"
          new = "  const preferred = conversationScopeFromToolContext({ mcpReq: { _meta: {\n    'openai/session': 'conversation-a',\n    'openai/conversationId': 'conflicting-compatibility-hint'\n  } } });\n  assert.equal(a1, a2);\n  assert.equal(preferred, a1);"
          if old not in s: raise SystemExit('missing metadata precedence test block')
          s = s.replace(old, new, 1)
          old = "  assert.doesNotMatch(source, /source:\\s*'auto'/);\n  assert.match(source, /processConversationScope/);"
          new = "  assert.doesNotMatch(source, /source:\\s*'auto'/);\n  assert.doesNotMatch(source, /persistExplicitConversationBinding/);\n  assert.match(source, /const binding = conversationWorkspace\\(current, scope\\);\\n  if \\(!binding\\) throw conversationBindingRequired\\(current\\);/);\n  assert.match(source, /processConversationScope/);"
          if old not in s: raise SystemExit('missing fail-closed static assertions')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('CHANGELOG.md')
          s = p.read_text()
          if '## 3.6.3' not in s:
              entry = "# Changelog\n\n## 3.6.3\n- Made ChatGPT project selection fail closed: every new conversation must deliberately bind a project before project-scoped tools can run, so an editor/vault default cannot be adopted implicitly.\n- Made the documented `openai/session` client metadata the canonical ChatGPT conversation identity while retaining compatibility fallbacks.\n- Strengthened regression coverage for reconnect identity and explicit path precedence.\n"
              p.write_text(s.replace('# Changelog\n', entry, 1))
          PY

          npm ci
          npm version 3.6.3 --no-git-tag-version
          npm run version:sync
          node --test tests/conversation-workspace-isolation.test.mjs tests/approval-execution-boundary.test.cjs
          git rm .github/workflows/_binding-fail-closed.yml
          npm run check
          npm run test:unit
          npm run smoke:gateway
          npm run package:vsix
      - name: Commit verified follow-up
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: require deliberate ChatGPT workspace binding"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:fix/conversation-binding-fail-closed
