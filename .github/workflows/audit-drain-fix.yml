name: One-time audit drain integration

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Integrate audit drain
        shell: pwsh
        run: |
          $serverPath = 'gateway/server-runtime.mjs'
          $server = Get-Content $serverPath -Raw
          $importNeedle = "import { shutdownCommandProcesses } from './command-process.mjs';"
          if (-not $server.Contains($importNeedle)) { throw 'server-runtime import anchor not found' }
          $server = $server.Replace($importNeedle, "$importNeedle`nimport { drainAllAuditLogs } from './audit-log-coordinator.mjs';")
          $shutdownNeedle = "    try { await Promise.all([...createdHttpServers].map(server => closeHttpServer(server))); } catch {}"
          if (-not $server.Contains($shutdownNeedle)) { throw 'server-runtime shutdown anchor not found' }
          $server = $server.Replace($shutdownNeedle, "$shutdownNeedle`n    try { await drainAllAuditLogs(); } catch {}")
          Set-Content -Path $serverPath -Value $server -NoNewline

          $testPath = 'tests/runner-control-plane.test.mjs'
          $test = Get-Content $testPath -Raw
          $testImportNeedle = "const { registerJobTarget } = await import('../gateway/job-runtime.mjs');"
          if (-not $test.Contains($testImportNeedle)) { throw 'runner control test import anchor not found' }
          $test = $test.Replace($testImportNeedle, "$testImportNeedle`nconst { drainAllAuditLogs } = await import('../gateway/audit-log-coordinator.mjs');")
          $closeNeedle = '  await new Promise(resolve => server.close(resolve));'
          if (-not $test.Contains($closeNeedle)) { throw 'runner control test close anchor not found' }
          $test = $test.Replace($closeNeedle, "$closeNeedle`n  await drainAllAuditLogs();")
          Set-Content -Path $testPath -Value $test -NoNewline

      - name: Commit fix
        shell: pwsh
        run: |
          git config user.name "kukutx"
          git config user.email "61358650+Kukutx@users.noreply.github.com"
          git add gateway/server-runtime.mjs tests/runner-control-plane.test.mjs
          if (-not (git diff --cached --quiet)) {
            git commit -m "Drain audit mutations during shutdown"
            git push origin master
          }
