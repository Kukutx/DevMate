name: Apply Host Operation Hardening

on:
  push:
    branches:
      - refactor/runtime-concurrency-hardening
    paths:
      - scripts/apply-host-operation-hardening.mjs
      - .github/workflows/apply-host-operation-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/runtime-concurrency-hardening
          fetch-depth: 0

      - name: Apply asserted patch
        run: node scripts/apply-host-operation-hardening.mjs

      - name: Remove temporary migration files
        run: rm scripts/apply-host-operation-hardening.mjs .github/workflows/apply-host-operation-hardening.yml

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add host/runtime/config-store.js gateway/durable-state.mjs gateway/server-runtime.mjs obsidian-plugin/src/main.js scripts/apply-host-operation-hardening.mjs .github/workflows/apply-host-operation-hardening.yml
          git commit -m "Serialize Obsidian host operations and protect config recovery"
          git push origin HEAD:refactor/runtime-concurrency-hardening
