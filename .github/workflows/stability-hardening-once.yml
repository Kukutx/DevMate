name: One-time stability hardening

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  harden:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Repair one-time script literals
        shell: pwsh
        run: |
          $path = 'scripts/apply-stability-hardening.mjs'
          $lines = Get-Content $path
          $lines = $lines | ForEach-Object {
            if ($_ -like '*new RegExp(entry.replace*') {
              "  for (const entry of ['docs/**', 'deploy/**', 'AGENTS.md', 'CONTRIBUTING.md']) assert.equal(ignore.includes(entry), true);"
            } else {
              $_
            }
          }
          Set-Content -Path $path -Value $lines -Encoding utf8
          $script = Get-Content $path -Raw
          $script = $script.Replace("DEVMATE_DISABLE_JOB_RUNTIME !== '1' && readConfig().jobs?.embeddedRunnerEnabled !== false", "DEVMATE_DISABLE_EMBEDDED_RUNNER !== '1' && readConfig().jobs?.embeddedRunnerEnabled !== false")
          Set-Content -Path $path -Value $script -Encoding utf8
          node --check $path

      - name: Apply hardening
        id: apply
        continue-on-error: true
        shell: pwsh
        run: |
          node scripts/apply-stability-hardening.mjs *> hardening-diagnostics.txt
          $code = $LASTEXITCODE
          Get-Content hardening-diagnostics.txt
          exit $code

      - name: Persist failure diagnostics
        if: steps.apply.outcome == 'failure'
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hardening-diagnostics.txt
          git commit -m 'Capture stability hardening failure'
          git push origin HEAD:master

      - name: Stop after apply failure
        if: steps.apply.outcome == 'failure'
        shell: pwsh
        run: throw 'One-time hardening script failed; diagnostics were persisted.'

      - name: Install dependencies
        if: steps.apply.outcome == 'success'
        shell: pwsh
        run: npm ci

      - name: Repository checks
        if: steps.apply.outcome == 'success'
        shell: pwsh
        run: npm run check

      - name: Unit tests
        if: steps.apply.outcome == 'success'
        shell: pwsh
        run: npm run test:unit

      - name: Gateway smoke tests
        if: steps.apply.outcome == 'success'
        shell: pwsh
        run: npm run smoke:gateway

      - name: Package VSIX
        if: steps.apply.outcome == 'success'
        shell: pwsh
        run: npm run package:vsix

      - name: Remove one-time machinery
        if: steps.apply.outcome == 'success'
        shell: pwsh
        run: |
          Remove-Item 'scripts/apply-stability-hardening.mjs' -Force
          Remove-Item '.github/workflows/stability-hardening-once.yml' -Force
          if (Test-Path 'hardening-diagnostics.txt') { Remove-Item 'hardening-diagnostics.txt' -Force }

      - name: Commit verified hardening
        if: steps.apply.outcome == 'success'
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --exit-code && throw 'Hardening produced no changes.'
          git commit -m 'Harden DevMate runtime stability'
          git push origin HEAD:master
