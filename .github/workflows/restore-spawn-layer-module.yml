name: Restore Spawn Layer Module

on:
  push:
    branches:
      - refactor/runtime-concurrency-hardening
    paths:
      - .github/workflows/restore-spawn-layer-module.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/runtime-concurrency-hardening
          fetch-depth: 0
      - name: Restore module and remove workflow
        shell: bash
        run: |
          mkdir -p vscode-host
          printf '%s' '' | base64 -d > vscode-host/spawn-layer.js
          rm .github/workflows/restore-spawn-layer-module.yml
          node --check vscode-host/spawn-layer.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Kukutx@users.noreply.github.com"
          git add vscode-host/spawn-layer.js .github/workflows/restore-spawn-layer-module.yml
          git commit -m "Restore ordered VS Code spawn layer module"
          git push origin HEAD:refactor/runtime-concurrency-hardening
