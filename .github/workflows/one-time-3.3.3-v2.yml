name: One-time DevMate 3.3.3 hardening v2

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  harden:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Repair staging script
        run: node scripts/fix-one-time-3.3.3.mjs

      - name: Syntax-check staging script
        run: node --check scripts/one-time-3.3.3.mjs

      - name: Apply focused hardening
        run: node scripts/one-time-3.3.3.mjs

      - name: Synchronize 3.3.3 version
        shell: pwsh
        run: |
          npm version 3.3.3 --no-git-tag-version
          npm run version:sync

      - name: Remove one-time machinery before validation
        shell: pwsh
        run: |
          Remove-Item scripts/one-time-3.3.3.mjs -Force
          Remove-Item scripts/fix-one-time-3.3.3.mjs -Force
          Remove-Item .github/workflows/one-time-3.3.3.yml -Force
          Remove-Item .github/workflows/one-time-3.3.3-v2.yml -Force

      - name: Repository contracts
        run: npm run check

      - name: Full unit and policy suite
        run: npm run test:unit

      - name: Gateway smoke
        run: npm run smoke:gateway

      - name: Package VSIX
        run: npm run package:vsix

      - name: Packaged VSIX runtime smoke
        run: node scripts/smoke-vsix-runtime.mjs

      - name: Packaged VSIX shared tunnel smoke
        run: node scripts/smoke-vsix-shared-tunnel.mjs

      - name: Build Obsidian
        run: npm run build:obsidian

      - name: Obsidian runtime smoke
        run: node scripts/smoke-obsidian-runtime.mjs

      - name: Commit verified DevMate 3.3.3
        shell: pwsh
        run: |
          Remove-Item *.vsix -Force -ErrorAction SilentlyContinue
          git config user.name "kukutx"
          git config user.email "61358650+Kukutx@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Release DevMate 3.3.3 ngrok reuse hardening"
          git push origin HEAD:master
