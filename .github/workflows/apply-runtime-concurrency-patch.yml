name: Apply Runtime Concurrency Patch

on:
  push:
    branches:
      - refactor/runtime-concurrency-hardening
    paths:
      - scripts/apply-runtime-concurrency-patch.mjs
      - .github/workflows/apply-runtime-concurrency-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/runtime-concurrency-hardening
          fetch-depth: 0

      - name: Apply asserted patch
        run: node scripts/apply-runtime-concurrency-patch.mjs

      - name: Remove temporary migration files
        run: rm scripts/apply-runtime-concurrency-patch.mjs .github/workflows/apply-runtime-concurrency-patch.yml

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension.js host/runtime/process-controller.js scripts/apply-runtime-concurrency-patch.mjs .github/workflows/apply-runtime-concurrency-patch.yml
          git commit -m "Serialize VS Code lifecycle operations"
          git push origin HEAD:refactor/runtime-concurrency-hardening
