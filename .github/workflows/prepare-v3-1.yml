name: Prepare DevMate 3.1.0

on:
  push:
    branches:
      - refactor/vscode-host-hardening
    paths:
      - scripts/prepare-v3-1.mjs
      - .github/workflows/prepare-v3-1.yml

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/vscode-host-hardening
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare release metadata
        run: |
          node scripts/prepare-v3-1.mjs
          node scripts/sync-version.mjs
          node scripts/sync-version.mjs --check

      - name: Remove one-time release preparation
        run: |
          rm scripts/prepare-v3-1.mjs
          rm .github/workflows/prepare-v3-1.yml

      - name: Commit synchronized release metadata
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Prepare DevMate 3.1.0"
          git push origin HEAD:refactor/vscode-host-hardening
