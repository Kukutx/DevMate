name: Commit no-auth contract repair

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/no-auth-contract-commit.yml

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reapply validated migration script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/no-auth-contract-repair.yml').read_text().splitlines()
          start=next(i for i,l in enumerate(src) if l.strip()=='- name: Patch contracts docs and regression tests')
          run=next(i for i in range(start+1,len(src)) if src[i].strip()=='run: |')
          end=next(i for i in range(run+1,len(src)) if src[i].startswith('      - name: Install'))
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in src[run+1:end])+'\n'
          Path('/tmp/no-auth-contract-repair.py').write_text(code)
          PY
          python /tmp/no-auth-contract-repair.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/check-repository.mjs README.md SECURITY.md docs/AUTHENTICATION.md docs/BOOTSTRAP.md docs/STANDALONE.md docs/TUNNELS.md obsidian-plugin/README.md tests/devmate-command.test.mjs tests/public-tunnel-verifier.test.cjs tests/standalone-ingress-config.test.mjs
          git commit -m "Align contracts with default public no-auth"
          git push origin HEAD:master
