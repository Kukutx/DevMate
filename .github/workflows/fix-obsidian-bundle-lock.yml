name: Fix Obsidian Gateway lock bundle

on:
  push:
    branches:
      - fix/obsidian-worker-runtime
    paths:
      - .github/workflows/fix-obsidian-bundle-lock.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/obsidian-worker-runtime
          fetch-depth: 0

      - name: Replace dynamic lock require with static import
        shell: python
        run: |
          from pathlib import Path
          file = Path('gateway/local-shared.mjs')
          text = file.read_text(encoding='utf-8')
          old = "import { createRequire } from 'node:module';\n\nconst require = createRequire(import.meta.url);\nconst { withFileLockSync } = require('../config-file-lock.cjs');"
          new = "import lockModule from '../config-file-lock.cjs';\n\nconst { withFileLockSync } = lockModule;"
          if old not in text:
              raise SystemExit('Dynamic config lock import was not found')
          file.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Commit bundle fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/fix-obsidian-bundle-lock.yml
          git add gateway/local-shared.mjs
          git commit -m "Bundle config locking into the Obsidian Gateway"
          git push origin HEAD:fix/obsidian-worker-runtime
