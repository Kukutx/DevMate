name: No-auth contract repair

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/no-auth-contract-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Run no-auth contract repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch contracts docs and regression tests
        shell: python
        run: |
          from pathlib import Path
          import re

          def rep(path, old, new, minimum=1):
              p=Path(path); s=p.read_text(); n=s.count(old)
              if n < minimum: raise SystemExit(f'{path}: missing {old[:80]!r} ({n})')
              p.write_text(s.replace(old,new)); print(path, 'replace', n)

          # Permanent architecture contract: default/public no-auth, optional OAuth.
          p=Path('scripts/check-repository.mjs'); s=p.read_text()
          remove_labels = [
            'Team bootstrap must use OAuth by construction',
            'Control-plane bootstrap must use OAuth by construction',
            'member-enabled bootstrap must reject no-auth',
            'standalone public URL must reject loopback-only no-auth',
            'standalone member creation must promote the instance to OAuth',
            'standalone member identity changes must initialize private OAuth state',
            'README must document OAuth-default desktop public MCP',
            'security policy must require OAuth on remote MCP',
            'authentication policy must define no-auth as loopback-only',
            'bootstrap docs must encode shared OAuth defaults',
            'standalone docs must reject public no-auth',
            'Obsidian docs must describe the current OAuth MCP 2026 lifecycle'
          ]
          s='\n'.join(line for line in s.splitlines() if not any(label in line for label in remove_labels))+'\n'
          s=s.replace("  { pattern: /Public MCP uses no authentication by default|normal desktop MCP flow is no-auth|normal desktop flow uses no authentication/i, label: 'retired unauthenticated public MCP guidance' },\n",'')
          anchor="  ['shared/auth-config.cjs', /AUTHENTICATION_MODES = Object\\.freeze\\(\\['none', 'oauth'\\]\\)/, 'authentication config must remain mode-only and OAuth-capable'],\n"
          if anchor not in s: raise SystemExit('required auth-config anchor missing')
          addition = anchor + "  ['shared/auth-config.cjs', /const mode = value === undefined \\? 'none'/, 'authentication must default to none'],\n  ['gateway/request-guard.mjs', /isLocalRequest\\(req\\) \\|\\| config\\.auth\\?\\.mode === 'none'/, 'public no-auth MCP must map to owner access'],\n  ['shared/oauth-tokens.cjs', /if \\(config\\?\\.auth\\?\\.mode !== 'oauth'\\) return '';/, 'public preflight must support no-auth without a token'],\n  ['scripts/devmate-command.mjs', /team:\\s*Object\\.freeze\\(\\{[\\s\\S]*?'authentication-mode': 'none'/, 'Team bootstrap must default to no-auth'],\n  ['scripts/devmate-command.mjs', /'control-plane':\\s*Object\\.freeze\\(\\{[\\s\\S]*?'authentication-mode': 'none'/, 'Control-plane bootstrap must default to no-auth'],\n"
          s=s.replace(anchor,addition)
          doc_anchor="  ['README.md', /server\\/discover[\\s\\S]*2026-07-28|2026-07-28[\\s\\S]*server\\/discover/, 'README must document MCP 2026 discovery'],\n"
          if doc_anchor not in s: raise SystemExit('documentation anchor missing')
          doc_add = doc_anchor + "  ['README.md', /Desktop public MCP defaults to no authentication; OAuth is optional\\./, 'README must document no-auth default'],\n  ['SECURITY.md', /Public MCP defaults to no authentication; OAuth is optional\\./, 'security policy must document optional OAuth'],\n  ['docs/AUTHENTICATION.md', /`auth\\.mode: \\\"none\\\"` accepts both loopback and public MCP without an access token\\./, 'authentication policy must define public no-auth'],\n  ['docs/BOOTSTRAP.md', /All presets default to `none` unless OAuth is explicitly selected\\./, 'bootstrap docs must encode no-auth defaults'],\n  ['docs/STANDALONE.md', /Public HTTPS ingress works with the default `none` mode; OAuth is optional\\./, 'standalone docs must support public no-auth'],\n  ['obsidian-plugin/README.md', /Public MCP defaults to no authentication; OAuth is optional\\./, 'Obsidian docs must describe no-auth default'],\n"
          s=s.replace(doc_anchor,doc_add)
          p.write_text(s)

          # README
          rep('README.md', 'Personal and Runner presets use `auth.mode: "none"`, which is **loopback-only**. Team and Control-plane presets use OAuth. Any bootstrap that creates a member also requires OAuth.', 'All presets default to `auth.mode: "none"`. No-auth is valid for both local and public MCP. OAuth remains available only when explicitly selected.')
          rep('README.md', '4. Add that URL to ChatGPT and use **OAuth**. Desktop public MCP defaults to OAuth.', '4. Add that URL to ChatGPT and select **No authentication**. Desktop public MCP defaults to no authentication; OAuth is optional.')
          rep('README.md', 'Routine Start never requires a separate tunnel-start or verification command. `auth.mode: "none"` is retained only for loopback-only MCP and is rejected for remote ingress. Public MCP never accepts copied owner/member Bearer tokens or credentials in URLs.', 'Routine Start never requires a separate tunnel-start or verification command. `auth.mode: "none"` works on both loopback and public ingress. OAuth can be enabled explicitly when wanted. Public MCP never accepts credentials in URLs.')
          rep('README.md', 'Obsidian has the same complete Start semantics as VS Code: bridge/context → shared Gateway → shared provider-native public connection → OAuth-authenticated MCP 2026 preflight → Ready.', 'Obsidian has the same complete Start semantics as VS Code: bridge/context → shared Gateway → shared provider-native public connection → MCP 2026 preflight using the selected authentication mode → Ready.')
          rep('README.md', '| Personal | Loopback-only, no auth |', '| Personal | No auth by default |')
          rep('README.md', '| Team | OAuth members |', '| Team | No auth by default; optional OAuth members |')
          rep('README.md', '| Control-plane | OAuth members |', '| Control-plane | No auth by default; optional OAuth members |')
          rep('README.md', '| Runner host | Loopback-only local MCP + `dmr_` central credential |', '| Runner host | No-auth local MCP + `dmr_` central credential |')
          rep('README.md', 'ChatGPT / OAuth members\n        │ HTTPS MCP 2026 + OAuth access token', 'ChatGPT / optional OAuth members\n        │ HTTPS MCP 2026 (no-auth default; OAuth optional)')
          rep('README.md', '- `auth.mode: "none"` trusts only a genuine loopback socket + loopback Host; it is not a remote/public authentication mode.\n- Public MCP uses OAuth Bearer access tokens only. OAuth signing material and owner approval codes live in private state, not `config.json`.', '- `auth.mode: "none"` is the default for both local and public MCP and grants owner-level access to the configured endpoint.\n- OAuth is optional. When enabled, OAuth signing material and owner approval codes live in private state, not `config.json`.')

          # Security
          rep('SECURITY.md', '- `auth.mode: "none"` is **loopback-only**. It requires both a loopback socket peer and a loopback Host and is never valid public authentication.\n- Every remote/public `/mcp` request requires OAuth.', '- `auth.mode: "none"` is valid for both loopback and public MCP and grants owner-level access without an access token.\n- Public MCP defaults to no authentication; OAuth is optional.')
          rep('SECURITY.md', '- Desktop public MCP defaults to OAuth.\n- Public MCP accepts OAuth access tokens only; it never accepts copied static owner/member credentials.', '- Desktop public MCP defaults to no authentication. OAuth is optional and only used when explicitly enabled.\n- When OAuth is enabled, MCP accepts OAuth access tokens; copied static owner/member credentials remain unsupported.')
          rep('SECURITY.md', 'after OAuth-authenticated MCP `server/discover`, `tools/list`, and `gateway_status` succeed.', 'after MCP `server/discover`, `tools/list`, and `gateway_status` succeed using the configured authentication mode.')

          # Authentication doc
          rep('docs/AUTHENTICATION.md', 'DevMate uses one current authentication model for MCP 2026. Local operating-system trust and remote OAuth are separate boundaries; there is no static MCP credential mode.', 'DevMate supports two current MCP 2026 authentication modes: `none` by default, and optional OAuth. There is no static MCP credential mode.')
          old = '''- Requests arriving from a verified loopback socket with a loopback Host are the local owner and do not need OAuth.\n- Any non-loopback `/mcp` request requires `auth.mode: "oauth"` and a valid OAuth access token.\n- `auth.mode: "none"` means **loopback-only MCP**. It never means unauthenticated public MCP.\n- OAuth is the default for VS Code and Obsidian desktop public access, Team bootstrap, Control-plane bootstrap, any bootstrap that creates a member, and standalone initialization with an explicit public URL.\n- Personal/Runner standalone presets remain loopback-only unless OAuth is deliberately enabled.\n- OAuth access tokens use the standard `Authorization: Bearer <access-token>` header. DevMate does not expose a user-configured static MCP Bearer credential.'''
          new = '''- `auth.mode: "none"` accepts both loopback and public MCP without an access token. It is the default.\n- No-auth requests receive owner-level DevMate access; Host allowlisting and ingress configuration remain independent controls.\n- `auth.mode: "oauth"` is optional and must be selected explicitly.\n- When OAuth is enabled, access tokens use the standard `Authorization: Bearer <access-token>` header. DevMate does not expose a user-configured static MCP Bearer credential.'''
          rep('docs/AUTHENTICATION.md',old,new)
          rep('docs/AUTHENTICATION.md', 'Standalone `member-create` and `member-rotate` ensure OAuth mode and private OAuth state rather than allowing an active member to coexist with loopback-only authentication.', 'Standalone `member-create` and `member-rotate` do not change the selected authentication mode. Member OAuth login codes become relevant only when OAuth is explicitly enabled.')
          rep('docs/AUTHENTICATION.md', '- Remote MCP never falls back to local-owner access.\n- Public URL configuration cannot be combined with loopback-only `none` in standalone initialization.', '- No-auth public MCP intentionally maps to owner-level access.\n- Public URL configuration is valid with the default `none` mode or with optional OAuth.')

          # Bootstrap
          rep('docs/BOOTSTRAP.md', '| `personal` | `none` — loopback-only |', '| `personal` | `none` — default |')
          rep('docs/BOOTSTRAP.md', '| `team` | OAuth |', '| `team` | `none` — default; OAuth optional |')
          rep('docs/BOOTSTRAP.md', '| `control-plane` | OAuth |', '| `control-plane` | `none` — default; OAuth optional |')
          rep('docs/BOOTSTRAP.md', '| `runner` | `none` — local loopback MCP |', '| `runner` | `none` — default |')
          rep('docs/BOOTSTRAP.md', '`auth.mode: "none"` is not a public authentication mode. It accepts MCP only from a genuine loopback socket with a loopback Host. Team and Control-plane presets therefore use OAuth by construction.', 'All presets default to `none` unless OAuth is explicitly selected. `auth.mode: "none"` works on both loopback and public MCP.')
          rep('docs/BOOTSTRAP.md', 'This creates one local owner instance. Its MCP endpoint is usable without authentication only over loopback.', 'This creates one owner instance. Its MCP endpoint is usable without authentication over loopback or configured public ingress.')
          rep('docs/BOOTSTRAP.md', 'The preset enables OAuth and workspace-lease enforcement by default.', 'The preset keeps no-auth as the default and enables workspace-lease enforcement by default. OAuth may be enabled explicitly.')
          rep('docs/BOOTSTRAP.md', 'Creating a member without a preset also makes OAuth mandatory. If `--member-name` is supplied with `--authentication-mode none`, bootstrap fails instead of producing a member record that cannot authenticate remotely.', 'Creating a member does not change the selected authentication mode. The returned `dmc_` login code is used only if OAuth is explicitly enabled.')
          rep('docs/BOOTSTRAP.md', '- OAuth MCP authentication;', '- no-auth MCP by default; OAuth optional;')
          rep('docs/BOOTSTRAP.md', 'Authentication invariants still apply: a member-enabled bootstrap cannot be downgraded to `none`.', 'Authentication remains independent: member records may coexist with `none`, and OAuth is enabled only when explicitly selected.')
          rep('docs/BOOTSTRAP.md', 'It also reports an invalid state if active members exist while authentication is not OAuth.', 'Active member records do not make no-auth mode invalid; they are used for member identity only when OAuth is enabled.')

          # Standalone
          rep('docs/STANDALONE.md', 'Local loopback-only instance:', 'Default no-auth instance:')
          rep('docs/STANDALONE.md', 'A configuration without an explicit public URL defaults to `auth.mode: "none"`. This means **loopback-only MCP**.', 'A configuration defaults to `auth.mode: "none"`. This works for loopback and configured public MCP.')
          rep('docs/STANDALONE.md', 'Supplying a public URL defaults authentication to OAuth and creates protected OAuth secret state. `--authentication-mode none` with `--public-url` is rejected rather than producing a remotely unusable or insecure configuration.', 'Public HTTPS ingress works with the default `none` mode; OAuth is optional. Use `--authentication-mode oauth` only when OAuth is explicitly wanted.')
          rep('docs/STANDALONE.md', '`member-create` returns a one-time `dmc_` OAuth login code and ensures the instance uses OAuth, even if it began as a loopback-only local instance. Only the salted verifier and member `authVersion` are persisted.', '`member-create` returns a one-time `dmc_` OAuth login code without changing the selected authentication mode. Only the salted verifier and member `authVersion` are persisted.')
          rep('docs/STANDALONE.md', '`member-rotate` rotates the OAuth login code, increments `authVersion`, and therefore invalidates previously issued member OAuth credentials. It also ensures OAuth/private OAuth state exists. There is no member static Bearer-token mode.', '`member-rotate` rotates the OAuth login code and increments `authVersion`; it does not enable OAuth automatically. There is no member static Bearer-token mode.')
          rep('docs/STANDALONE.md', 'Every remote `/mcp` request still requires OAuth regardless of the ingress provider.', 'Remote `/mcp` uses the selected authentication mode: no-auth by default, or OAuth when explicitly enabled.')
          rep('docs/STANDALONE.md', '`doctor` validates current config/workspace state, OAuth private-state availability when required, member/auth consistency, public URL/auth consistency, and provider prerequisites relevant to the selected connection capability.', '`doctor` validates current config/workspace state, OAuth private-state availability when OAuth is enabled, public URL configuration, and provider prerequisites relevant to the selected connection capability.')
          rep('docs/STANDALONE.md', '# Owner-only local development: loopback-only', '# Owner development: no-auth by default')
          rep('docs/STANDALONE.md', '# Trusted member access: OAuth + lease enforcement by default', '# Trusted team preset: no-auth by default; OAuth can be selected explicitly')
          rep('docs/STANDALONE.md', '# Hardened central instance: OAuth + external Runner control', '# Central instance: no-auth by default + external Runner control')

          # Tunnels
          rep('docs/TUNNELS.md', 'A public connection does not weaken MCP authentication. Remote `/mcp` requests require OAuth. `auth.mode: "none"` is accepted only from a genuine loopback socket with a loopback Host and therefore cannot be used through ngrok, Cloudflare or external HTTPS ingress.\n\nDesktop hosts default to OAuth. Standalone Personal/Runner configurations may use `none` when their MCP endpoint remains local.', 'A public connection uses the selected MCP authentication mode. `auth.mode: "none"` is the default and works through ngrok, Cloudflare, or external HTTPS ingress. OAuth is optional and enabled explicitly.\n\nDesktop and standalone hosts default to no authentication.')
          rep('docs/TUNNELS.md', '  → obtain short-lived OAuth verification token', '  → obtain a verification token only when OAuth is enabled')
          rep('docs/TUNNELS.md', '1. Attach a short-lived OAuth owner access token generated from private state.', '1. Use no token in default `none` mode, or a short-lived owner access token when OAuth is enabled.')
          rep('docs/TUNNELS.md', 'a fresh OAuth MCP 2026 preflight', 'a fresh MCP 2026 preflight')
          rep('docs/TUNNELS.md', 'still requires current OAuth MCP preflight before Ready.', 'still requires current MCP preflight using the selected authentication mode before Ready.')

          # Obsidian
          rep('obsidian-plugin/README.md', '  → OAuth-authenticated MCP server/discover verified', '  → MCP server/discover verified with the selected authentication mode')
          rep('obsidian-plugin/README.md', '5. Obtain a short-lived OAuth owner access token from protected DevMate state for host verification.', '5. Use no token in default no-auth mode, or obtain a short-lived owner access token when OAuth is enabled.')
          old='''Desktop public MCP defaults to OAuth.\n\n- `auth.mode: "oauth"` is the public/remote MCP mode.\n- `auth.mode: "none"` is loopback-only and cannot authorize a request arriving through ngrok, Cloudflare, or external HTTPS ingress.'''
          new='''Public MCP defaults to no authentication; OAuth is optional.\n\n- `auth.mode: "none"` is the default for local and public MCP.\n- `auth.mode: "oauth"` is available when explicitly enabled.'''
          rep('obsidian-plugin/README.md',old,new)
          rep('obsidian-plugin/README.md', 'requires OAuth-authenticated MCP 2026 verification before Ready.', 'requires MCP 2026 verification using the selected authentication mode before Ready.')
          rep('obsidian-plugin/README.md', '**DevMate: Start** — complete Gateway → public connection → OAuth MCP 2026 verification → Ready lifecycle.', '**DevMate: Start** — complete Gateway → public connection → MCP 2026 verification using the selected authentication mode → Ready lifecycle.')
          rep('obsidian-plugin/README.md', '**Authentication mode** — OAuth is the secure desktop default; `none` is loopback-only', '**Authentication mode** — `none` is the default for local/public MCP; OAuth is optional')
          rep('obsidian-plugin/README.md', '- Public MCP requires OAuth; loopback-only no-auth never becomes public trust.', '- Public MCP defaults to no authentication; OAuth is optional.')

          # Core regression tests.
          p=Path('tests/devmate-command.test.mjs'); s=p.read_text()
          s=s.replace("test('creating a member makes OAuth mandatory and persists only the login-code verifier'", "test('creating a member preserves default no-auth and persists only the login-code verifier'")
          s=s.replace("assert.equal(result.authenticationMode, 'oauth');", "assert.equal(result.authenticationMode, 'none');")
          s=s.replace("assert.deepEqual(config.auth, { mode: 'oauth' });", "assert.deepEqual(config.auth, { mode: 'none' });")
          s=s.replace("assert.equal(await exists(path.join(current.root, 'state', 'oauth-secrets.json')), true);", "assert.equal(await exists(path.join(current.root, 'state', 'oauth-secrets.json')), false);")
          s=re.sub(r"test\('member bootstrap cannot be combined with no-auth'[\s\S]*?\n\}\);\n\n", """test('member bootstrap works with the default no-auth mode', async t => {\n  const current = await fixture('member-no-auth');\n  t.after(() => fsp.rm(current.root, { recursive: true, force: true }));\n  const result = __test.bootstrap({ workspace: current.workspace, config: current.config, 'member-name': 'Alice' });\n  assert.equal(result.authenticationMode, 'none');\n  assert.match(result.member.loginCode, /^dmc_/);\n  assert.deepEqual((await readConfig(current.config)).auth, { mode: 'none' });\n});\n\n""", s, count=1)
          s=s.replace("assert.equal(teamResult.authenticationMode, 'oauth');", "assert.equal(teamResult.authenticationMode, 'none');")
          s=s.replace("assert.equal(controlResult.authenticationMode, 'oauth');", "assert.equal(controlResult.authenticationMode, 'none');")
          s=s.replace("assert.equal(await exists(path.join(team.root, 'state', 'oauth-secrets.json')), true);", "assert.equal(await exists(path.join(team.root, 'state', 'oauth-secrets.json')), false);")
          s=s.replace("assert.equal(await exists(path.join(control.root, 'state', 'oauth-secrets.json')), true);", "assert.equal(await exists(path.join(control.root, 'state', 'oauth-secrets.json')), false);")
          p.write_text(s)

          p=Path('tests/public-tunnel-verifier.test.cjs'); s=p.read_text()
          pattern=r"test\('public recovery refuses to preflight when OAuth is disabled'[\s\S]*?\n\}\);\s*$"
          replacement="""test('public recovery preflights no-auth mode without a token', async () => {\n  const fx = fixture();\n  try {\n    const config = readJson(fx.configFile, null, { strict: true, supportedVersion: true });\n    config.auth = { mode: 'none' };\n    atomicWriteJson(fx.configFile, config);\n    let call = null;\n    const verifier = new PublicTunnelVerifier({\n      stateDirectory: fx.stateDirectory,\n      tunnelStatus: port => fx.status(port),\n      readyGraceMs: 0,\n      now: () => Date.parse('2026-08-08T01:01:00.000Z'),\n      preflight: async input => { call = input; return successfulTest(input.publicUrl); }\n    });\n    const result = await verifier.check();\n    assert.equal(result.verified, true);\n    assert.equal(call.token, '');\n  } finally {\n    fx.cleanup();\n  }\n});\n"""
          s,n=re.subn(pattern,replacement,s,count=1)
          if n!=1: raise SystemExit(f'public verifier old oauth-only test matches={n}')
          p.write_text(s)

          p=Path('tests/standalone-ingress-config.test.mjs'); s=p.read_text()
          needle="    assert.equal(result.config.connection.publicUrl, 'https://standalone.example.test');\n"
          if needle not in s: raise SystemExit('standalone ingress assertion anchor missing')
          s=s.replace(needle, needle+"    assert.deepEqual(result.config.auth, { mode: 'none' });\n",1)
          p.write_text(s)
      - name: Install
        run: npm ci
      - name: Check architecture contracts
        run: npm run check
      - name: Commit contract repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/check-repository.mjs README.md SECURITY.md docs/AUTHENTICATION.md docs/BOOTSTRAP.md docs/STANDALONE.md docs/TUNNELS.md obsidian-plugin/README.md tests/devmate-command.test.mjs tests/public-tunnel-verifier.test.cjs tests/standalone-ingress-config.test.mjs
          git commit -m "Align contracts with default public no-auth"
          git push origin HEAD:master
