name: Release Version Sync

on:
  push:
    branches:
      - release/3.6.6

permissions:
  contents: write

jobs:
  sync:
    name: Generate 3.6.6 metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Generate synchronized release metadata
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const packageFile = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(packageFile, 'utf8'));
          pkg.version = '3.6.6';
          fs.writeFileSync(packageFile, `${JSON.stringify(pkg, null, 2)}\n`);

          const changelogFile = 'CHANGELOG.md';
          let changelog = fs.readFileSync(changelogFile, 'utf8');
          if (!/^## 3\.6\.6$/m.test(changelog)) {
            const section = [
              '## 3.6.6',
              '- Hardened authoritative VS Code shared-config reads so Windows atomic replacement can no longer surface a healthy config as missing.',
              '- Kept one machine-wide desktop state authority across empty windows and project switches, while preserving existing shared sessions and explicit overrides.',
              '- Reduced focus-driven shared-state churn by deduplicating timestamp-only editor context updates without losing real active-host handoffs.',
              '- Added deterministic regression coverage for config replacement races, empty-window lifecycle behavior, existing-session attachment, and project handoff safety.',
              ''
            ].join('\n');
            changelog = changelog.replace(/^# Changelog\r?\n\r?\n/, match => `${match}${section}\n`);
            fs.writeFileSync(changelogFile, changelog, 'utf8');
          }
          NODE
          node scripts/sync-version.mjs

      - name: Commit synchronized version files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json CHANGELOG.md \
            obsidian-plugin/manifest.json obsidian-plugin/package.json obsidian-plugin/versions.json
          if git diff --cached --quiet; then
            echo 'Release metadata is already synchronized.'
            exit 0
          fi
          git commit -m 'chore: release DevMate 3.6.6'
          git push origin HEAD:release/3.6.6
