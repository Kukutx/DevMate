name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  checks: read
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tagged commit is merged to master
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin master:refs/remotes/origin/master
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/master || {
            echo "Tagged commit $GITHUB_SHA is not contained in master" >&2
            exit 1
          }

      - name: Verify required CI checks passed for tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          checks=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100")
          for required in \
            "Windows, VS Code 1.133, Node 24 LTS" \
            "Node 26 Current compatibility" \
            "Linux and Real Godot 4.7.1"; do
            conclusion=$(printf '%s' "$checks" | jq -r --arg name "$required" '[.check_runs[] | select(.name == $name and .status == "completed")] | sort_by(.completed_at) | last | .conclusion // ""')
            if [ "$conclusion" != "success" ]; then
              echo "Required CI check '$required' is not successful for $GITHUB_SHA: ${conclusion:-missing}" >&2
              exit 1
            fi
          done

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag and repository contracts
        run: |
          node scripts/check-release-tag.mjs
          npm run check

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit complete dependency tree
        run: npm audit --audit-level=moderate

      - name: Run discovered unit and policy tests
        run: npm run test:unit

      - name: Run Gateway smoke tests
        run: npm run smoke:gateway

      - name: Build release assets
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          mkdir -p release
          npx vsce package --out "release/devmate-${version}.vsix"
          npm run build:obsidian
          (
            cd obsidian-plugin/dist
            zip -q -9 "$GITHUB_WORKSPACE/release/devmate-obsidian-${version}.zip" \
              main.js manifest.json versions.json styles.css gateway/server.mjs
          )
          (
            cd release
            sha256sum *.vsix *.zip > SHA256SUMS
          )
          ls -lh release
          cat release/SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: 'release/devmate-*'

      - name: Upload release workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: devmate-release-${{ github.ref_name }}
          path: release/*
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --verify-tag \
              --title "DevMate ${version}" \
              --generate-notes
          fi
