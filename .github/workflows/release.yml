name: DevMate 4 Release

# Pushing a tag X.Y.Z that matches the package version and lies on main verifies that commit, builds
# one candidate and publishes exactly that build:
#   1. a GitHub release with the VS Code extension, the Obsidian plugin (as an archive and as the three
#      loose files Obsidian itself downloads), the command line package, checksums and build provenance;
#   2. the VS Code Marketplace;
#   3. Open VSX and npm, where the repository has switched them on (see CONTRIBUTING.md).
# The tag carries no "v": Obsidian finds the release of a community plugin by the bare version.
# A manual run on a branch does the same verification and keeps the result as a workflow artifact without
# publishing. Every publishing job can be run again after a failure: it completes what is missing.
on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devmate4-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Installs and runs third-party code, so it holds no permission to write to the repository.
  candidate:
    name: Verify and build one candidate
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag names the version being released and lies on main
        if: ${{ github.ref_type == 'tag' }}
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:TAG -ne $version) { throw "Tag $($env:TAG) does not match package version $version." }
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor $env:GITHUB_SHA refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw "Tagged commit $($env:GITHUB_SHA) is not contained in main." }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install ripgrep where the image lacks it
        shell: bash
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            case "$RUNNER_OS" in
              Linux) sudo apt-get update && sudo apt-get install --yes --no-install-recommends ripgrep ;;
              macOS) brew install ripgrep ;;
              Windows) choco install ripgrep --no-progress --yes ;;
            esac
          fi
          rg --version | head -n 1
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run lint
      - run: npm run check
      - run: npm run test:unit
      - name: Real VS Code extension host
        run: npm run test:vscode-host
      - name: Build, smoke-test and package one candidate
        run: npm run candidate
      - name: Attest where these files were built
        if: ${{ github.ref_type == 'tag' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: 'dist/release/*'
      - name: Keep the verified artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: devmate4-release-${{ github.run_id }}
          if-no-files-found: error
          path: |
            dist/release/*
            dist/release-notes.md
            dist/**/build-manifest.json

  github-release:
    name: Publish the GitHub release
    needs: candidate
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: devmate4-release-${{ github.run_id }}
          path: candidate
      # Running this job again after a failure completes the release instead of refusing it.
      - name: Create the release, or complete one that an earlier attempt left behind
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" candidate/release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" candidate/release/* --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "DevMate $TAG" --notes-file candidate/release-notes.md --generate-notes
          fi

  # A published Marketplace version cannot be replaced, so this runs last of the required steps.
  marketplace:
    name: Publish to the VS Code Marketplace
    needs: github-release
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install the locked publishing tool
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: devmate4-release-${{ github.run_id }}
          path: candidate
      - name: Sign in to Azure without a stored secret
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Publish the verified extension file
        env:
          TAG: ${{ github.ref_name }}
        run: npx vsce publish --azure-credential --packagePath "candidate/release/devmate-${TAG}.vsix" --skip-duplicate

  # Editors built on VS Code that are not Microsoft's (VSCodium, Cursor, Windsurf and others) install from Open VSX.
  # Off until the repository variable OPEN_VSX_PUBLISH is "true" and the secret OVSX_PAT holds a token.
  open-vsx:
    name: Publish to Open VSX
    needs: github-release
    if: ${{ github.ref_type == 'tag' && vars.OPEN_VSX_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: devmate4-release-${{ github.run_id }}
          path: candidate
      - name: Publish the verified extension file
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          TAG: ${{ github.ref_name }}
        run: npx --yes ovsx@1.2.0 publish "candidate/release/devmate-${TAG}.vsix" --skip-duplicate

  # `npx devmate-agent mcp` for any client that starts its MCP servers as a program.
  # Off until the repository variable NPM_PUBLISH is "true" and npmjs.com trusts this workflow as a publisher.
  npm:
    name: Publish the command line to npm
    needs: github-release
    if: ${{ github.ref_type == 'tag' && vars.NPM_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: devmate4-release-${{ github.run_id }}
          path: candidate
      - name: Publish the verified package file
        env:
          TAG: ${{ github.ref_name }}
        run: npm publish "candidate/release/devmate-cli-${TAG}.tgz" --access public --provenance
