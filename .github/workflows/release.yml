name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  checks: read
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tagged commit is merged to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main || {
            echo "Tagged commit $GITHUB_SHA is not contained in main" >&2
            exit 1
          }

      - name: Verify required CI checks passed for tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          checks=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100")
          for required in \
            "Windows, VS Code 1.133, Node 24 LTS" \
            "Node 26 Current compatibility" \
            "Linux and Real Godot 4.7.1" \
            "Portable CLI Windows" \
            "Portable CLI Linux"; do
            conclusion=$(printf '%s' "$checks" | jq -r --arg name "$required" '[.check_runs[] | select(.name == $name and .status == "completed")] | sort_by(.completed_at) | last | .conclusion // ""')
            if [ "$conclusion" != "success" ]; then
              echo "Required CI check '$required' is not successful for $GITHUB_SHA: ${conclusion:-missing}" >&2
              exit 1
            fi
          done

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag and repository contracts
        run: |
          node scripts/check-release-tag.mjs
          npm run check

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit complete dependency tree
        run: npm audit --audit-level=moderate

      - name: Run discovered unit and policy tests
        run: npm run test:unit

      - name: Run Gateway smoke tests
        run: npm run smoke:gateway

      - name: Build release assets
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          node_version=$(node -p "process.versions.node")
          mkdir -p release "$RUNNER_TEMP/devmate-node"
          npx vsce package --out "release/devmate-${version}.vsix"
          npm run package:obsidian
          (
            cd obsidian-plugin/dist
            zip -q -9 "$GITHUB_WORKSPACE/release/devmate-obsidian-${version}.zip" \
              main.js manifest.json versions.json styles.css provider-supervisor.cjs \
              gateway/server.mjs gateway/agent-codex-supervisor.mjs
          )

          cd "$RUNNER_TEMP/devmate-node"
          base="https://nodejs.org/dist/v${node_version}"
          win_archive="node-v${node_version}-win-x64.zip"
          linux_archive="node-v${node_version}-linux-x64.tar.xz"
          curl -fsSLO "${base}/SHASUMS256.txt"
          curl -fsSLO "${base}/${win_archive}"
          curl -fsSLO "${base}/${linux_archive}"
          grep -E "  (${win_archive}|${linux_archive})$" SHASUMS256.txt | sha256sum -c -
          unzip -q "$win_archive"
          tar -xf "$linux_archive"

          cd "$GITHUB_WORKSPACE"
          node scripts/package-portable.mjs \
            --platform win32 \
            --arch x64 \
            --node "$RUNNER_TEMP/devmate-node/node-v${node_version}-win-x64/node.exe" \
            --out "$RUNNER_TEMP/devmate-portable-win"
          node scripts/package-portable.mjs \
            --platform linux \
            --arch x64 \
            --node "$RUNNER_TEMP/devmate-node/node-v${node_version}-linux-x64/bin/node" \
            --out "$RUNNER_TEMP/devmate-portable-linux"
          node scripts/smoke-portable-cli.mjs \
            --root "$RUNNER_TEMP/devmate-portable-linux"

          (
            cd "$RUNNER_TEMP/devmate-portable-win"
            zip -q -9 -r "$GITHUB_WORKSPACE/release/devmate-${version}-windows-x64.zip" .
          )
          tar -C "$RUNNER_TEMP/devmate-portable-linux" -czf \
            "$GITHUB_WORKSPACE/release/devmate-${version}-linux-x64.tar.gz" .

          cd "$GITHUB_WORKSPACE/release"
          sha256sum *.vsix *.zip *.tar.gz > SHA256SUMS
          ls -lh
          cat SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: 'release/devmate-*'

      - name: Upload release workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: devmate-release-${{ github.ref_name }}
          path: release/*
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --verify-tag \
              --title "DevMate ${version}" \
              --generate-notes
          fi
