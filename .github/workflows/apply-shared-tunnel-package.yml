name: Apply Shared Tunnel Package Wiring

on:
  push:
    branches:
      - refactor/shared-tunnel-runtime
    paths:
      - .github/workflows/apply-shared-tunnel-package.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest branch
        uses: actions/checkout@v4
        with:
          ref: refactor/shared-tunnel-runtime
          fetch-depth: 0
      - name: Update package and VSIX contract
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const packageFile = 'package.json';
          const manifest = JSON.parse(fs.readFileSync(packageFile, 'utf8'));
          if (manifest.main !== './extension-entry-host.js' && manifest.main !== './extension-entry-shared-tunnel.js') {
            throw new Error(`Unexpected package main: ${manifest.main}`);
          }
          manifest.main = './extension-entry-shared-tunnel.js';
          fs.writeFileSync(packageFile, `${JSON.stringify(manifest, null, 2)}\n`, 'utf8');

          const smokeFile = 'scripts/smoke-vsix-worker.mjs';
          let smoke = fs.readFileSync(smokeFile, 'utf8');
          smoke = smoke.replace(
            "assert.equal(manifest.main, './extension-entry-host.js');",
            "assert.equal(manifest.main, './extension-entry-shared-tunnel.js');"
          );
          if (!smoke.includes("'extension-entry-shared-tunnel.js',")) {
            smoke = smoke.replace(
              "    'extension-entry-host.js',",
              "    'extension-entry-shared-tunnel.js',\n    'extension-entry-host.js',"
            );
          }
          if (!smoke.includes("'vscode-host/shared-tunnel-runtime.js',")) {
            smoke = smoke.replace(
              "    'vscode-host/spawn-layer.js',",
              "    'vscode-host/spawn-layer.js',\n    'vscode-host/shared-tunnel-runtime.js',"
            );
          }
          if (!smoke.includes("assert.equal(manifest.main, './extension-entry-shared-tunnel.js');")) {
            throw new Error('VSIX main contract was not updated');
          }
          if (!smoke.includes("'extension-entry-shared-tunnel.js',") || !smoke.includes("'vscode-host/shared-tunnel-runtime.js',")) {
            throw new Error('VSIX required-file contract was not updated');
          }
          fs.writeFileSync(smokeFile, smoke, 'utf8');
          NODE
          node --check extension-entry-shared-tunnel.js
          node --check vscode-host/shared-tunnel-runtime.js
          node --check tests/shared-tunnel-runtime.test.cjs
          node --check tests/shared-tunnel-entry-contract.test.cjs
          git rm .github/workflows/apply-shared-tunnel-package.yml
          git add package.json scripts/smoke-vsix-worker.mjs
          git config user.name kukutx
          git config user.email 61358650+Kukutx@users.noreply.github.com
          git commit -m "Activate shared tunnel runtime in VS Code package"
          git push origin HEAD:refactor/shared-tunnel-runtime
