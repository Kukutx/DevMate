<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DevMate</title>
<style>
  :root { color-scheme: light dark; --line: color-mix(in srgb, currentColor 18%, transparent); --accent: #1f6feb; --bad: #b3261e; }
  body { font: 13px/1.45 system-ui, sans-serif; margin: 0; padding: 12px 14px; width: 300px; }
  h1 { font-size: 14px; margin: 0 0 8px; display: flex; justify-content: space-between; align-items: baseline; }
  h1 small { font-weight: normal; opacity: .65; }
  #status { margin: 0 0 4px; font-weight: 600; }
  #detail { margin: 0 0 10px; opacity: .8; overflow-wrap: anywhere; }
  #detail.problem { color: var(--bad); opacity: 1; }
  code { font: 12px ui-monospace, Consolas, monospace; background: color-mix(in srgb, currentColor 9%, transparent); padding: 1px 4px; border-radius: 3px; }
  .actions { display: grid; gap: 6px; margin-bottom: 10px; }
  button { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; cursor: pointer; text-align: left; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  label { display: flex; gap: 8px; align-items: flex-start; padding-top: 10px; border-top: 1px solid var(--line); }
  label span { opacity: .8; }
  #note { margin: 8px 0 0; min-height: 1.4em; opacity: .8; }
</style>
</head>
<body>
  <h1>DevMate <small id="version"></small></h1>
  <p id="status">Checking…</p>
  <p id="detail"></p>
  <div class="actions">
    <button id="start" class="primary" hidden>Start DevMate</button>
    <button id="workbench" disabled>Open the workbench</button>
    <button id="copy" disabled>Copy the MCP address</button>
  </div>
  <label><input type="checkbox" id="autostart"><span>Start DevMate with the browser. Off: the browser only joins a DevMate that is already running.</span></label>
  <p id="note" role="status"></p>
  <script type="module" src="popup.js"></script>
</body>
</html>
