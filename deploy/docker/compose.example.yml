services:
  devmate:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - devmate-state:/var/lib/devmate
      - /srv/devmate-workspaces:/srv/devmate-workspaces
    environment:
      NODE_ENV: production
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  devmate-state:
